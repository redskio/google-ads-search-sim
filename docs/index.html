<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Google Ads 검색 캠페인 실습 시뮬레이터 — 브랜드 정보를 입력하고 캠페인을 게재하면 30일치 성과가 시뮬레이션되고 진단과 CSV 보고서가 나옵니다.">
<meta name="robots" content="noindex">
<title>Google Ads 검색 캠페인 실습 시뮬레이터</title>
<style>
:root{
  --bg:#f1f3f4; --surface:#fff; --surface-2:#f8f9fa; --surface-3:#f1f3f4;
  --border:#dadce0; --border-2:#e8eaed; --border-strong:#bdc1c6;
  --ink:#202124; --ink-2:#5f6368; --ink-3:#80868b;
  --blue:#1a73e8; --blue-h:#1765cc; --blue-soft:#e8f0fe; --blue-ink:#174ea6; --on-blue:#fff;
  --good:#188038; --good-soft:#e6f4ea; --good-line:#a8dab5;
  --warn:#b06000; --warn-soft:#fef7e0; --warn-line:#fde293;
  --crit:#c5221f; --crit-soft:#fce8e6; --crit-line:#f6aea9;
  --series:#1a73e8; --series-2:#a8c7fa; --series-3:#c6dafc; --mark-crit:#d93025;
  --grid:#e8eaed;
  --shadow-1:0 1px 2px 0 rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);
  --shadow-2:0 1px 3px 0 rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15);
  --rail:72px; --nav:232px;
  --sans:"Google Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#202124; --surface:#292a2d; --surface-2:#35363a; --surface-3:#3c4043;
    --border:#3c4043; --border-2:#35363a; --border-strong:#5f6368;
    --ink:#e8eaed; --ink-2:#9aa0a6; --ink-3:#80868b;
    --blue:#8ab4f8; --blue-h:#aecbfa; --blue-soft:#1f3047; --blue-ink:#8ab4f8; --on-blue:#202124;
    --good:#81c995; --good-soft:#1d3324; --good-line:#2f6b41;
    --warn:#fdd663; --warn-soft:#33290d; --warn-line:#7a611b;
    --crit:#f28b82; --crit-soft:#3a1f1d; --crit-line:#7d3a34;
    --series:#4285f4; --series-2:#3b5b8c; --series-3:#2b3f5e; --mark-crit:#e8564a;
    --grid:#3c4043;
    --shadow-1:0 1px 2px 0 rgba(0,0,0,.6),0 1px 3px 1px rgba(0,0,0,.3);
    --shadow-2:0 1px 3px 0 rgba(0,0,0,.6),0 4px 8px 3px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#202124; --surface:#292a2d; --surface-2:#35363a; --surface-3:#3c4043;
  --border:#3c4043; --border-2:#35363a; --border-strong:#5f6368;
  --ink:#e8eaed; --ink-2:#9aa0a6; --ink-3:#80868b;
  --blue:#8ab4f8; --blue-h:#aecbfa; --blue-soft:#1f3047; --blue-ink:#8ab4f8; --on-blue:#202124;
  --good:#81c995; --good-soft:#1d3324; --good-line:#2f6b41;
  --warn:#fdd663; --warn-soft:#33290d; --warn-line:#7a611b;
  --crit:#f28b82; --crit-soft:#3a1f1d; --crit-line:#7d3a34;
  --series:#4285f4; --series-2:#3b5b8c; --series-3:#2b3f5e; --mark-crit:#e8564a;
  --grid:#3c4043;
  --shadow-1:0 1px 2px 0 rgba(0,0,0,.6),0 1px 3px 1px rgba(0,0,0,.3);
  --shadow-2:0 1px 3px 0 rgba(0,0,0,.6),0 4px 8px 3px rgba(0,0,0,.3);
}
:root[data-theme="light"]{
  --bg:#f1f3f4; --surface:#fff; --surface-2:#f8f9fa; --surface-3:#f1f3f4;
  --border:#dadce0; --border-2:#e8eaed; --border-strong:#bdc1c6;
  --ink:#202124; --ink-2:#5f6368; --ink-3:#80868b;
  --blue:#1a73e8; --blue-h:#1765cc; --blue-soft:#e8f0fe; --blue-ink:#174ea6; --on-blue:#fff;
  --good:#188038; --good-soft:#e6f4ea; --good-line:#a8dab5;
  --warn:#b06000; --warn-soft:#fef7e0; --warn-line:#fde293;
  --crit:#c5221f; --crit-soft:#fce8e6; --crit-line:#f6aea9;
  --series:#1a73e8; --series-2:#a8c7fa; --series-3:#c6dafc; --mark-crit:#d93025;
  --grid:#e8eaed;
  --shadow-1:0 1px 2px 0 rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);
  --shadow-2:0 1px 3px 0 rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15);
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}

/* ─── App chrome ─────────────────────────────────────── */
.topbar{position:sticky;top:0;z-index:40;height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 12px}
.brand{display:flex;align-items:center;gap:10px;padding-left:4px}
.brand-mark{width:26px;height:26px;flex:none}
.brand-text{font-size:20px;letter-spacing:-.2px}
.brand-text b{font-weight:500}
.brand-text span{color:var(--ink-2)}
.topbar-spacer{flex:1}
.topbar-acts{display:flex;align-items:center;gap:2px}
.tb-btn{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;border-radius:8px;padding:6px 10px;color:var(--ink-2);font-size:11px}
.tb-btn:hover{background:var(--surface-2)}
.tb-btn svg{width:20px;height:20px}
.acct{text-align:right;padding:0 12px;border-left:1px solid var(--border);margin-left:8px;line-height:1.35}
.acct b{display:block;font-weight:500;font-size:13px}
.acct span{color:var(--ink-2);font-size:12px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:500;flex:none}
:root[data-theme="dark"] .avatar,:root:not([data-theme="light"]) .avatar{color:#fff}

.shell{display:flex;min-height:calc(100vh - 56px)}
.rail{width:var(--rail);flex:none;background:var(--surface);border-right:1px solid var(--border);padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:4px;position:sticky;top:56px;height:calc(100vh - 56px)}
.fab{width:48px;height:48px;border-radius:50%;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-1);display:grid;place-items:center;margin-bottom:2px}
.fab:hover{background:var(--surface-2);box-shadow:var(--shadow-2)}
.fab svg{width:24px;height:24px}
.rail-label{font-size:11px;color:var(--ink-2);margin-bottom:10px}
.rail-item{width:100%;background:none;border:0;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-2);font-size:11px}
.rail-item svg{width:22px;height:22px}
.rail-item:hover{color:var(--ink)}
.rail-item[aria-current="true"]{color:var(--blue)}

.nav{width:var(--nav);flex:none;background:var(--surface);border-right:1px solid var(--border);padding:12px 8px;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto}
.nav-item{width:100%;text-align:left;background:none;border:0;border-radius:0 20px 20px 0;padding:9px 16px;color:var(--ink);font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav-item:hover{background:var(--surface-2)}
.nav-item[aria-current="page"]{background:var(--blue);color:var(--on-blue);font-weight:500}
.nav-group>.nav-item{color:var(--ink-2)}
.nav-sub{display:none;padding:4px 0}
.nav-group[open] .nav-sub{display:block}
.nav-sub .nav-item{padding-left:34px;font-size:13.5px}
.nav-chev{width:18px;height:18px;transition:transform .15s}
.nav-group[open] .nav-chev{transform:rotate(180deg)}

.main{flex:1;min-width:0;padding:20px 24px 64px}
.page-head{display:flex;align-items:center;gap:16px;margin-bottom:4px;flex-wrap:wrap}
.page-title{font-size:24px;font-weight:400;margin:0}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:13px;box-shadow:var(--shadow-1)}
.head-right{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink-2)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:14px 0 0}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 16px 9px;color:var(--ink-2);font-size:14px;border-radius:8px 8px 0 0}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-selected="true"]{color:var(--blue);border-bottom-color:var(--blue);font-weight:500}

.toolbar{display:flex;align-items:center;gap:10px;padding:14px 0}
.toolbar .spacer{flex:1}

/* ─── Buttons ────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:20px;padding:9px 22px;border:1px solid transparent;font-size:14px;font-weight:500;background:var(--surface);color:var(--blue)}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--blue);color:var(--on-blue);box-shadow:var(--shadow-1)}
.btn-primary:hover{background:var(--blue-h);box-shadow:var(--shadow-2)}
.btn-outline{border-color:var(--border-strong);background:transparent}
.btn-outline:hover{background:var(--blue-soft)}
.btn-text{background:none;padding:9px 14px}
.btn-text:hover{background:var(--blue-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-sm{padding:6px 14px;font-size:13px}
.icon-btn{background:none;border:0;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:20px;height:20px}

/* ─── Cards & tables ─────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--border-2);border-radius:8px;box-shadow:var(--shadow-1)}
.card-head{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--border-2)}
.card-head h3{margin:0;font-size:15px;font-weight:500}
.card-head .sub{color:var(--ink-2);font-size:12.5px}
.card-body{padding:20px}
.grid{display:grid;gap:16px}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:1px;background:var(--border-2);border-radius:8px;overflow:hidden;border:1px solid var(--border-2)}
.stat{background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:5px}
.stat .k{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.stat .v{font-size:24px;font-weight:400;letter-spacing:-.3px}
.stat .d{font-size:12px;color:var(--ink-3)}
.stat .d.bad{color:var(--crit)}
.stat .d.ok{color:var(--good)}

.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
table.tbl th,table.tbl td{padding:11px 14px;text-align:right;border-bottom:1px solid var(--border-2);white-space:nowrap}
table.tbl th{color:var(--ink-2);font-weight:500;font-size:12.5px;position:sticky;top:0;background:var(--surface)}
table.tbl th:first-child,table.tbl td:first-child{text-align:left}
table.tbl tbody tr:hover{background:var(--surface-2)}
table.tbl tfoot td{font-weight:500;border-top:2px solid var(--border);border-bottom:0;background:var(--surface-2)}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:4px;padding:2px 8px;font-size:11.5px;font-weight:500;white-space:nowrap}
.tag-good{background:var(--good-soft);color:var(--good);border:1px solid var(--good-line)}
.tag-warn{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-line)}
.tag-crit{background:var(--crit-soft);color:var(--crit);border:1px solid var(--crit-line)}
.tag-mute{background:var(--surface-3);color:var(--ink-2);border:1px solid var(--border)}
.qs{display:inline-block;min-width:26px;text-align:center;border-radius:4px;padding:2px 6px;font-weight:500;font-variant-numeric:tabular-nums}

.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:56px 24px;text-align:center}
.empty h3{margin:0;font-size:19px;font-weight:400}
.empty p{margin:0;color:var(--ink-2);max-width:46ch}

/* ─── Forms ──────────────────────────────────────────── */
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:12.5px;color:var(--ink-2)}
.inp{background:var(--surface);border:1px solid var(--border-strong);border-radius:4px;padding:11px 13px;font-size:14px;width:100%}
.inp:focus{border-color:var(--blue);outline:1px solid var(--blue);outline-offset:-1px}
textarea.inp{min-height:96px;resize:vertical;line-height:1.6}
.hint{font-size:12px;color:var(--ink-3)}
.hint.warn{color:var(--warn)}
.counter{font-size:11.5px;color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums}
.counter.over{color:var(--crit)}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--border);border-radius:8px;padding:14px 16px;cursor:pointer;background:var(--surface)}
.opt:hover{background:var(--surface-2)}
.opt.sel{border-color:var(--blue);border-width:2px;padding:13px 15px;background:var(--blue-soft)}
.opt input{margin-top:3px;accent-color:var(--blue)}
.opt .t{font-weight:500}
.opt .d{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.goal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}

/* ─── Wizard ─────────────────────────────────────────── */
.wizard{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column}
.wizard.on{display:flex}
.wiz-top{height:56px;flex:none;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 12px}
.wiz-body{flex:1;display:flex;overflow:hidden}
.wiz-steps{width:266px;flex:none;padding:26px 18px;overflow-y:auto;border-right:1px solid var(--border);background:var(--surface)}
.step{display:flex;gap:12px;align-items:flex-start;padding:9px 10px;border-radius:8px;color:var(--ink-2);font-size:13.5px}
.step .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--border-strong);display:grid;place-items:center;font-size:11px;flex:none;font-weight:500}
.step.done .dot{background:var(--good);border-color:var(--good);color:var(--surface)}
.step.now{background:var(--blue-soft);color:var(--blue-ink);font-weight:500}
.step.now .dot{border-color:var(--blue);color:var(--blue)}
.wiz-main{flex:1;overflow-y:auto;padding:34px 40px 120px;display:flex;justify-content:center}
.wiz-inner{width:100%;max-width:780px;display:flex;flex-direction:column;gap:22px}
.wiz-h{font-size:26px;font-weight:400;margin:0}
.wiz-sub{color:var(--ink-2);margin:6px 0 0}
.wiz-foot{position:absolute;bottom:0;left:266px;right:0;background:var(--surface);border-top:1px solid var(--border);padding:14px 40px;display:flex;gap:12px;align-items:center}
.wiz-foot .spacer{flex:1}

/* ─── Diagnostics ────────────────────────────────────── */
.diag{display:flex;gap:14px;padding:16px 18px;border:1px solid var(--border);border-left-width:4px;border-radius:8px;background:var(--surface)}
.diag.sev-high{border-left-color:var(--mark-crit)}
.diag.sev-mid{border-left-color:var(--warn)}
.diag.sev-low{border-left-color:var(--ink-3)}
.diag.sev-ok{border-left-color:var(--good)}
.diag-ico{width:22px;height:22px;flex:none;margin-top:1px}
.diag h4{margin:0 0 4px;font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.diag p{margin:0 0 8px;color:var(--ink-2);font-size:13.5px}
.diag .ev{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2);margin-bottom:8px}
.diag .ev b{color:var(--ink);font-variant-numeric:tabular-nums}
.diag .fix{font-size:13.5px;background:var(--surface-2);border-radius:6px;padding:10px 12px}
.diag .fix b{font-weight:500}

.verdict{display:flex;gap:18px;align-items:center;padding:22px;border-radius:8px;border:1px solid var(--border-2);background:var(--surface);box-shadow:var(--shadow-1)}
.verdict .score{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;font-size:27px;font-weight:500;flex:none;font-variant-numeric:tabular-nums}
.verdict h3{margin:0 0 4px;font-size:18px;font-weight:500}
.verdict p{margin:0;color:var(--ink-2);font-size:13.5px}

/* ─── Charts ─────────────────────────────────────────── */
.chart-wrap{position:relative}
.chart-wrap svg{display:block;width:100%;height:auto;overflow:visible}
.ax{font-size:11px;fill:var(--ink-3);font-variant-numeric:tabular-nums}
.gridline{stroke:var(--grid);stroke-width:1}
.axline{stroke:var(--border);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);border-radius:6px;padding:8px 11px;font-size:12.5px;line-height:1.55;white-space:nowrap;opacity:0;transition:opacity .1s;z-index:5;box-shadow:var(--shadow-2)}
.tip b{font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12.5px;color:var(--ink-2);padding-top:4px}
.legend i{width:11px;height:11px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:-1px}
.metric-switch{display:flex;gap:6px;flex-wrap:wrap}
.mbtn{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:5px 14px;font-size:12.5px;color:var(--ink-2)}
.mbtn:hover{background:var(--surface-2)}
.mbtn[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue);color:var(--blue-ink);font-weight:500}

/* ─── Brief / misc ───────────────────────────────────── */
.brief{border:1px solid var(--border-2);border-radius:8px;background:var(--surface);box-shadow:var(--shadow-1);overflow:hidden}
.brief summary{padding:14px 20px;cursor:pointer;font-weight:500;display:flex;align-items:center;gap:10px;list-style:none}
.brief summary::-webkit-details-marker{display:none}
.brief summary .chev{width:18px;height:18px;margin-left:auto;transition:transform .15s;color:var(--ink-2)}
.brief[open] summary .chev{transform:rotate(180deg)}
.brief .body{padding:0 20px 20px;border-top:1px solid var(--border-2);padding-top:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:13.5px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface-3);border:1px solid var(--border);border-radius:14px;padding:4px 11px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.chip button{background:none;border:0;padding:0;color:var(--ink-2);display:grid;place-items:center}
.chip button:hover{color:var(--crit)}
.serp{border:1px solid var(--border);border-radius:8px;padding:16px 18px;background:var(--surface)}
.serp .badge{font-size:11px;font-weight:700;border:1px solid var(--ink);border-radius:3px;padding:0 4px;margin-right:6px}
.serp .u{font-size:12.5px;color:var(--ink-2)}
.serp .t{color:#1a0dab;font-size:19px;line-height:1.3;margin:2px 0 3px}
:root[data-theme="dark"] .serp .t{color:#8ab4f8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .serp .t{color:#8ab4f8}}
.serp .d{font-size:13.5px;color:var(--ink-2)}
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:8px;padding:14px 16px;font-size:13.5px}
.banner-warn{background:var(--warn-soft);border:1px solid var(--warn-line);color:var(--ink)}
.banner-info{background:var(--blue-soft);border:1px solid var(--blue);color:var(--ink)}
.banner svg{width:20px;height:20px;flex:none;margin-top:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.nav-backdrop{display:none}
@media (max-width:560px){
  .acct{display:none}
  #btnHelp{display:none}
  .opt{flex-wrap:wrap}
  .opt>.btn{width:100%;justify-content:center;margin-top:4px}
  .toolbar{flex-wrap:wrap}
  .card-body{padding:16px}
  .card-head{padding:12px 16px;flex-wrap:wrap}
  .wiz-h{font-size:21px}
  .verdict .score{width:64px;height:64px;font-size:22px}
}
@media (max-width:1000px){
  .rail{display:none}

   시드 기반 난수를 쓰므로 같은 설정이면 같은 결과가 나온다.        */
function gaussRand(rng) {
  let u = 0, v = 0;
  while (u === 0) u = rng();
  while (v === 0) v = rng();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);

function tokenize(s) {

function recommendedCpa(biz, goal) {
  const ind = INDUSTRIES[biz.industry] || INDUSTRIES.edu;
  const md = MODELS[biz.model] || MODELS.onetime;
  const g = GOALS[goal] || GOALS.sales;
  const typicalCpc = 1150 * ind.cpc;
  const cvr = Math.max(0.003, g.cvr * ind.cvr * md.cvr);
  const mid = typicalCpc / cvr;
  const round = v => Math.round(v / 500) * 500;
  return { low: round(mid * 0.8), mid: round(mid), high: round(mid * 1.3) };
}

/* ── 키워드 의도 사전 ────────────────────────────────── */
const INTENT_RULES = [
  { re: /(구매|주문|결제|신청|등록|가입|구독|할인|쿠폰|특가|최저가|가격|얼마|비용|요금)/, intent: "transactional", cvr: 1.55, cpc: 1.35, vol: 0.75 },
  { re: /(추천|후기|리뷰|비교|순위|best|top|어디|어느|브랜드)/i, intent: "commercial", cvr: 1.0, cpc: 1.1, vol: 1.0 },
  { re: /(무료|공짜|토렌트|다운|다운로드|뜻|의미|방법|하는법|하는 법|효과|원리|차이|채용|구인|알바|자격증|중고|당근)/, intent: "informational", cvr: 0.12, cpc: 0.5, vol: 1.9 },
];
function classifyKeyword(kw, prof) {
  const k = kw.trim();
  let intent = "commercial", cvrM = 1.0, cpcM = 1.0, volM = 1.0;
  for (const r of INTENT_RULES) {
    if (r.re.test(k)) { intent = r.intent; cvrM = r.cvr; cpcM = r.cpc; volM = r.vol; break; }
  }
  const words = k.split(/\s+/).filter(Boolean).length;
  const tail = words >= 3 ? "long" : words === 2 ? "mid" : "head";
  /* 검색량: 짧을수록 많고, 롱테일일수록 적지만 전환은 좋음 */
  const base = tail === "head" ? 42000 : tail === "mid" ? 11000 : 2600;
  /* 브랜드 검색: 우리 업체명이 들어간 검색어.
     경쟁이 거의 없어 싸고 잘 전환되지만, 신생 브랜드일수록 검색량 자체가 적다. */
  const kl = k.toLowerCase();
  const isBrand = [...prof.brandTok].some(b => b.length > 1 && kl.includes(b));

  let volume = Math.round(base * volM * (0.45 + rnd1(k, "vol") * 1.5));
  if (isBrand) volume = Math.round(volume * 0.05);   /* 신생 브랜드는 자기 이름 검색량 자체가 적다 */
  let competition = clamp(0.2 + rnd1(k, "comp") * 0.6 + prof.ind.comp * 0.25 + (intent === "transactional" ? 0.1 : 0), 0.05, 0.98);
  if (isBrand) competition = clamp(competition * 0.22, 0.03, 0.35);
  let marketCpc = Math.round((320 + competition * 2400) * cpcM * prof.ind.cpc * (0.8 + rnd1(k, "cpc") * 0.5) / 10) * 10;
  if (isBrand) marketCpc = Math.round(marketCpc * 0.42 / 10) * 10;

  /* 브랜드 적합도: 이 키워드가 우리 사업의 언어와 얼마나 겹치는가 */
  const toks = tokenize(k);
  const hit = toks.filter(t => prof.brand.has(t) || [...prof.brand].some(b => b.length > 1 && (t.includes(b) || b.includes(t)))).length;
  const brandFit = clamp(hit / Math.max(1, toks.length), 0, 1);
  const offTarget = isOffTarget(k, prof);

  /* 전환 배수: 의도 × 롱테일 × 브랜드 적합도 × 업종 × 상품유형 */
  const cvrMult = cvrM * (tail === "long" ? 1.35 : tail === "mid" ? 1.05 : 0.78)
    * (0.35 + brandFit * 0.95) * prof.ind.cvr * prof.model.cvr * (offTarget ? 0.06 : 1)
    * (isBrand ? 2.6 : 1);
  return { text: k, intent, tail, volume, competition, marketCpc, cvrMult, offTarget, brandFit, words, isBrand };
}

/* ── 검색어(쿼리) 생성기 ─────────────────────────────── */
const DRIFT_PRE = ["무료", "저렴한", "중고", "가까운", "동네", "초보", "직접"];
const CLOSE_SUF = ["가격", "요금", "신청", "후기", "추천", "비교", "할인", "문의"];

function buildQueries(kwObj, matchType, rng, prof) {
  /* 각 키워드가 실제로 매칭될 검색어들 — 확장검색일수록 멀리 퍼진다.
     흘러가는 방향은 업종의 "고객이 아닌 검색" 테마를 따른다. */
  const out = [];
  const k = kwObj.text;
  const driftSuf = [...prof.ind.off, "추천", "후기", "블로그"];
  out.push({ q: k, rel: "exact", share: 1.0 });
  if (matchType !== "exact") {
    const n = matchType === "broad" ? 6 : 3;
    for (let i = 0; i < n; i++) {
      const useSuf = rng() > 0.35;
      const w = useSuf ? CLOSE_SUF[Math.floor(rng() * CLOSE_SUF.length)] : DRIFT_PRE[Math.floor(rng() * DRIFT_PRE.length)];
      const q = useSuf ? k + " " + w : w + " " + k;
      out.push({ q, rel: isOffTarget(q, prof) ? "off" : "close", share: 0.45 + rng() * 0.5 });
    }
  }
  if (matchType === "broad") {
    for (let i = 0; i < 5; i++) {
      const head = k.split(/\s+/)[0];
      const w = driftSuf[Math.floor(rng() * driftSuf.length)];
      const q = head + " " + w;
      out.push({ q, rel: isOffTarget(q, prof) ? "off" : "loose", share: 0.3 + rng() * 0.55 });
    }
  }
  /* 중복 정리 */
  const seen = new Map();
  for (const o of out) { if (!seen.has(o.q)) seen.set(o.q, o); }
  const arr = [...seen.values()];
  const total = arr.reduce((s, o) => s + o.share, 0);
  arr.forEach(o => { o.w = o.share / total; });
  return arr;
}
const REL_WEIGHT = { exact: 1.0, close: 0.62, loose: 0.22, off: 0.05 };

/* ── 품질평가점수 ────────────────────────────────────── */
function qualityScore(kwObj, ad, matchType, prof) {
  const kws = kwObj.text.toLowerCase().split(/\s+/).filter(w => w.length > 1);
  const heads = ad.headlines.join(" ").toLowerCase();
  const descs = ad.descriptions.join(" ").toLowerCase();
  const urlText = (ad.finalUrl + " " + ad.path1 + " " + ad.path2).toLowerCase().replace(/[^\p{L}\p{N}]/gu, " ");
  const bizText = (prof.biz.desc + " " + prof.biz.name + " " + prof.biz.audience).toLowerCase();

  const inHead = kws.filter(w => heads.includes(w)).length / Math.max(1, kws.length);
  const inDesc = kws.filter(w => descs.includes(w)).length / Math.max(1, kws.length);
  const inUrl = kws.filter(w => urlText.includes(w)).length / Math.max(1, kws.length);
  const inBiz = kws.filter(w => bizText.includes(w)).length / Math.max(1, kws.length);

  /* 광고문구가 실제 브랜드를 말하고 있는가 (업체명 노출) */
  const brandNamed = prof.biz.name && heads.includes(prof.biz.name.toLowerCase().split(/\s+/)[0]) ? 0.12 : 0;
  /* 광고 URL이 비즈니스 도메인과 같은가 — 다르면 방문 페이지 신뢰도가 떨어진다 */
  const dom = u => (String(u).match(/https?:\/\/([^/]+)/) || [, ""])[1].replace(/^www\./, "").toLowerCase();
  const sameDomain = dom(ad.finalUrl) && dom(ad.finalUrl) === dom(prof.biz.url) ? 1 : dom(ad.finalUrl) ? 0.45 : 0;

  /* 1. 광고 관련성 (0~3.5) */
  const relevance = 3.5 * clamp(inHead * 0.62 + inDesc * 0.24 + kwObj.brandFit * 0.28 - (kwObj.offTarget ? 0.45 : 0), 0, 1);
  /* 2. 예상 CTR (0~3.5) — 소재 분량, CTA, 검색유형 정합 */
  const assetDepth = clamp((ad.headlines.length - 3) / 12, 0, 1) * 0.5 + clamp((ad.descriptions.length - 2) / 2, 0, 1) * 0.25;
  const cta = /(신청|시작|무료|지금|받기|알아보기|둘러보기|체험|구독|할인|문의|예약)/.test(heads + descs) ? 0.22 : 0;
  const ext = clamp((ad.sitelinks.length / 4) * 0.6 + (ad.callouts.length / 4) * 0.4, 0, 1) * 0.3;
  const ctrScore = 3.5 * clamp(assetDepth + cta + ext + brandNamed + (matchType === "exact" ? 0.2 : matchType === "broad" ? -0.05 : 0.08) + inHead * 0.32, 0, 1);
  /* 3. 방문 페이지 만족도 (0~3) — 키워드가 우리 사업 설명·URL과 맞는가 */
  const landing = 3 * clamp(0.18 + inUrl * 0.3 + inBiz * 0.3 + sameDomain * 0.28 + (ad.path1 ? 0.08 : 0) - (kwObj.offTarget ? 0.4 : 0), 0, 1);

  const qs = clamp(Math.round(relevance + ctrScore + landing), 1, 10);
  return {
    qs, sameDomain, inHead,
    parts: {
      relevance: relevance >= 2.4 ? "평균 이상" : relevance >= 1.4 ? "평균" : "평균 미만",
      ctr: ctrScore >= 2.4 ? "평균 이상" : ctrScore >= 1.4 ? "평균" : "평균 미만",
      landing: landing >= 2.1 ? "평균 이상" : landing >= 1.3 ? "평균" : "평균 미만",
    },
  };
}

   일치 = 검색어가 정확히 같을 때, 구문 = 그 표현이 순서대로 들어 있을 때,
   확장 = 단어가 모두 들어 있을 때(순서 무관).                        */
function negBlocks(query, negs) {
  if (!negs || !negs.length) return null;
  const q = String(query).toLowerCase().trim();
  const qTok = q.split(/\s+/);
  for (const n of negs) {
    const t = String(n.text || "").toLowerCase().trim();
    if (!t) continue;
    if (n.match === "exact") { if (q === t) return n; }
    else if (n.match === "phrase") { if (q.includes(t)) return n; }
    else {
      const nt = t.split(/\s+/);
      if (nt.every(w => qTok.some(x => x.includes(w)))) return n;
    }
  }
  return null;
}

/* ── 디스플레이 게재위치 ──────────────────────────────

   무관 게재위치는 오히려 CTR이 높다 — 모바일 앱의 실수 클릭 때문. */
const PLACEMENT_JUNK = [
  "모바일 게임 앱 · 퍼즐", "무료 배경화면 앱", "배터리 절약 앱", "모바일 게임 앱 · 디펜스",
  "만화 뷰어 앱", "날씨 위젯 앱", "손전등 앱", "모바일 게임 앱 · 러닝",
];
const PLACEMENT_LOOSE = [
  "종합 포털 뉴스면", "연예 뉴스 사이트", "커뮤니티 게시판", "블로그 플랫폼", "날씨 정보 사이트",
];
const PLACEMENT_REL_SUFFIX = ["전문 매체", "정보 블로그", "리뷰 사이트", "커뮤니티", "비교 사이트"];
const DISPLAY_TARGETING = {
  audience: { name: "잠재고객 (관심분야·구매의도)", reach: 1.00, junk: 0.34, loose: 0.30, desc: "가장 넓게 도달합니다. 무관한 앱·사이트가 많이 섞입니다." },
  topic:    { name: "주제", reach: 0.62, junk: 0.20, loose: 0.32, desc: "콘텐츠 주제로 좁힙니다. 도달과 정확도의 중간." },
  placement:{ name: "게재위치 직접 지정", reach: 0.24, junk: 0.05, loose: 0.18, desc: "내가 고른 곳에만 노출합니다. 정확하지만 물량이 적습니다." },
};
function buildPlacements(prof, disp, rng) {
  const mode = DISPLAY_TARGETING[disp.targeting] || DISPLAY_TARGETING.audience;
  const head = prof.ind.name.split(" · ")[0];
  const rel = PLACEMENT_REL_SUFFIX.map(s => head + " " + s);
  const out = [];
  const push = (arr, kind, total) => arr.forEach((n, i) => out.push({ name: n, rel: kind, raw: (0.5 + rng()) * total / arr.length }));
  push(rel, "relevant", 1 - mode.junk - mode.loose);
  push(PLACEMENT_LOOSE, "loose", mode.loose);
  push(PLACEMENT_JUNK, "junk", mode.junk);
  const excluded = new Set((disp.excludedPlacements || []).map(s => String(s).trim()));
  const live = out.filter(p => !excluded.has(p.name));
  const sum = live.reduce((s, p) => s + p.raw, 0) || 1;
  live.forEach(p => { p.w = p.raw / sum; });
  return { list: live, blocked: out.filter(p => excluded.has(p.name)), mode };
}
/* 디스플레이 게재위치별 성과 계수 — 무관한 곳은 클릭은 나오지만 전환이 없다 */
const PLACE_CTR = { relevant: 1.0, loose: 1.25, junk: 2.6 };
const PLACE_CVR = { relevant: 1.0, loose: 0.22, junk: 0.02 };

/* ── 캠페인 설정 정규화 ───────────────────────────────
   예전 형태(keywords + ad 단일)를 광고그룹 구조로 올린다. */
function normCfg(cfg) {
  const c = { ...cfg };
  c.type = c.type || "search";
  c.negatives = c.negatives || [];
  c.bidAdj = { ...DEFAULT_BIDADJ, ...(c.bidAdj || {}),
    device: { ...DEFAULT_BIDADJ.device, ...((c.bidAdj || {}).device || {}) },
    block: { ...DEFAULT_BIDADJ.block, ...((c.bidAdj || {}).block || {}) } };
  c.display = { targeting: "audience", frequencyCap: 3, excludedPlacements: [], ...(c.display || {}) };
  if (!c.adGroups) {
    c.adGroups = [{ name: c.adGroup || "광고그룹 1", keywords: c.keywords || [], ad: c.ad }];
  }
  return c;
}

function simulate(rawCfg) {
  const cfg = normCfg(rawCfg);
  const prof = bizProfile(cfg.biz);
  const isDisplay = cfg.type === "display";

  /* 전환 액션 설정이 전환 집계에 그대로 반영된다 */
  const cAct = cfg.biz.conv || DEFAULT_CONV;
  const catRate = (CONV_CATEGORIES[cAct.category] || CONV_CATEGORIES.purchase).rate;
  const countMult = (COUNT_MODES[cAct.countMode] || COUNT_MODES.one).mult;
  const convLag = prof.ind.lag;
  const windowCapture = clamp(1 - Math.max(0, convLag - cAct.window / 3) * 0.1, 0.4, 1);

  /* 시드는 '트래픽을 결정하는 것'만으로 만든다. */
  const b0 = cfg.biz;
  const seed = hashStr(JSON.stringify({
    t: cfg.type, g: cfg.goal, b: cfg.bidding, bd: cfg.budget, cpa: cfg.targetCpa, cpc: cfg.maxCpc,
    geo: cfg.geo, lang: cfg.lang, ag: cfg.adGroups, neg: cfg.negatives, adj: cfg.bidAdj,
    net: cfg.displayExpansion, disp: cfg.display,
    biz: [b0.name, b0.industry, b0.model, b0.url, b0.desc, b0.audience, b0.exclude, b0.period, b0.price],
  }));
  const rng = mulberry32(seed);
  const days = cfg.biz.period || 30;
  const goal = GOALS[cfg.goal];
  const bid = BIDDING[cfg.bidding];
  const geo = GEOS[cfg.geo], lang = LANGS[cfg.lang];
  const adj = cfg.bidAdj;

  /* ── 광고그룹 · 키워드 준비 ── */
  const groups = cfg.adGroups.map((g, gi) => {
    const ad = g.ad;
    const extBoost = 1
      + clamp(ad.sitelinks.length / 4, 0, 1) * 0.12
      + clamp(ad.callouts.length / 4, 0, 1) * 0.06
      + clamp((ad.headlines.length - 3) / 12, 0, 1) * 0.08;
    /* 자격 선별(qualifying) — 광고문구에 가격·조건을 밝히면 클릭은 줄지만
       클릭한 사람의 구매 의사는 높다. 반대로 "무료·할인"만 앞세우면
       클릭은 몰리는데 전환은 안 된다. 클릭률과 전환율을 떼어놓는 실제 장치다. */
    const adText = (ad.headlines.join(" ") + " " + ad.descriptions.join(" ")).toLowerCase();
    const priced = /(원|만원|유료|구독료|월 정액|프리미엄|기업 전용|b2b|견적)/.test(adText);
    const baiting = /(무료|공짜|이벤트|추첨|경품|100%|최저가)/.test(adText);
    const qualCtr = (priced ? 0.80 : 1) * (baiting ? 1.28 : 1);
    const qualCvr = (priced ? 1.48 : 1) * (baiting ? 0.55 : 1);
    const kws = (g.keywords || []).map(k => {
      const o = classifyKeyword(k.text, prof);
      const q = qualityScore(o, ad, k.match, prof);
      /* 잠재 요인 — 같은 품질평가점수라도 소재가 유난히 잘 먹히거나,
         클릭은 오는데 페이지에서 이탈하는 경우가 있다.
         깔때기 단계를 서로 떼어놓아 "클릭은 좋은데 전환이 없다" 같은
         상황이 실제로 나타나게 한다. */
      const creativeMult = 0.70 + mulberry32(hashStr(k.text + "|c|" + ad.headlines.join("~") + ad.descriptions.join("~")))() * 0.70;
      const pageMult = 0.62 + mulberry32(hashStr(k.text + "|p|" + ad.finalUrl + "|" + prof.biz.url))() * 0.90;
      let queries = buildQueries(o, k.match, mulberry32(hashStr(k.text + k.match + cfg.biz.industry)), prof);
      /* 제외 키워드로 걸러진 검색어는 아예 노출되지 않는다 */
      queries = queries.map(x => ({ ...x, blockedBy: negBlocks(x.q, cfg.negatives) }));
      const live = queries.filter(x => !x.blockedBy);
      const liveSum = live.reduce((s, x) => s + x.share, 0) || 1;
      live.forEach(x => { x.w = x.share / liveSum; });
      /* 제외 키워드가 키워드 자기 자신까지 막아버린 경우 */
      const selfBlocked = !!(queries.find(x => x.q === o.text) || {}).blockedBy;
      const blockedShare = 1 - (liveSum / (queries.reduce((s, x) => s + x.share, 0) || 1));
      return { ...o, match: k.match, qs: q.qs, qsParts: q.parts, sameDomain: q.sameDomain,
        creativeMult, pageMult, copyFit: q.inHead,
        group: g.name, groupIndex: gi, queries: live, allQueries: queries, selfBlocked, blockedShare };
    });
    return { name: g.name, ad, extBoost, qualCtr, qualCvr, priced, baiting, kws, index: gi };
  });
  const kws = groups.flatMap(g => g.kws);

  /* 디스플레이 확장 (검색 캠페인 옵션) */
  const DISPLAY = { extraVol: 6, ctr: 0.12, cvr: 0.06, cpc: 0.30 };
  let dispMix = { vol: 1, ctr: 1, cvr: 1, cpc: 1 };
  if (!isDisplay && cfg.displayExpansion) {
    const v = 1 + DISPLAY.extraVol;
    const clickRatio = 1 + DISPLAY.extraVol * DISPLAY.ctr;
    dispMix = { vol: v, ctr: clickRatio / v,
      cvr: (1 + DISPLAY.extraVol * DISPLAY.ctr * DISPLAY.cvr) / clickRatio,
      cpc: (1 + DISPLAY.extraVol * DISPLAY.ctr * DISPLAY.cpc) / clickRatio };
  }

  /* 디스플레이 캠페인 게재위치 */
  const placeSet = isDisplay ? buildPlacements(prof, cfg.display, mulberry32(hashStr(cfg.display.targeting + cfg.biz.industry))) : null;
  const freqCap = isDisplay ? clamp(cfg.display.frequencyCap || 3, 1, 20) : 1;

  /* 입찰가 결정 */
  const marketAvg = isDisplay
    ? Math.round(340 * prof.ind.cpc)
    : (kws.reduce((s, k) => s + k.marketCpc, 0) / Math.max(1, kws.length)) || 1000;
  let bidCap;
  if (cfg.bidding === "manual_cpc") bidCap = cfg.maxCpc;
  else if (cfg.bidding === "max_clicks") bidCap = cfg.maxCpc || marketAvg * 1.15;
  else if (cfg.bidding === "target_cpa") bidCap = cfg.targetCpa * goal.cvr;
  else bidCap = marketAvg * 1.2;

  /* 집계 그릇 */
  const daily = [];
  const kwAgg = kws.map(k => ({ kw: k, group: k.group, impr: 0, clicks: 0, cost: 0, conv: 0, lostRank: 0 }));
  const kwIndex = new Map(kws.map((k, i) => [k.group + "||" + k.text + "||" + k.match, i]));
  const groupAgg = groups.map(g => ({ name: g.name, impr: 0, clicks: 0, cost: 0, conv: 0,
    avgQs: g.kws.length ? g.kws.reduce((s, k) => s + k.qs, 0) / g.kws.length : 0, keywords: g.kws.length }));
  const qAgg = new Map(), placeAgg = new Map(), negAgg = new Map();
  const devAgg = {}; DEVICES.forEach(dv => devAgg[dv] = { impr: 0, clicks: 0, cost: 0, conv: 0 });
  const hourAgg = Array.from({ length: 24 }, () => ({ impr: 0, clicks: 0, cost: 0, conv: 0 }));
  const HOUR_W = HOUR_SHAPES[prof.ind.hours] || HOUR_SHAPES.daytime;
  const blockShare = {}, blockHours = {};
  HOUR_BLOCKS.forEach(b => {
    blockHours[b.key] = [];
    let s = 0;
    for (let h = b.from; h < b.to; h++) { s += HOUR_W[h]; blockHours[b.key].push(h); }
    blockShare[b.key] = s;
  });
  const devSplit = prof.ind.dev;

  for (let d = 0; d < days; d++) {
    const dow = (d + 3) % 7;
    const weekend = dow === 5 || dow === 6;
    const season = (weekend ? prof.ind.seasonWeekend : 1.06) * (0.94 + rng() * 0.12);
    const learn = d < bid.learnDays ? 0.55 + 0.45 * (d / Math.max(1, bid.learnDays)) : 1;
    const learnCpa = d < bid.learnDays ? 1.45 - 0.45 * (d / Math.max(1, bid.learnDays)) : 1;
    const monthEnd = d >= days - 5 ? 1.06 : 1;
    const pressure = (0.78 + rng() * 0.46) * (weekend ? 0.92 : 1.04) * monthEnd;
    const cvrDay = (0.82 + rng() * 0.36) * (weekend ? 0.88 : 1.05);
    const wkAdj = weekend ? (1 + adj.weekend) : 1;

    let dayImpr = 0, dayClicks = 0, dayCost = 0, dayConv = 0, dayLostBudget = 0, dayLostRank = 0;
    /* 예산은 하루 전체에 걸쳐 모든 키워드·지면에 나뉘어 쓰인다.
       먼저 제약 없는 수요를 모두 계산한 뒤, 예산을 넘으면 전체를 같은 비율로 줄인다.
       (순서대로 소진시키면 앞쪽 키워드가 예산을 독식해 버린다.) */
    const segs = [];
    let rawCost = 0;
    let budgetCapped = false;

    const lagRamp = convLag > 0 ? clamp((d + 1) / (convLag + 1), 0, 1) : 1;
    const trackOk = (cAct.enabled && cfg.conversionTracking)
      ? catRate * countMult * windowCapture * lagRamp : 0;
    const geoFit = geo.mismatch ? 0.35 : 1;
    const langFit = lang.mismatch ? 0.4 : 1;

    /* 노출 단위: (키워드 또는 게재위치) × 기기 × 시간대 블록 */
    const units = [];
    if (isDisplay) {
      const pool = 52000 * geo.mult * lang.mult * season;
      placeSet.list.forEach(p => units.push({ kind: "place", p, base: pool * p.w }));
    } else {
      groups.forEach(g => g.kws.forEach(k => {
        const m = MATCH[k.match];
        units.push({ kind: "kw", g, k, base: (k.volume / 30) * m.reach * geo.mult * lang.mult * season * dispMix.vol });
      }));
    }

    for (const u of units) {
      for (const dv of DEVICES) {
        const devW = devSplit[dv];
        const devMult = 1 + (adj.device[dv] || 0);
        for (const blk of HOUR_BLOCKS) {
          const bw = blockShare[blk.key];
          if (bw <= 0) continue;
          const blkMult = 1 + (adj.block[blk.key] || 0);
          const effBid = Math.max(0, bidCap * devMult * blkMult * wkAdj);
          let eligible = u.base * devW * bw;
          let impr, clicks, cpc, convRate, lostRank = 0;

          if (u.kind === "kw") {
            const k = u.k, g = u.g, m = MATCH[k.match];
            const myRank = effBid * k.qs;
            const compRank = k.marketCpc * (5.2 + k.competition * 3.4) * pressure;
            const rankRatio = myRank / Math.max(1, compRank);
            const isRank = clamp(0.96 * (1 - Math.exp(-1.9 * rankRatio)), 0, 0.94);
            const avgPos = clamp(1 + 3.6 * Math.exp(-2.1 * rankRatio), 1, 5.2);
            const imprMean = eligible * isRank * learn;
            impr = samplePoisson(imprMean, rng);
            lostRank = Math.max(0, eligible - impr);
            const relAvg = k.queries.reduce((s, q) => s + q.w * REL_WEIGHT[q.rel], 0);
            const baseCtr = posCtr(avgPos) * m.ctrMult;
            const qsCtrBoost = 0.68 + (k.qs / 10) * 0.62;
            const ctr = clamp(baseCtr * qsCtrBoost * (0.55 + relAvg * 0.6) * g.extBoost * dispMix.ctr * k.creativeMult * g.qualCtr * (0.48 + k.copyFit * 0.62), 0.0002, 0.35);
            clicks = sampleBinom(impr, ctr, rng);
            const rawPrice = (compRank * 0.86) / Math.max(1, k.qs) + 10;
            cpc = rawPrice <= effBid ? rawPrice : effBid * (0.86 + 0.12 * clamp(effBid / rawPrice, 0, 1));
            cpc = clamp(cpc, 100, Math.max(100, effBid)) * dispMix.cpc;
            if (cfg.bidding === "max_clicks") cpc *= 0.88;
            if (cfg.bidding === "max_conv" || cfg.bidding === "target_cpa") cpc *= learnCpa;
            /* 방문 페이지 — 광고에서 약속한 것과 다른 곳으로 보내면 전환은 무너진다 */
            const landingFit = (g.ad.finalUrl && g.ad.finalUrl.startsWith("http") ? 1 : 0.22)
              * (k.sameDomain === 1 ? 1 : k.sameDomain ? 0.34 : 0.24);
            convRate = goal.cvr * k.cvrMult * (0.6 + (k.qs / 10) * 0.7) * landingFit * geoFit * langFit * dispMix.cvr * cvrDay * k.pageMult * g.qualCvr;
            if (cfg.bidding === "target_cpa" || cfg.bidding === "max_conv") convRate *= (d < bid.learnDays ? 0.7 : 1.12);
          } else {
            /* 디스플레이 — 순위 경쟁보다 예산이 주된 제약. 빈도가 높을수록 반응이 떨어진다 */
            const p = u.p;
            const freqDecay = 1 / (1 + 0.14 * (freqCap - 1));
            impr = samplePoisson(eligible * clamp(effBid / Math.max(1, marketAvg * 1.6), 0.05, 1.6) * learn, rng);
            lostRank = Math.max(0, eligible - impr);
            const ctr = clamp(0.0062 * PLACE_CTR[p.rel] * freqDecay, 0.0002, 0.08);
            clicks = sampleBinom(impr, ctr, rng);
            cpc = clamp(marketAvg * (0.55 + pressure * 0.5), 90, Math.max(100, effBid));
            const landingFit = (groups[0].ad.finalUrl || "").startsWith("http") ? 1 : 0.3;
            convRate = goal.cvr * 0.16 * PLACE_CVR[p.rel] * prof.ind.cvr * prof.model.cvr
              * landingFit * geoFit * langFit * cvrDay;
          }

          const cost = clicks * cpc;
          if (impr <= 0) { dayLostRank += lostRank; continue; }
          rawCost += cost;
          segs.push({ u, dv, blk, bw, impr, clicks, cost, lostRank,
            cvr: convRate * DEV_CVR[dv] * BLOCK_CVR[blk.key] * trackOk });
        }
      }
    }

    /* 예산 제약을 전체에 비례 적용 */
    const capTotal = cfg.budget * 1.2;
    let scale = 1;
    if (rawCost > capTotal) { scale = capTotal / rawCost; budgetCapped = true; }

    for (const sg of segs) {
      const impr = sg.impr * scale, clicks = sg.clicks * scale, cost = sg.cost * scale;
      dayLostBudget += sg.impr * (1 - scale);
      dayLostRank += sg.lostRank;
      const segCvr = sg.cvr;
      const dv = sg.dv, bw = sg.bw;

      devAgg[dv].impr += impr; devAgg[dv].clicks += clicks; devAgg[dv].cost += cost;
      blockHours[sg.blk.key].forEach(h => {
        const hw = HOUR_W[h] / bw;
        hourAgg[h].impr += impr * hw; hourAgg[h].clicks += clicks * hw; hourAgg[h].cost += cost * hw;
      });

      let segConv = 0;
      if (sg.u.kind === "kw") {
        const k = sg.u.k;
        k.queries.forEach(q => {
          const qc = clicks * q.w;
          const qconv = sampleBinom(qc, clamp(segCvr * REL_WEIGHT[q.rel], 0, 1), rng);
          const key = q.q + "||" + k.text;
          const prev = qAgg.get(key) || { q: q.q, kw: k.text, group: k.group, match: k.match, rel: q.rel, impr: 0, clicks: 0, cost: 0, conv: 0 };
          prev.impr += impr * q.w; prev.clicks += qc; prev.cost += cost * q.w; prev.conv += qconv;
          qAgg.set(key, prev);
          segConv += qconv;
        });
        const ki = kwIndex.get(k.group + "||" + k.text + "||" + k.match);
        const a = kwAgg[ki];
        a.impr += impr; a.clicks += clicks; a.cost += cost; a.conv += segConv; a.lostRank += sg.lostRank;
        const ga = groupAgg[k.groupIndex];
        ga.impr += impr; ga.clicks += clicks; ga.cost += cost; ga.conv += segConv;
      } else {
        const p = sg.u.p;
        segConv = sampleBinom(clicks, clamp(segCvr, 0, 1), rng);
        const prev = placeAgg.get(p.name) || { name: p.name, rel: p.rel, impr: 0, clicks: 0, cost: 0, conv: 0 };
        prev.impr += impr; prev.clicks += clicks; prev.cost += cost; prev.conv += segConv;
        placeAgg.set(p.name, prev);
        groupAgg[0].impr += impr; groupAgg[0].clicks += clicks; groupAgg[0].cost += cost; groupAgg[0].conv += segConv;
      }

      devAgg[dv].conv += segConv;
      blockHours[sg.blk.key].forEach(h => { hourAgg[h].conv += segConv * (HOUR_W[h] / bw); });
      dayImpr += impr; dayClicks += clicks; dayCost += cost; dayConv += segConv;
    }

    daily.push({
      day: d + 1, date: dateStr(d), weekend,
      impr: dayImpr, clicks: dayClicks, cost: dayCost, conv: dayConv,
      lostBudget: dayLostBudget, lostRank: dayLostRank, budgetCapped, learning: d < bid.learnDays,
    });
  }

  /* 제외 키워드가 실제로 막은 것 집계 (참고용) */
  kws.forEach(k => (k.allQueries || []).forEach(q => {
    if (!q.blockedBy) return;
    const key = q.blockedBy.text + "||" + q.blockedBy.match;
    const prev = negAgg.get(key) || { text: q.blockedBy.text, match: q.blockedBy.match, blocked: [] };
    if (!prev.blocked.includes(q.q)) prev.blocked.push(q.q);
    negAgg.set(key, prev);
  }));

  const tot = daily.reduce((s, r) => ({
    impr: s.impr + r.impr, clicks: s.clicks + r.clicks, cost: s.cost + r.cost, conv: s.conv + r.conv,
    lostBudget: s.lostBudget + r.lostBudget, lostRank: s.lostRank + r.lostRank,
  }), { impr: 0, clicks: 0, cost: 0, conv: 0, lostBudget: 0, lostRank: 0 });

  const convValue = cAct.valueMode === "none" ? 0
    : cAct.valueMode === "dynamic" ? (cAct.value || cfg.biz.price) * 1.15 * prof.model.ltvMult
      : (cAct.value || cfg.biz.price) * prof.model.ltvMult;

  const queries = [...qAgg.values()].sort((a, b) => b.cost - a.cost);
  const placements = [...placeAgg.values()].sort((a, b) => b.cost - a.cost);
  const wasteCost = isDisplay
    ? placements.filter(p => p.rel === "junk" || p.rel === "loose").reduce((s, p) => s + p.cost, 0)
    : queries.filter(q => q.rel === "off" || q.rel === "loose").reduce((s, q) => s + q.cost, 0);
  const totalEligible = tot.impr + tot.lostBudget + tot.lostRank;
  const m = {
    ...tot,
    ctr: tot.clicks / Math.max(1, tot.impr),
    cpc: tot.cost / Math.max(1, tot.clicks),
    cpa: tot.conv > 0.5 ? tot.cost / tot.conv : Infinity,
    cvr: tot.clicks > 0 ? tot.conv / tot.clicks : 0,
    revenue: tot.conv * convValue, roas: tot.cost > 0 ? (tot.conv * convValue) / tot.cost : 0,
    convValue, catRate, countMult, windowCapture, convLag,
    isSearch: tot.impr / Math.max(1, totalEligible),
    isLostBudget: tot.lostBudget / Math.max(1, totalEligible),
    isLostRank: tot.lostRank / Math.max(1, totalEligible),
    wasteCost, wasteShare: wasteCost / Math.max(1, tot.cost), marketAvg,
    avgQs: kws.length ? kws.reduce((s, k) => s + k.qs, 0) / kws.length : 0,
    groupCount: groups.length, negCount: cfg.negatives.length,
  };

  return {
    cfg, seed, daily, keywords: kwAgg, groups: groupAgg, queries, placements,
    negatives: [...negAgg.values()], placeSet,
    devices: devAgg, hours: hourAgg, metrics: m, kws, bidCap, marketAvg, prof, isDisplay,
  };
}

function dateStr(offset) {
  const base = new Date(2026, 6, 6);            // 2026-07-06 시작 (30일 → 08-04 종료)
  const d = new Date(base.getTime() + offset * 86400000);
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
const DOW = ["일", "월", "화", "수", "목", "금", "토"];
function dowOf(ds) { const [y, m, d] = ds.split("-").map(Number); return DOW[new Date(y, m - 1, d).getDay()]; }

/* ════════════════════════════════════════════════════════
   진단 엔진 — "무엇이 문제였는가"
   각 진단은 근거 숫자와 조치를 함께 낸다.
   ════════════════════════════════════════════════════════ */
function diagnose(sim) {
  const { metrics: m, cfg, kws, queries, prof, placements, isDisplay } = sim;
  const t = cfg.biz.targets;
  const AG = cfg.adGroups || [{ name: "광고그룹 1", keywords: cfg.keywords || [], ad: cfg.ad }];
  const allKw = AG.flatMap(g => g.keywords || []);
  const thinAd = AG.slice().sort((a, b) =>
    (a.ad.headlines.length + a.ad.descriptions.length) - (b.ad.headlines.length + b.ad.descriptions.length))[0];
  const anyExt = AG.some(g => g.ad.sitelinks.length || g.ad.callouts.length);
  const out = [];
  const add = (sev, title, why, ev, fix) => out.push({ sev, title, why, ev, fix });

  /* 1. 예산 제약 */
  if (m.isLostBudget >= 0.15) {
    add(m.isLostBudget >= 0.35 ? "high" : "mid", "예산이 수요를 못 따라갑니다",
      "노출될 수 있었는데 예산이 떨어져 못 나간 비중이 큽니다. 하루 중 이른 시간에 예산이 소진되면 오후·저녁의 좋은 트래픽을 통째로 놓칩니다.",
      [["노출 손실(예산)", pct(m.isLostBudget, 1)], ["일일 예산", won(cfg.budget)], ["예산 소진일", sim.daily.filter(d => d.budgetCapped).length + "일 / " + sim.daily.length + "일"]],
      "일일 예산을 올리거나, 성과가 낮은 키워드를 빼서 남은 예산을 좋은 키워드에 몰아주세요.");
  }
  /* 2. 검색유형이 너무 넓다 */
  if (!isDisplay && m.wasteShare >= 0.22) {
    const worst = queries.filter(q => q.rel === "off" || q.rel === "loose").slice(0, 3).map(q => q.q);
    add(m.wasteShare >= 0.4 ? "high" : "mid", "고객이 아닌 검색어에 돈이 새고 있습니다",
      "확장검색은 도달을 넓히지만, 우리 고객이 아닌 검색까지 끌어옵니다. 이 비용은 전환으로 이어지지 않습니다.",
      [["무관·느슨한 검색어 비용", won(m.wasteCost)], ["전체 비용 대비", pct(m.wasteShare, 1)], ["예시", worst.join(", ") || "-"]],
      "검색어 보고서에서 무관한 검색어를 제외 키워드로 추가하고, 핵심 키워드는 구문검색 또는 일치검색으로 좁히세요.");
  }
  /* 3. 품질평가점수 */
  if (!isDisplay && m.avgQs <= 5.5) {
    const low = kws.filter(k => k.qs <= 5).map(k => k.text).slice(0, 3);
    add(m.avgQs <= 4 ? "high" : "mid", "품질평가점수가 낮아 클릭당비용이 비쌉니다",
      "품질평가점수가 낮으면 같은 순위를 얻는 데 더 많은 돈을 내야 합니다. 광고문구에 키워드가 없거나, 방문 페이지가 검색 의도와 어긋날 때 떨어집니다.",
      [["평균 품질평가점수", m.avgQs.toFixed(1) + " / 10"], ["평균 CPC", won(m.cpc)], ["낮은 키워드", low.join(", ") || "-"]],
      "제목에 키워드를 그대로 넣고, 키워드별로 광고그룹을 쪼개세요. 방문 페이지도 그 키워드를 말하는 페이지여야 합니다.");
  }
  /* 4. 광고 소재 부족 */
  if (thinAd && (thinAd.ad.headlines.length < 8 || thinAd.ad.descriptions.length < 3)) {
    add(thinAd.ad.headlines.length < 5 ? "mid" : "low", "광고 소재가 부족합니다",
      "반응형 검색광고는 제목·설명 조합을 실험해 성과를 올립니다. 자산이 적으면 실험할 조합 자체가 없습니다.",
      [["광고그룹", thinAd.name], ["제목", thinAd.ad.headlines.length + "개 (권장 8~15)"], ["설명", thinAd.ad.descriptions.length + "개 (권장 4)"], ["CTR", pct(m.ctr, 2)]],
      "제목을 최소 8개까지 채우고, 혜택·가격·신뢰·행동유도를 각각 다른 각도로 쓰세요.");
  }
  /* 5. 타겟 CPA가 비현실적 */
  if (cfg.bidding === "target_cpa") {
    const rec = recommendedCpa(cfg.biz, cfg.goal);
    if (cfg.targetCpa < rec.low * 0.65) {
      add("high", "타겟 CPA가 시장에서 달성 불가능한 수준입니다",
        "타겟 CPA가 너무 낮으면 시스템이 입찰을 포기해 노출 자체가 나오지 않습니다. 성과가 나쁜 게 아니라 경매에 참여를 못 한 것입니다.",
        [["설정한 타겟 CPA", won(cfg.targetCpa)], ["권장 범위", won(rec.low) + " ~ " + won(rec.high)], ["노출 손실(순위)", pct(m.isLostRank, 1)]],
        "타겟 CPA를 권장 범위까지 올려 데이터를 쌓은 뒤, 2주 단위로 10~15%씩 낮추세요.");
    } else if (cfg.targetCpa > rec.high * 1.6) {
      add("low", "타겟 CPA가 필요 이상으로 높습니다",
        "전환은 나오지만 더 싸게 살 수 있는 전환을 비싸게 사고 있습니다.",
        [["설정한 타겟 CPA", won(cfg.targetCpa)], ["권장 범위", won(rec.low) + " ~ " + won(rec.high)], ["실제 CPA", m.cpa === Infinity ? "측정 불가" : won(m.cpa)]],
        "타겟 CPA를 단계적으로 낮추며 전환수가 유지되는 지점을 찾으세요.");
    }
  }
  /* 6. 전환 추적 */
  if (!cfg.conversionTracking && m.clicks >= 30) {
    add("high", "전환 추적이 꺼져 있어 성과를 측정할 수 없습니다",
      "전환 데이터가 없으면 자동 입찰이 학습할 근거가 없고, 어떤 키워드가 돈을 벌어주는지도 알 수 없습니다.",
      [["클릭수", int(m.clicks)], ["측정된 전환", "0"], ["비용", won(m.cost)]],
      "목표 → 전환 화면에서 전환 액션을 정의하고, 캠페인 설정에서 전환 추적을 켜세요.");
  }
  /* 6-2. 전환 액션 정의가 성과를 부풀리는 경우 */
  const cA = cfg.biz.conv || DEFAULT_CONV;
  if (cA.enabled && (cA.category === "pageview" || cA.category === "addtocart") && m.conv >= 1) {
    add("mid", "전환 정의가 느슨해 성과가 부풀려져 있습니다",
      "“" + CONV_CATEGORIES[cA.category].name + "”은(는) 매출과 거리가 먼 행동입니다. 전환수는 커 보이지만 실제로 돈이 들어온 건 아닙니다. 자동 입찰도 이 잘못된 신호를 향해 최적화됩니다.",
      [["전환 카테고리", CONV_CATEGORIES[cA.category].name], ["집계된 전환", m.conv.toFixed(1) + "건"], ["기준 대비 빈도", Math.round(CONV_CATEGORIES[cA.category].rate * 100) + "%"]],
      "실제 매출이 일어나는 시점(구매·구독 신청·리드 제출)으로 전환 액션을 바꾸세요. 느슨한 지표는 '전환수' 열에서 빼고 관찰용으로만 두면 됩니다.");
  }
  if (cA.enabled && !cA.includeInConversions) {
    add("high", "전환 액션이 '전환수' 열에서 빠져 있습니다",
      "관찰만 하도록 설정되어 있어 자동 입찰이 이 전환을 최적화 대상으로 쓰지 못합니다.",
      [["전환 액션", cA.name], ["'전환수' 포함", "아니오"], ["입찰 전략", BIDDING[cfg.bidding].name]],
      "주요 성과라면 '전환수' 열에 포함시키세요. 스마트 입찰은 이 열만 보고 학습합니다.");
  }
  if (cA.enabled && m.windowCapture < 0.95) {
    add("mid", "전환 추적 기간이 짧아 전환을 놓치고 있습니다",
      "이 업종은 클릭 후 며칠 지나 전환되는데, 추적 기간이 그보다 짧아 뒤늦은 전환이 집계되지 않습니다.",
      [["추적 기간", cA.window + "일"], ["이 업종 평균 전환 지연", m.convLag + "일"], ["놓친 비율", Math.round((1 - m.windowCapture) * 100) + "%"]],
      "전환 추적 기간을 " + (m.convLag >= 5 ? "60~90일" : "30일") + "로 늘리세요.");
  }

  /* 7. 지역·언어 미스매치 */
  if (GEOS[cfg.geo].mismatch || LANGS[cfg.lang].mismatch) {
    add("mid", "타겟 지역·언어가 실제 고객과 어긋납니다",
      "노출은 늘지만 우리 서비스를 이용할 수 없는 사용자에게 돈을 씁니다.",
      [["지역", GEOS[cfg.geo].name], ["언어", LANGS[cfg.lang].name], ["전환율", pct(m.cvr, 2)]],
      "실제로 상품을 제공할 수 있는 지역과, 사이트가 지원하는 언어로만 좁히세요.");
  }
  /* 8. 광고 확장 미사용 */
  if (!anyExt && !isDisplay) {
    add("low", "광고 확장을 쓰지 않아 광고가 작게 보입니다",
      "사이트링크·콜아웃은 광고 면적을 넓혀 클릭률을 올립니다. 추가 비용 없이 얻는 CTR입니다.",
      [["사이트링크", "0개"], ["콜아웃", "0개"], ["CTR", pct(m.ctr, 2)]],
      "사이트링크 4개, 콜아웃 4개를 추가하세요.");
  }
  /* 9. 입찰가 부족 */
  if (m.isLostRank >= 0.5) {
    add(m.isLostRank >= 0.7 ? "high" : "mid", "입찰이 약해 경매에서 밀리고 있습니다",
      "광고순위가 낮아 노출 기회를 대부분 경쟁사에 내주고 있습니다. 광고순위는 입찰가 × 품질평가점수입니다.",
      [["노출 손실(순위)", pct(m.isLostRank, 1)], ["노출 점유율", pct(m.isSearch, 1)], ["시장 평균 CPC", won(sim.marketAvg)]],
      "입찰가를 시장 평균 CPC 수준까지 올리거나, 품질평가점수를 올려 같은 입찰가로 더 높은 순위를 받으세요.");
  }
  /* 10. 키워드 구성 */
  const broadCount = allKw.filter(k => k.match === "broad").length;
  if (!isDisplay && allKw.length <= 3) {
    add("low", "키워드가 너무 적어 트래픽이 제한됩니다",
      "키워드가 적으면 도달할 수 있는 검색 자체가 적습니다.",
      [["키워드 수", allKw.length + "개"], ["총 노출수", int(m.impr)]],
      "핵심 키워드에서 파생된 롱테일 키워드를 10~20개까지 늘리세요.");
  } else if (!isDisplay && broadCount === allKw.length && allKw.length > 0) {
    add("mid", "모든 키워드가 확장검색입니다",
      "제어 장치 없이 확장검색만 쓰면 예산이 어디로 갈지 통제할 수 없습니다.",
      [["확장검색", broadCount + "개 / " + allKw.length + "개"], ["무관 비용 비중", pct(m.wasteShare, 1)]],
      "핵심 키워드는 구문·일치검색으로 두고, 확장검색은 새 검색어 발굴용으로 소수만 쓰세요.");
  }
  /* 11. 오프타겟 키워드를 직접 넣은 경우 */
  const offKw = kws.filter(k => k.offTarget);
  if (offKw.length) {
    add("high", "우리 고객이 아닌 키워드를 직접 입찰하고 있습니다",
      "비즈니스 정보에 적은 업종·제외 조건과 정면으로 어긋나는 키워드입니다. 클릭은 나오지만 전환은 거의 없습니다.",
      [["해당 키워드", offKw.map(k => k.text).join(", ")], ["소진 비용", won(sim.keywords.filter(a => a.kw.offTarget).reduce((s, a) => s + a.cost, 0))]],
      "이 키워드들을 삭제하고, 같은 표현을 제외 키워드로도 등록하세요.");
  }
  /* 12. 학습 기간 */
  if (BIDDING[cfg.bidding].learnDays > 0) {
    const learnCost = sim.daily.filter(d => d.learning).reduce((s, d) => s + d.cost, 0);
    add("low", "자동 입찰 학습 기간이 초반 성과를 눌렀습니다",
      "스마트 입찰은 데이터를 모으는 동안 일부러 다양한 입찰을 시도합니다. 이 기간의 성과는 정상보다 낮게 나오는 것이 정상입니다.",
      [["학습 기간", BIDDING[cfg.bidding].learnDays + "일"], ["학습 기간 비용", won(learnCost)], ["입찰 전략", BIDDING[cfg.bidding].name]],
      "학습 기간에는 설정을 바꾸지 말고 기다리세요. 중간에 바꾸면 학습이 처음부터 다시 시작됩니다.");
  }

  /* 13. 제외 키워드를 전혀 쓰지 않음 */
  if (!isDisplay && cfg.negatives.length === 0 && m.wasteShare >= 0.12) {
    const worst = queries.filter(q => q.rel === "off" || q.rel === "loose").slice(0, 4).map(q => q.q);
    add(m.wasteShare >= 0.3 ? "high" : "mid", "제외 키워드를 한 개도 등록하지 않았습니다",
      "검색어 보고서에서 무관한 검색어를 찾아 제외 키워드로 등록하는 것이 검색 광고 운영의 핵심 반복 작업입니다. 지금은 발견만 하고 막지 않은 상태입니다.",
      [["제외 키워드", "0개"], ["새는 비용", won(m.wasteCost)], ["막을 후보", worst.join(", ") || "-"]],
      "검색어 화면에서 무관한 검색어 옆의 '제외 키워드로 추가'를 누른 뒤 다시 게재해 보세요.");
  }
  /* 14. 제외 키워드가 너무 세서 자기 키워드까지 막음 */
  const selfBlocked = kws.filter(k => k.selfBlocked);
  if (selfBlocked.length) {
    add("high", "제외 키워드가 내 키워드까지 막고 있습니다",
      "제외 키워드의 범위가 너무 넓어 정작 노려야 할 검색어까지 차단했습니다. 노출이 통째로 사라집니다.",
      [["막힌 키워드", selfBlocked.map(k => k.text).join(", ")], ["제외 키워드 수", cfg.negatives.length + "개"]],
      "제외 키워드를 구문검색이나 일치검색으로 좁히세요. 확장 제외는 단어가 모두 들어가기만 하면 막습니다.");
  } else {
    const overBlocked = kws.filter(k => k.blockedShare > 0.55 && !k.selfBlocked);
    if (overBlocked.length) {
      add("mid", "제외 키워드가 유효한 검색어까지 많이 막고 있습니다",
        "관련 있는 검색어까지 함께 걸러져 도달할 수 있는 트래픽이 줄었습니다.",
        [["영향받은 키워드", overBlocked.map(k => k.text).join(", ")], ["차단된 검색어 비중", pct(overBlocked[0].blockedShare, 0)]],
        "제외 키워드를 더 구체적으로 바꾸세요.");
    }
  }
  /* 15. 광고그룹 분리 */
  if (!isDisplay && AG.length === 1 && allKw.length >= 6) {
    add("mid", "키워드를 광고그룹 하나에 모두 넣었습니다",
      "광고문구는 하나인데 키워드 주제가 여러 개면, 어떤 키워드에도 딱 맞지 않는 광고가 됩니다. 품질평가점수가 떨어지고 클릭당비용이 올라갑니다.",
      [["광고그룹", "1개"], ["키워드", allKw.length + "개"], ["평균 품질평가점수", m.avgQs.toFixed(1)]],
      "주제가 비슷한 키워드끼리 3~5개씩 묶어 광고그룹을 나누고, 그룹마다 그 주제를 그대로 말하는 광고를 쓰세요.");
  }
  /* 16. 입찰 조정 미사용 — 기기별 성과 격차가 큰데 조정이 없을 때 */
  if (!isDisplay) {
    const adjUsed = DEVICES.some(dv => (cfg.bidAdj.device[dv] || 0) !== 0)
      || HOUR_BLOCKS.some(b => (cfg.bidAdj.block[b.key] || 0) !== 0) || cfg.bidAdj.weekend !== 0;
    const dv = Object.entries(sim.devices).map(([k, v]) => ({ k, cpa: v.conv > 0.5 ? v.cost / v.conv : Infinity, cost: v.cost }))
      .filter(x => x.cost > 0 && x.cpa !== Infinity).sort((a, b) => a.cpa - b.cpa);
    if (!adjUsed && dv.length >= 2 && dv[dv.length - 1].cpa > dv[0].cpa * 1.6) {
      add("mid", "기기별 성과 차이가 큰데 입찰 조정을 쓰지 않았습니다",
        "같은 입찰가로 모든 기기에 노출하고 있습니다. 잘 되는 기기에 더 쓰고 안 되는 기기에서 줄이면 같은 예산으로 더 많은 전환을 얻습니다.",
        [["가장 좋은 기기", DEV_LABEL[dv[0].k] + " CPA " + won(dv[0].cpa)],
         ["가장 나쁜 기기", DEV_LABEL[dv[dv.length - 1].k] + " CPA " + won(dv[dv.length - 1].cpa)],
         ["입찰 조정", "미사용"]],
        DEV_LABEL[dv[0].k] + " 입찰을 올리고 " + DEV_LABEL[dv[dv.length - 1].k] + " 입찰을 낮춰 보세요.");
    }
  }
  /* 17. 디스플레이 전용 */
  if (isDisplay) {
    const junk = placements.filter(p => p.rel === "junk");
    const junkCost = junk.reduce((s, p) => s + p.cost, 0);
    if (junkCost / Math.max(1, m.cost) >= 0.12) {
      add(junkCost / Math.max(1, m.cost) >= 0.3 ? "high" : "mid", "무관한 앱·사이트에 예산이 새고 있습니다",
        "디스플레이는 노출 지면을 시스템이 고릅니다. 모바일 게임 앱 같은 곳에서는 실수 클릭이 많아 클릭률은 오히려 높지만 전환은 거의 없습니다.",
        [["무관 게재위치 비용", won(junkCost)], ["전체 대비", pct(junkCost / Math.max(1, m.cost), 1)],
         ["예시", junk.slice(0, 3).map(p => p.name).join(", ")]],
        "게재위치 보고서에서 이런 지면을 제외하세요. 검색의 제외 키워드와 같은 작업입니다.");
    }
    if ((cfg.display.frequencyCap || 3) >= 6) {
      add("mid", "노출 빈도가 너무 높습니다",
        "같은 사람에게 반복 노출하면 반응이 급격히 떨어지고 예산만 소모합니다.",
        [["빈도 한도", cfg.display.frequencyCap + "회/일"], ["CTR", pct(m.ctr, 3)]],
        "빈도 한도를 2~3회로 낮추고 남는 예산을 새로운 사용자에게 쓰세요.");
    }
    if (cfg.display.targeting === "audience" && m.wasteShare >= 0.4) {
      add("mid", "타겟팅이 너무 넓습니다",
        "잠재고객 타겟팅은 도달이 가장 넓은 대신 관련성이 가장 낮습니다.",
        [["타겟팅", DISPLAY_TARGETING[cfg.display.targeting].name], ["무관·느슨한 비용", pct(m.wasteShare, 1)]],
        "주제 타겟팅으로 좁히거나, 성과가 확인된 게재위치만 직접 지정하세요.");
    }
  }

  /* 목표 달성 채점 */
  const convScore = clamp(m.conv / Math.max(1, t.conversions), 0, 1.2) * 45;
  /* CPA 점수는 의미 있는 물량이 나왔을 때만 온전히 인정한다.
     입찰을 최소로 낮춰 전환 몇 건만 싸게 얻는 편법을 막는다. */
  const volumeGate = clamp(m.conv / Math.max(1, t.conversions * 0.5), 0, 1);
  const cpaScore = m.conv < 1 ? 0 : clamp(t.cpa / Math.max(1, m.cpa), 0, 1.2) * 35 * volumeGate;
  const effScore = (clamp(1 - m.wasteShare, 0, 1) * 12 + clamp(m.avgQs / 10, 0, 1) * 8) * clamp(m.clicks / 30, 0, 1);
  const score = Math.round(clamp(convScore + cpaScore + effScore, 0, 100));
  const grade = score >= 80 ? "우수" : score >= 60 ? "합격" : score >= 40 ? "개선 필요" : "재설계 필요";

  if (!out.length) add("ok", "치명적인 문제가 발견되지 않았습니다", "설정이 목표와 잘 맞아떨어졌습니다.", [["점수", score + "점"]], "여기서 더 올리려면 검색어 보고서를 주 단위로 보며 제외 키워드를 계속 쌓으세요.");
  const rank = { high: 0, mid: 1, low: 2, ok: 3 };
  out.sort((a, b) => rank[a.sev] - rank[b.sev]);
  return { findings: out, score, grade };
}

/* ════════════════════════════════════════════════════════
   전환 액션 — 무엇을 '전환'으로 셀지 수강생이 직접 정의한다
   ════════════════════════════════════════════════════════ */
function pageConversions() {
  const w = el("div", { class: "grid" });
  w.append(head("전환"));
  if (!hasBiz()) {
    w.append(el("div", { class: "card" }, [el("div", { class: "empty" }, [
      el("h3", { text: "먼저 비즈니스 정보를 입력하세요" }),
      el("p", { text: "어떤 사업인지 알아야 전환 액션을 정의할 수 있습니다." }),
      el("button", { class: "btn btn-primary", text: "비즈니스 정보 추가", onclick: () => go("business") }),
    ])]));
    return w;
  }
  const c = JSON.parse(JSON.stringify(state.biz.conv || DEFAULT_CONV));
  if (!c.name) c.name = MODELS[state.biz.model].convName;
  if (!c.value) c.value = state.biz.price;

  w.append(el("div", { class: "banner banner-info", html: ICON.info + "<div>전환은 <b>자동으로 정해지지 않습니다.</b> 광고주가 “무엇이 일어나면 성공인지”를 직접 정의해야 합니다. 여기서 고른 항목이 보고서의 전환수·전환당비용·ROAS 계산 방식을 결정합니다.</div>" }));

  const f = {};
  const row = (label, node, hint) => el("div", { class: "field" }, [el("label", { text: label }), node, hint ? el("div", { class: "hint", text: hint }) : null]);
  const sel = (obj, cur, onch) => {
    const s = el("select", { class: "inp", onchange: e => onch(e.target.value) });
    for (const [k, v] of Object.entries(obj)) s.append(el("option", { value: k, text: v.name || v, selected: String(cur) === k || undefined }));
    return s;
  };

  const note = el("div", { class: "hint" });
  const refreshNote = () => {
    const cat = CONV_CATEGORIES[f.category], cnt = COUNT_MODES[f.countMode];
    const lag = INDUSTRIES[state.biz.industry].lag;
    const cap = clamp(1 - Math.max(0, lag - f.window / 3) * 0.1, 0.4, 1);
    note.className = cap < 0.95 ? "hint warn" : "hint";
    note.textContent =
      "이 설정이면 전환은 기준 대비 약 " + Math.round(cat.rate * cnt.mult * cap * 100) + "% 로 집계됩니다."
      + (cap < 0.95 ? " 이 업종은 클릭 후 평균 " + lag + "일 뒤 전환되는데 추적 기간이 짧아 " + Math.round((1 - cap) * 100) + "% 를 놓칩니다." : "");
  };

  f.name = el("input", { class: "inp", value: c.name, maxlength: 40 });
  f.category = c.category; f.countMode = c.countMode; f.window = c.window;
  f.valueMode = c.valueMode; f.enabled = c.enabled; f.include = c.includeInConversions;

  const catDesc = el("div", { class: "hint", text: CONV_CATEGORIES[c.category].desc });
  const catSel = sel(CONV_CATEGORIES, c.category, v => { f.category = v; catDesc.textContent = CONV_CATEGORIES[v].desc; refreshNote(); });
  const cntDesc = el("div", { class: "hint", text: COUNT_MODES[c.countMode].desc });
  const cntSel = sel(COUNT_MODES, c.countMode, v => { f.countMode = v; cntDesc.textContent = COUNT_MODES[v].desc; refreshNote(); });
  const winSel = sel(CONV_WINDOWS, c.window, v => { f.window = +v; refreshNote(); });

  f.value = el("input", { class: "inp", type: "number", min: 0, step: 1000, value: c.value });
  const valueWrap = el("div", { class: "field" }, [el("label", { text: "전환 1건의 값 (원)" }), f.value,
    el("div", { class: "hint", text: "ROAS 계산에 쓰입니다. 값을 사용하지 않으면 ROAS를 볼 수 없습니다." })]);
  const valSel = sel(VALUE_MODES, c.valueMode, v => { f.valueMode = v; valueWrap.style.display = v === "none" ? "none" : ""; });
  if (c.valueMode === "none") valueWrap.style.display = "none";

  const g = el("div", { style: "display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px" });
  g.append(row("전환 액션 이름", f.name, "보고서 열 제목으로 그대로 쓰입니다."));
  g.append(el("div", { class: "field" }, [el("label", { text: "카테고리" }), catSel, catDesc]));
  g.append(el("div", { class: "field" }, [el("label", { text: "횟수" }), cntSel, cntDesc]));
  g.append(row("전환 추적 기간", winSel, "클릭 후 이 기간 안에 일어난 전환만 집계합니다."));
  g.append(el("div", { class: "field" }, [el("label", { text: "값" }), valSel]));
  g.append(valueWrap);
  refreshNote();

  const toggles = el("div", { class: "grid", style: "gap:12px" });
  toggles.append(el("label", { class: "opt" + (f.enabled ? " sel" : "") }, [
    el("input", { type: "checkbox", checked: f.enabled || undefined, onchange: e => { f.enabled = e.target.checked; } }),
    el("div", {}, [el("div", { class: "t", text: "이 전환 액션 사용" }),
      el("div", { class: "d", text: "끄면 전환이 전혀 측정되지 않습니다. 비용만 쓰고 성과를 알 수 없는 상태가 어떤 것인지 직접 확인해 보세요." })]),
  ]));
  toggles.append(el("label", { class: "opt" + (f.include ? " sel" : "") }, [
    el("input", { type: "checkbox", checked: f.include || undefined, onchange: e => { f.include = e.target.checked; } }),
    el("div", {}, [el("div", { class: "t", text: "'전환수' 열에 포함" }),
      el("div", { class: "d", text: "끄면 관찰만 하고 자동 입찰이 이 전환을 최적화 대상으로 쓰지 않습니다. 장바구니 담기처럼 참고용 지표에 씁니다." })]),
  ]));

  w.append(el("div", { class: "card" }, [
    el("div", { class: "card-head" }, [el("h3", { text: "전환 액션" }), el("span", { class: "sub", text: state.biz.name })]),
    el("div", { class: "card-body grid", style: "gap:18px" }, [g, note, toggles]),
    el("div", { class: "card-body", style: "border-top:1px solid var(--border-2);display:flex;gap:12px;align-items:center" }, [
      el("button", {
        class: "btn btn-primary", text: "저장", onclick: () => {
          state.biz.conv = {
            enabled: f.enabled, name: f.name.value.trim() || "전환", category: f.category,
            valueMode: f.valueMode, value: +f.value.value || 0,
            countMode: f.countMode, window: +f.window, includeInConversions: f.include,
          };
          state.campaigns = state.campaigns.map(x => wrapCampaign({ ...x.cfg, biz: state.biz }));
          save(); go("conversions");
        }
      }),
      el("span", { class: "hint", text: state.campaigns.length ? "저장하면 이미 게재한 캠페인의 성과도 새 기준으로 다시 집계됩니다." : "" }),
    ]),
  ]));

  /* 카테고리별 차이를 한눈에 */
  const t = tbl(["카테고리", "언제 집계되나", "전환 빈도(기준 대비)"]);
  Object.entries(CONV_CATEGORIES).forEach(([k, v]) => {
    t.body.append(el("tr", {}, [
      td(el("span", {}, [document.createTextNode(v.name), k === f.category ? el("span", { class: "tag tag-good", style: "margin-left:8px", text: "선택됨" }) : null])),
      td(v.desc), td(Math.round(v.rate * 100) + "%"),
    ]));
  });
  w.append(el("div", { class: "card" }, [
    el("div", { class: "card-head" }, [el("h3", { text: "카테고리를 바꾸면 무엇이 달라지나" }),
      el("span", { class: "sub", text: "쉬운 전환을 고르면 숫자는 커지지만 매출과는 멀어집니다" })]),
    el("div", { class: "tbl-wrap" }, [t.table]),
  ]));
  return w;
}

      td(el("span", { class: "tag " + (c.diag.score >= 60 ? "tag-good" : c.diag.score >= 40 ? "tag-warn" : "tag-crit"), text: c.diag.score + "점" })),

/* 표 헬퍼 */
function tbl(cols) {
  const table = el("table", { class: "tbl" });
  const thead = el("thead"); const tr = el("tr");
  cols.forEach(c => tr.append(el("th", { text: c })));
  thead.append(tr); table.append(thead);
  const body = el("tbody"); table.append(body);
  return { table, body, thead };
}
function td(v, cls) { const n = el("td", { class: cls }); if (v instanceof Node) n.append(v); else n.textContent = v; if (typeof v === "string" && /^[₩\d]/.test(v)) n.classList.add("num"); return n; }

/* ════════════════════════════════════════════════════════
   결과 화면 구성 요소
   ════════════════════════════════════════════════════════ */
function statRow(m, cfg) {
  const t = cfg.biz.targets;
  const s = (k, v, d, cls) => el("div", { class: "stat" }, [
    el("div", { class: "k", text: k }), el("div", { class: "v num", text: v }),
    d ? el("div", { class: "d " + (cls || ""), text: d }) : null,
  ]);
  const convOk = m.conv >= t.conversions;
  const cpaOk = m.cpa <= t.cpa;
  return el("div", { class: "stat-row" }, [
    s("노출수", int(m.impr), "노출 점유율 " + pct(m.isSearch, 1)),
    s("클릭수", int(m.clicks), "CTR " + pct(m.ctr)),
    s("평균 CPC", won(m.cpc), "시장 평균 대비 " + (m.cpc > 0 ? Math.round((m.cpc / Math.max(1, m.marketAvg || m.cpc)) * 100) : 100) + "%"),
    s("비용", won(m.cost), "예산 " + won(t.budgetTotal) + " 중 " + pct(m.cost / Math.max(1, t.budgetTotal), 0)),
    s(convName(cfg.biz), m.conv.toFixed(1) + "건", "목표 " + t.conversions + "건 · " + (convOk ? "달성" : "미달"), convOk ? "ok" : "bad"),
    s("전환당비용", m.cpa === Infinity ? "—" : won(m.cpa), "목표 " + won(t.cpa) + " · " + (cpaOk ? "달성" : "초과"), cpaOk ? "ok" : "bad"),
    s("전환율", pct(m.cvr), "클릭 대비"),
    s("ROAS", m.roas.toFixed(2) + "배", "매출 추정 " + won(m.revenue)),
  ]);
}

function verdictCard(c) {
  const d = c.diag, m = c.sim.metrics, t = c.cfg.biz.targets;
  const color = d.score >= 80 ? "var(--good)" : d.score >= 60 ? "var(--good)" : d.score >= 40 ? "var(--warn)" : "var(--crit)";
  const soft = d.score >= 60 ? "var(--good-soft)" : d.score >= 40 ? "var(--warn-soft)" : "var(--crit-soft)";
  const high = d.findings.filter(f => f.sev === "high").length;
  return el("div", { class: "verdict" }, [
    el("div", { class: "score num", style: "background:" + soft + ";color:" + color, text: d.score }),
    el("div", { style: "flex:1;min-width:0" }, [
      el("h3", { text: d.grade + " · " + c.cfg.name }),
      el("p", { text: convName(c.cfg.biz) + " " + m.conv.toFixed(1) + "건 (목표 " + t.conversions + "건), CPA " + (m.cpa === Infinity ? "측정 불가" : won(m.cpa)) + " (목표 " + won(t.cpa) + "). " + (high ? "심각한 문제 " + high + "건이 발견되었습니다." : "심각한 문제는 없습니다.") }),
    ]),
    el("button", { class: "btn btn-outline", text: "진단 보기", onclick: () => go("diagnostics") }),
  ]);
}

function topFindings(c, n) {
  const card = el("div", { class: "card" }, [
    el("div", { class: "card-head" }, [el("h3", { text: "무엇이 문제였는가" }), el("span", { class: "sub", text: "심각도 순" }),
      el("button", { class: "btn btn-text btn-sm", style: "margin-left:auto", text: "전체 보기", onclick: () => go("diagnostics") })]),
  ]);
  const body = el("div", { class: "card-body grid", style: "gap:12px" });
  c.diag.findings.slice(0, n).forEach(f => body.append(diagNode(f)));
  card.append(body); return card;
}
function diagNode(f) {
  const evs = el("div", { class: "ev" });
  f.ev.forEach(([k, v]) => evs.append(el("span", { html: esc(k) + " <b>" + esc(v) + "</b>" })));
  return el("div", { class: "diag sev-" + f.sev }, [
    el("span", { class: "diag-ico", style: "color:" + (f.sev === "high" ? "var(--crit)" : f.sev === "mid" ? "var(--warn)" : f.sev === "ok" ? "var(--good)" : "var(--ink-3)"), html: sevIcon(f.sev) }),
    el("div", { style: "flex:1;min-width:0" }, [
      el("h4", {}, [document.createTextNode(f.title), el("span", { class: "tag " + sevTag(f.sev), text: "심각도 " + sevLabel(f.sev) })]),
      el("p", { text: f.why }), evs,
      el("div", { class: "fix", html: "<b>조치</b> · " + esc(f.fix) }),
    ]),
  ]);
}

function pageDiagnostics() {
  const w = el("div", { class: "grid" });

function campaignTabs(active) {
  const items = cur() && cur().sim.isDisplay
    ? [["diagnostics", "진단"], ["placements", "게재위치"], ["ads", "광고"], ["reports", "보고서"]]
    : [["diagnostics", "진단"], ["adgroups", "광고그룹"], ["keywords", "키워드"], ["searchterms", "검색어"], ["negatives", "제외 키워드"], ["ads", "광고"], ["reports", "보고서"]];
  const t = el("div", { class: "tabs", role: "tablist" });
  items.forEach(([id, label]) => t.append(el("button", {
    class: "tab", role: "tab", text: label,
    "aria-selected": active === id ? "true" : "false", onclick: () => go(id),
  })));
  return t;
}

/* ── 키워드 / 검색어 표 ──────────────────────────────── */
function pageTable(kind) {
  const w = el("div", { class: "grid" });
  w.append(head(kind === "keywords" ? "키워드" : "검색어"));
  if (!state.campaigns.length) return emptyPage(w, "데이터가 없습니다", "캠페인을 게재하면 실적이 채워집니다.");
  const c = cur();
  w.append(campaignTabs(kind));

  if (kind === "keywords") {
    w.append(el("div", { class: "banner banner-info", html: ICON.info + "<div><b>품질평가점수</b>는 광고 관련성 · 예상 CTR · 방문 페이지 만족도 세 가지로 매겨집니다. 점수가 낮으면 같은 순위를 얻는 데 더 비싼 값을 치릅니다.</div>" }));
    const t = tbl(["키워드", "광고그룹", "검색유형", "품질평가점수", "광고 관련성", "예상 CTR", "방문 페이지", "노출수", "클릭수", "CTR", "평균 CPC", "비용", "전환수"]);
    c.sim.keywords.slice().sort((a, b) => b.cost - a.cost).forEach(a => {
      const k = a.kw;
      const qsColor = k.qs >= 8 ? "tag-good" : k.qs >= 5 ? "tag-warn" : "tag-crit";
      t.body.append(el("tr", {}, [
        td(el("span", {}, [document.createTextNode(MATCH[k.match].fmt(k.text)), k.offTarget ? el("span", { class: "tag tag-crit", style: "margin-left:8px", text: "고객 아님" }) : k.isBrand ? el("span", { class: "tag tag-good", style: "margin-left:8px", text: "브랜드" }) : null])),
        td(k.group || "—"),
        td(MATCH[k.match].name),
        td(el("span", { class: "qs tag " + qsColor, text: String(k.qs) })),
        td(k.qsParts.relevance), td(k.qsParts.ctr), td(k.qsParts.landing),
        td(int(a.impr)), td(int(a.clicks)), td(pct(a.clicks / Math.max(1, a.impr))),
        td(won(a.cost / Math.max(1, a.clicks))), td(won(a.cost)), td(a.conv.toFixed(1)),
      ]));
    });
    w.append(el("div", { class: "card" }, [el("div", { class: "tbl-wrap" }, [t.table])]));
    w.append(qsExplainCard(c));
  } else {
    const m = c.sim.metrics;
    w.append(el("div", { class: "banner banner-warn", html: ICON.warn + "<div>전체 비용의 <b>" + pct(m.wasteShare, 1) + "</b>(" + won(m.wasteCost) + ")이 <b>느슨하거나 무관한 검색어</b>에 쓰였습니다. 아래에서 제외할 검색어를 찾아보세요.</div>" }));
    w.append(wasteChartCard(c));
    const pend = state.pendingNegatives = state.pendingNegatives || [];
    const t = tbl(["검색어", "관련도", "일치 키워드", "검색유형", "노출수", "클릭수", "비용", "전환수", "전환당비용", "제외 키워드로"]);
    c.sim.queries.slice(0, 60).forEach(q => {
      const relTag = q.rel === "exact" ? ["tag-good", "정확 일치"] : q.rel === "close" ? ["tag-mute", "관련"] : q.rel === "loose" ? ["tag-warn", "느슨함"] : ["tag-crit", "무관"];
      const already = (c.cfg.negatives || []).some(n => n.text === q.q);
      const queued = pend.some(n => n.text === q.q);
      t.body.append(el("tr", {}, [
        td(q.q), td(el("span", { class: "tag " + relTag[0], text: relTag[1] })),
        td(q.kw), td(MATCH[q.match].name),
        td(int(q.impr)), td(int(q.clicks)), td(won(q.cost)), td(q.conv.toFixed(1)),
        td(q.conv >= 0.5 ? won(q.cost / q.conv) : "—"),
        td(already ? el("span", { class: "tag tag-mute", text: "제외됨" })
          : el("button", {
            class: "btn btn-text btn-sm", style: "padding:2px 10px",
            text: queued ? "대기 중" : "＋ 제외",
            disabled: queued || undefined,
            onclick: () => { pend.push({ text: q.q, match: "phrase" }); render(); },
          })),
      ]));
    });
    w.append(el("div", { class: "card" }, [
      el("div", { class: "card-head" }, [el("h3", { text: "검색어 보고서" }), el("span", { class: "sub", text: "비용 상위 60개" })]),
      el("div", { class: "tbl-wrap" }, [t.table]),
    ]));
    if (pend.length) {
      w.append(el("div", { class: "card" }, [
        el("div", { class: "card-head" }, [el("h3", { text: "제외 대기 " + pend.length + "개" }),
          el("span", { class: "sub", text: pend.map(n => n.text).join(", ") })]),
        el("div", { class: "card-body", style: "display:flex;gap:12px;flex-wrap:wrap" }, [
          el("button", { class: "btn btn-primary", text: "제외 키워드 적용해 다시 게재", onclick: () => go("negatives") }),
          el("button", { class: "btn btn-text", text: "비우기", onclick: () => { state.pendingNegatives = []; render(); } }),
        ]),
      ]));
    }
  }
  return w;
}

function qsExplainCard(c) {
  const kws = c.sim.kws;
  const worst = kws.slice().sort((a, b) => a.qs - b.qs)[0];
  if (!worst) return el("div");
  return el("div", { class: "card" }, [
    el("div", { class: "card-head" }, [el("h3", { text: "품질평가점수는 왜 이렇게 나왔나" })]),
    el("div", { class: "card-body grid", style: "gap:12px" }, [
      el("p", { style: "margin:0;color:var(--ink-2)", text: "가장 낮은 키워드 “" + worst.text + "” (" + worst.qs + "점) 기준입니다." }),
      el("dl", { class: "kv" }, [
        el("dt", { text: "광고 관련성" }), el("dd", { text: worst.qsParts.relevance + " — 이 키워드가 광고 제목·설명에 실제로 등장하는가" }),
        el("dt", { text: "예상 CTR" }), el("dd", { text: (() => { const g = (c.cfg.adGroups || []).find(x => x.name === worst.group) || (c.cfg.adGroups || [])[0]; return g ? worst.qsParts.ctr + " — 제목 " + g.ad.headlines.length + "개, 설명 " + g.ad.descriptions.length + "개, 확장 " + (g.ad.sitelinks.length + g.ad.callouts.length) + "개" : worst.qsParts.ctr; })() }),
        el("dt", { text: "방문 페이지" }), el("dd", { text: worst.qsParts.landing + " — 최종 URL이 비즈니스 도메인과 " + (worst.sameDomain === 1 ? "일치" : worst.sameDomain ? "불일치" : "미설정") + ", 비즈니스 설명과의 어휘 일치도" }),
        el("dt", { text: "브랜드 적합도" }), el("dd", { text: pct(worst.brandFit, 0) + " — 비즈니스 설명·타겟 고객·업종 어휘와 겹치는 정도" }),
      ]),
    ]),
  ]);
}
