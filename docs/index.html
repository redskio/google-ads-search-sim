<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Google Ads 검색 캠페인 실습 시뮬레이터 — 브랜드 정보를 입력하고 캠페인을 게재하면 30일치 성과가 시뮬레이션되고 진단과 CSV 보고서가 나옵니다.">
<meta name="robots" content="noindex">
<title>Google Ads 검색 캠페인 실습 시뮬레이터</title>
<style>
:root{
  --bg:#f1f3f4; --surface:#fff; --surface-2:#f8f9fa; --surface-3:#f1f3f4;
  --border:#dadce0; --border-2:#e8eaed; --border-strong:#bdc1c6;
  --ink:#202124; --ink-2:#5f6368; --ink-3:#80868b;
  --blue:#1a73e8; --blue-h:#1765cc; --blue-soft:#e8f0fe; --blue-ink:#174ea6; --on-blue:#fff;
  --good:#188038; --good-soft:#e6f4ea; --good-line:#a8dab5;
  --warn:#b06000; --warn-soft:#fef7e0; --warn-line:#fde293;
  --crit:#c5221f; --crit-soft:#fce8e6; --crit-line:#f6aea9;
  --series:#1a73e8; --series-2:#a8c7fa; --series-3:#c6dafc; --mark-crit:#d93025;
  --grid:#e8eaed;
  --shadow-1:0 1px 2px 0 rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);
  --shadow-2:0 1px 3px 0 rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15);
  --rail:72px; --nav:232px;
  --sans:"Google Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#202124; --surface:#292a2d; --surface-2:#35363a; --surface-3:#3c4043;
    --border:#3c4043; --border-2:#35363a; --border-strong:#5f6368;
    --ink:#e8eaed; --ink-2:#9aa0a6; --ink-3:#80868b;
    --blue:#8ab4f8; --blue-h:#aecbfa; --blue-soft:#1f3047; --blue-ink:#8ab4f8; --on-blue:#202124;
    --good:#81c995; --good-soft:#1d3324; --good-line:#2f6b41;
    --warn:#fdd663; --warn-soft:#33290d; --warn-line:#7a611b;
    --crit:#f28b82; --crit-soft:#3a1f1d; --crit-line:#7d3a34;
    --series:#4285f4; --series-2:#3b5b8c; --series-3:#2b3f5e; --mark-crit:#e8564a;
    --grid:#3c4043;
    --shadow-1:0 1px 2px 0 rgba(0,0,0,.6),0 1px 3px 1px rgba(0,0,0,.3);
    --shadow-2:0 1px 3px 0 rgba(0,0,0,.6),0 4px 8px 3px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#202124; --surface:#292a2d; --surface-2:#35363a; --surface-3:#3c4043;
  --border:#3c4043; --border-2:#35363a; --border-strong:#5f6368;
  --ink:#e8eaed; --ink-2:#9aa0a6; --ink-3:#80868b;
  --blue:#8ab4f8; --blue-h:#aecbfa; --blue-soft:#1f3047; --blue-ink:#8ab4f8; --on-blue:#202124;
  --good:#81c995; --good-soft:#1d3324; --good-line:#2f6b41;
  --warn:#fdd663; --warn-soft:#33290d; --warn-line:#7a611b;
  --crit:#f28b82; --crit-soft:#3a1f1d; --crit-line:#7d3a34;
  --series:#4285f4; --series-2:#3b5b8c; --series-3:#2b3f5e; --mark-crit:#e8564a;
  --grid:#3c4043;
  --shadow-1:0 1px 2px 0 rgba(0,0,0,.6),0 1px 3px 1px rgba(0,0,0,.3);
  --shadow-2:0 1px 3px 0 rgba(0,0,0,.6),0 4px 8px 3px rgba(0,0,0,.3);
}
:root[data-theme="light"]{
  --bg:#f1f3f4; --surface:#fff; --surface-2:#f8f9fa; --surface-3:#f1f3f4;
  --border:#dadce0; --border-2:#e8eaed; --border-strong:#bdc1c6;
  --ink:#202124; --ink-2:#5f6368; --ink-3:#80868b;
  --blue:#1a73e8; --blue-h:#1765cc; --blue-soft:#e8f0fe; --blue-ink:#174ea6; --on-blue:#fff;
  --good:#188038; --good-soft:#e6f4ea; --good-line:#a8dab5;
  --warn:#b06000; --warn-soft:#fef7e0; --warn-line:#fde293;
  --crit:#c5221f; --crit-soft:#fce8e6; --crit-line:#f6aea9;
  --series:#1a73e8; --series-2:#a8c7fa; --series-3:#c6dafc; --mark-crit:#d93025;
  --grid:#e8eaed;
  --shadow-1:0 1px 2px 0 rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);
  --shadow-2:0 1px 3px 0 rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15);
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}

/* ─── App chrome ─────────────────────────────────────── */
.topbar{position:sticky;top:0;z-index:40;height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 12px}
.brand{display:flex;align-items:center;gap:10px;padding-left:4px}
.brand-mark{width:26px;height:26px;flex:none}
.brand-text{font-size:20px;letter-spacing:-.2px}
.brand-text b{font-weight:500}
.brand-text span{color:var(--ink-2)}
.topbar-spacer{flex:1}
.topbar-acts{display:flex;align-items:center;gap:2px}
.tb-btn{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;border-radius:8px;padding:6px 10px;color:var(--ink-2);font-size:11px}
.tb-btn:hover{background:var(--surface-2)}
.tb-btn svg{width:20px;height:20px}
.acct{text-align:right;padding:0 12px;border-left:1px solid var(--border);margin-left:8px;line-height:1.35}
.acct b{display:block;font-weight:500;font-size:13px}
.acct span{color:var(--ink-2);font-size:12px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:500;flex:none}
:root[data-theme="dark"] .avatar,:root:not([data-theme="light"]) .avatar{color:#fff}

.shell{display:flex;min-height:calc(100vh - 56px)}
.rail{width:var(--rail);flex:none;background:var(--surface);border-right:1px solid var(--border);padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:4px;position:sticky;top:56px;height:calc(100vh - 56px)}
.fab{width:48px;height:48px;border-radius:50%;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-1);display:grid;place-items:center;margin-bottom:2px}
.fab:hover{background:var(--surface-2);box-shadow:var(--shadow-2)}
.fab svg{width:24px;height:24px}
.rail-label{font-size:11px;color:var(--ink-2);margin-bottom:10px}
.rail-item{width:100%;background:none;border:0;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-2);font-size:11px}
.rail-item svg{width:22px;height:22px}
.rail-item:hover{color:var(--ink)}
.rail-item[aria-current="true"]{color:var(--blue)}

.nav{width:var(--nav);flex:none;background:var(--surface);border-right:1px solid var(--border);padding:12px 8px;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto}
.nav-item{width:100%;text-align:left;background:none;border:0;border-radius:0 20px 20px 0;padding:9px 16px;color:var(--ink);font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav-item:hover{background:var(--surface-2)}
.nav-item[aria-current="page"]{background:var(--blue);color:var(--on-blue);font-weight:500}
.nav-group>.nav-item{color:var(--ink-2)}
.nav-sub{display:none;padding:4px 0}
.nav-group[open] .nav-sub{display:block}
.nav-sub .nav-item{padding-left:34px;font-size:13.5px}
.nav-chev{width:18px;height:18px;transition:transform .15s}
.nav-group[open] .nav-chev{transform:rotate(180deg)}

.main{flex:1;min-width:0;padding:20px 24px 64px}
.page-head{display:flex;align-items:center;gap:16px;margin-bottom:4px;flex-wrap:wrap}
.page-title{font-size:24px;font-weight:400;margin:0}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:13px;box-shadow:var(--shadow-1)}
.head-right{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink-2)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:14px 0 0}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 16px 9px;color:var(--ink-2);font-size:14px;border-radius:8px 8px 0 0}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-selected="true"]{color:var(--blue);border-bottom-color:var(--blue);font-weight:500}

.toolbar{display:flex;align-items:center;gap:10px;padding:14px 0}
.toolbar .spacer{flex:1}

/* ─── Buttons ────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:20px;padding:9px 22px;border:1px solid transparent;font-size:14px;font-weight:500;background:var(--surface);color:var(--blue)}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--blue);color:var(--on-blue);box-shadow:var(--shadow-1)}
.btn-primary:hover{background:var(--blue-h);box-shadow:var(--shadow-2)}
.btn-outline{border-color:var(--border-strong);background:transparent}
.btn-outline:hover{background:var(--blue-soft)}
.btn-text{background:none;padding:9px 14px}
.btn-text:hover{background:var(--blue-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-sm{padding:6px 14px;font-size:13px}
.icon-btn{background:none;border:0;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:20px;height:20px}

/* ─── Cards & tables ─────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--border-2);border-radius:8px;box-shadow:var(--shadow-1)}
.card-head{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--border-2)}
.card-head h3{margin:0;font-size:15px;font-weight:500}
.card-head .sub{color:var(--ink-2);font-size:12.5px}
.card-body{padding:20px}
.grid{display:grid;gap:16px}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:1px;background:var(--border-2);border-radius:8px;overflow:hidden;border:1px solid var(--border-2)}
.stat{background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:5px}
.stat .k{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.stat .v{font-size:24px;font-weight:400;letter-spacing:-.3px}
.stat .d{font-size:12px;color:var(--ink-3)}
.stat .d.bad{color:var(--crit)}
.stat .d.ok{color:var(--good)}

.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
table.tbl th,table.tbl td{padding:11px 14px;text-align:right;border-bottom:1px solid var(--border-2);white-space:nowrap}
table.tbl th{color:var(--ink-2);font-weight:500;font-size:12.5px;position:sticky;top:0;background:var(--surface)}
table.tbl th:first-child,table.tbl td:first-child{text-align:left}
table.tbl tbody tr:hover{background:var(--surface-2)}
table.tbl tfoot td{font-weight:500;border-top:2px solid var(--border);border-bottom:0;background:var(--surface-2)}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:4px;padding:2px 8px;font-size:11.5px;font-weight:500;white-space:nowrap}
.tag-good{background:var(--good-soft);color:var(--good);border:1px solid var(--good-line)}
.tag-warn{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-line)}
.tag-crit{background:var(--crit-soft);color:var(--crit);border:1px solid var(--crit-line)}
.tag-mute{background:var(--surface-3);color:var(--ink-2);border:1px solid var(--border)}
.qs{display:inline-block;min-width:26px;text-align:center;border-radius:4px;padding:2px 6px;font-weight:500;font-variant-numeric:tabular-nums}

.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:56px 24px;text-align:center}
.empty h3{margin:0;font-size:19px;font-weight:400}
.empty p{margin:0;color:var(--ink-2);max-width:46ch}

/* ─── Forms ──────────────────────────────────────────── */
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:12.5px;color:var(--ink-2)}
.inp{background:var(--surface);border:1px solid var(--border-strong);border-radius:4px;padding:11px 13px;font-size:14px;width:100%}
.inp:focus{border-color:var(--blue);outline:1px solid var(--blue);outline-offset:-1px}
textarea.inp{min-height:96px;resize:vertical;line-height:1.6}
.hint{font-size:12px;color:var(--ink-3)}
.hint.warn{color:var(--warn)}
.counter{font-size:11.5px;color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums}
.counter.over{color:var(--crit)}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--border);border-radius:8px;padding:14px 16px;cursor:pointer;background:var(--surface)}
.opt:hover{background:var(--surface-2)}
.opt.sel{border-color:var(--blue);border-width:2px;padding:13px 15px;background:var(--blue-soft)}
.opt input{margin-top:3px;accent-color:var(--blue)}
.opt .t{font-weight:500}
.opt .d{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.goal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}

/* ─── Wizard ─────────────────────────────────────────── */
.wizard{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column}
.wizard.on{display:flex}
.wiz-top{height:56px;flex:none;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 12px}
.wiz-body{flex:1;display:flex;overflow:hidden}
.wiz-steps{width:266px;flex:none;padding:26px 18px;overflow-y:auto;border-right:1px solid var(--border);background:var(--surface)}
.step{display:flex;gap:12px;align-items:flex-start;padding:9px 10px;border-radius:8px;color:var(--ink-2);font-size:13.5px}
.step .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--border-strong);display:grid;place-items:center;font-size:11px;flex:none;font-weight:500}
.step.done .dot{background:var(--good);border-color:var(--good);color:var(--surface)}
.step.now{background:var(--blue-soft);color:var(--blue-ink);font-weight:500}
.step.now .dot{border-color:var(--blue);color:var(--blue)}
.wiz-main{flex:1;overflow-y:auto;padding:34px 40px 120px;display:flex;justify-content:center}
.wiz-inner{width:100%;max-width:780px;display:flex;flex-direction:column;gap:22px}
.wiz-h{font-size:26px;font-weight:400;margin:0}
.wiz-sub{color:var(--ink-2);margin:6px 0 0}
.wiz-foot{position:absolute;bottom:0;left:266px;right:0;background:var(--surface);border-top:1px solid var(--border);padding:14px 40px;display:flex;gap:12px;align-items:center}
.wiz-foot .spacer{flex:1}

/* ─── Diagnostics ────────────────────────────────────── */
.diag{display:flex;gap:14px;padding:16px 18px;border:1px solid var(--border);border-left-width:4px;border-radius:8px;background:var(--surface)}
.diag.sev-high{border-left-color:var(--mark-crit)}
.diag.sev-mid{border-left-color:var(--warn)}
.diag.sev-low{border-left-color:var(--ink-3)}
.diag.sev-ok{border-left-color:var(--good)}
.diag-ico{width:22px;height:22px;flex:none;margin-top:1px}
.diag h4{margin:0 0 4px;font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.diag p{margin:0 0 8px;color:var(--ink-2);font-size:13.5px}
.diag .ev{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2);margin-bottom:8px}
.diag .ev b{color:var(--ink);font-variant-numeric:tabular-nums}
.diag .fix{font-size:13.5px;background:var(--surface-2);border-radius:6px;padding:10px 12px}
.diag .fix b{font-weight:500}

.verdict{display:flex;gap:18px;align-items:center;padding:22px;border-radius:8px;border:1px solid var(--border-2);background:var(--surface);box-shadow:var(--shadow-1)}
.verdict .score{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;font-size:27px;font-weight:500;flex:none;font-variant-numeric:tabular-nums}
.verdict h3{margin:0 0 4px;font-size:18px;font-weight:500}
.verdict p{margin:0;color:var(--ink-2);font-size:13.5px}

/* ─── Charts ─────────────────────────────────────────── */
.chart-wrap{position:relative}
.chart-wrap svg{display:block;width:100%;height:auto;overflow:visible}
.ax{font-size:11px;fill:var(--ink-3);font-variant-numeric:tabular-nums}
.gridline{stroke:var(--grid);stroke-width:1}
.axline{stroke:var(--border);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);border-radius:6px;padding:8px 11px;font-size:12.5px;line-height:1.55;white-space:nowrap;opacity:0;transition:opacity .1s;z-index:5;box-shadow:var(--shadow-2)}
.tip b{font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12.5px;color:var(--ink-2);padding-top:4px}
.legend i{width:11px;height:11px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:-1px}
.metric-switch{display:flex;gap:6px;flex-wrap:wrap}
.mbtn{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:5px 14px;font-size:12.5px;color:var(--ink-2)}
.mbtn:hover{background:var(--surface-2)}
.mbtn[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue);color:var(--blue-ink);font-weight:500}

/* ─── Brief / misc ───────────────────────────────────── */
.brief{border:1px solid var(--border-2);border-radius:8px;background:var(--surface);box-shadow:var(--shadow-1);overflow:hidden}
.brief summary{padding:14px 20px;cursor:pointer;font-weight:500;display:flex;align-items:center;gap:10px;list-style:none}
.brief summary::-webkit-details-marker{display:none}
.brief summary .chev{width:18px;height:18px;margin-left:auto;transition:transform .15s;color:var(--ink-2)}
.brief[open] summary .chev{transform:rotate(180deg)}
.brief .body{padding:0 20px 20px;border-top:1px solid var(--border-2);padding-top:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:13.5px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface-3);border:1px solid var(--border);border-radius:14px;padding:4px 11px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.chip button{background:none;border:0;padding:0;color:var(--ink-2);display:grid;place-items:center}
.chip button:hover{color:var(--crit)}
.serp{border:1px solid var(--border);border-radius:8px;padding:16px 18px;background:var(--surface)}
.serp .badge{font-size:11px;font-weight:700;border:1px solid var(--ink);border-radius:3px;padding:0 4px;margin-right:6px}
.serp .u{font-size:12.5px;color:var(--ink-2)}
.serp .t{color:#1a0dab;font-size:19px;line-height:1.3;margin:2px 0 3px}
:root[data-theme="dark"] .serp .t{color:#8ab4f8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .serp .t{color:#8ab4f8}}
.serp .d{font-size:13.5px;color:var(--ink-2)}
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:8px;padding:14px 16px;font-size:13.5px}
.banner-warn{background:var(--warn-soft);border:1px solid var(--warn-line);color:var(--ink)}
.banner-info{background:var(--blue-soft);border:1px solid var(--blue);color:var(--ink)}
.banner svg{width:20px;height:20px;flex:none;margin-top:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.nav-backdrop{display:none}
@media (max-width:560px){
  .acct{display:none}
  #btnHelp{display:none}
  .opt{flex-wrap:wrap}
  .opt>.btn{width:100%;justify-content:center;margin-top:4px}
  .toolbar{flex-wrap:wrap}
  .card-body{padding:16px}
  .card-head{padding:12px 16px;flex-wrap:wrap}
  .wiz-h{font-size:21px}
  .verdict .score{width:64px;height:64px;font-size:22px}
}
@media (max-width:1000px){
  .rail{display:none}

/* ════════════════════════════════════════════════════════

   ─ 결정론적 경매 시뮬레이션 엔진 + 진단 + CSV 리포트

/* ── 유틸 ─────────────────────────────────────────────── */
const $ = (s, r = document) => r.querySelector(s);
const el = (t, a = {}, kids = []) => {
  const n = document.createElement(t);
  for (const [k, v] of Object.entries(a)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k === "text") n.textContent = v;
    /* value는 속성이 아니라 프로퍼티로 — textarea는 속성으로 넣으면 표시되지 않는다 */
    else if (k === "value" && "value" in n) n.value = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of [].concat(kids)) if (c != null) n.append(c);
  return n;
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const won = n => "₩" + Math.round(n).toLocaleString("ko-KR");

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* 결정론적 난수: 같은 설정 → 같은 결과 */
function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* 문자열 → 0..1 안정 난수 (키워드 속성 생성용) */
const rnd1 = (s, salt = "") => mulberry32(hashStr(s + "|" + salt))();

/* 상품 유형: 전환 정의와 객단가 해석이 달라진다 */
const MODELS = {
  subscription: { name: "구독 (월 결제)", convName: "구독 신청", cvr: 0.92, ltvMult: 4.5 },
  onetime:      { name: "단건 판매", convName: "구매", cvr: 1.00, ltvMult: 1.0 },

/* 비즈니스 정보 기본값 — 수강생이 전부 바꿀 수 있다 */
const DEFAULT_BIZ = {
  name: "", industry: "edu", model: "subscription",
  url: "", desc: "", price: 39000,
  audience: "", exclude: "",

};

/* 브랜드 토큰: 이름·설명·업종·URL에서 뽑아낸 "우리 사업의 언어" */
const STOP = new Set(["그리고","하는","위한","있는","합니다","입니다","저희","우리","고객","서비스를","가장","모든","www","com","kr","https","http","the","and","for"]);
function tokenize(s) {
  return String(s || "").toLowerCase()
    .replace(/[^\p{L}\p{N}\s]/gu, " ")
    .split(/\s+/).filter(w => w.length > 1 && !STOP.has(w));
}
function bizProfile(biz) {
  const ind = INDUSTRIES[biz.industry] || INDUSTRIES.edu;
  const model = MODELS[biz.model] || MODELS.onetime;
  const brand = new Set([...tokenize(biz.name), ...tokenize(biz.desc), ...tokenize(biz.audience), ...ind.seeds]);
  const urlTok = new Set(tokenize((biz.url || "").replace(/https?:\/\//, "").replace(/\./g, " ").replace(/\//g, " ")));
  const off = new Set([...ind.off.map(s => s.toLowerCase()), ...tokenize(biz.exclude)]);
  return { ind, model, brand, urlTok, off, biz };
}
const isOffTarget = (text, prof) => {
  const t = String(text).toLowerCase();
  for (const o of prof.off) if (o && t.includes(o)) return true;
  return false;
};

/* 이 시장에서 현실적으로 달성 가능한 전환당비용 범위.
   실제 Google Ads가 입찰 설정 옆에 권장값을 띄우는 것과 같은 역할이다. */
function recommendedCpa(biz, goal) {
  const ind = INDUSTRIES[biz.industry] || INDUSTRIES.edu;
  const md = MODELS[biz.model] || MODELS.onetime;
  const g = GOALS[goal] || GOALS.sales;
  const typicalCpc = 1150 * ind.cpc;
  const cvr = Math.max(0.003, g.cvr * ind.cvr * md.cvr);
  const mid = typicalCpc / cvr;
  const round = v => Math.round(v / 500) * 500;
  return { low: round(mid * 0.8), mid: round(mid), high: round(mid * 1.3) };
}

/* ── 키워드 의도 사전 ────────────────────────────────── */
const INTENT_RULES = [
  { re: /(구매|주문|결제|신청|등록|가입|구독|할인|쿠폰|특가|최저가|가격|얼마|비용|요금)/, intent: "transactional", cvr: 1.55, cpc: 1.35, vol: 0.75 },
  { re: /(추천|후기|리뷰|비교|순위|best|top|어디|어느|브랜드)/i, intent: "commercial", cvr: 1.0, cpc: 1.1, vol: 1.0 },
  { re: /(무료|공짜|토렌트|다운|다운로드|뜻|의미|방법|하는법|하는 법|효과|원리|차이|채용|구인|알바|자격증|중고|당근)/, intent: "informational", cvr: 0.12, cpc: 0.5, vol: 1.9 },
];
function classifyKeyword(kw, prof) {
  const k = kw.trim();
  let intent = "commercial", cvrM = 1.0, cpcM = 1.0, volM = 1.0;
  for (const r of INTENT_RULES) {
    if (r.re.test(k)) { intent = r.intent; cvrM = r.cvr; cpcM = r.cpc; volM = r.vol; break; }
  }
  const words = k.split(/\s+/).filter(Boolean).length;
  const tail = words >= 3 ? "long" : words === 2 ? "mid" : "head";
  /* 검색량: 짧을수록 많고, 롱테일일수록 적지만 전환은 좋음 */
  const base = tail === "head" ? 42000 : tail === "mid" ? 11000 : 2600;
  const volume = Math.round(base * volM * (0.45 + rnd1(k, "vol") * 1.5));
  const competition = clamp(0.2 + rnd1(k, "comp") * 0.6 + prof.ind.comp * 0.25 + (intent === "transactional" ? 0.1 : 0), 0.05, 0.98);
  const marketCpc = Math.round((320 + competition * 2400) * cpcM * prof.ind.cpc * (0.8 + rnd1(k, "cpc") * 0.5) / 10) * 10;

  /* 브랜드 적합도: 이 키워드가 우리 사업의 언어와 얼마나 겹치는가 */
  const toks = tokenize(k);
  const hit = toks.filter(t => prof.brand.has(t) || [...prof.brand].some(b => b.length > 1 && (t.includes(b) || b.includes(t)))).length;
  const brandFit = clamp(hit / Math.max(1, toks.length), 0, 1);
  const offTarget = isOffTarget(k, prof);

  /* 전환 배수: 의도 × 롱테일 × 브랜드 적합도 × 업종 × 상품유형 */
  const cvrMult = cvrM * (tail === "long" ? 1.35 : tail === "mid" ? 1.05 : 0.78)
    * (0.35 + brandFit * 0.95) * prof.ind.cvr * prof.model.cvr * (offTarget ? 0.06 : 1);
  return { text: k, intent, tail, volume, competition, marketCpc, cvrMult, offTarget, brandFit, words };
}

/* ── 검색어(쿼리) 생성기 ─────────────────────────────── */
const DRIFT_PRE = ["무료", "저렴한", "중고", "가까운", "동네", "초보", "직접"];
const CLOSE_SUF = ["가격", "요금", "신청", "후기", "추천", "비교", "할인", "문의"];

function buildQueries(kwObj, matchType, rng, prof) {
  /* 각 키워드가 실제로 매칭될 검색어들 — 확장검색일수록 멀리 퍼진다.
     흘러가는 방향은 업종의 "고객이 아닌 검색" 테마를 따른다. */
  const out = [];
  const k = kwObj.text;
  const driftSuf = [...prof.ind.off, "추천", "후기", "블로그"];
  out.push({ q: k, rel: "exact", share: 1.0 });
  if (matchType !== "exact") {
    const n = matchType === "broad" ? 6 : 3;
    for (let i = 0; i < n; i++) {
      const useSuf = rng() > 0.35;
      const w = useSuf ? CLOSE_SUF[Math.floor(rng() * CLOSE_SUF.length)] : DRIFT_PRE[Math.floor(rng() * DRIFT_PRE.length)];
      const q = useSuf ? k + " " + w : w + " " + k;
      out.push({ q, rel: isOffTarget(q, prof) ? "off" : "close", share: 0.45 + rng() * 0.5 });
    }
  }
  if (matchType === "broad") {
    for (let i = 0; i < 5; i++) {
      const head = k.split(/\s+/)[0];
      const w = driftSuf[Math.floor(rng() * driftSuf.length)];
      const q = head + " " + w;
      out.push({ q, rel: isOffTarget(q, prof) ? "off" : "loose", share: 0.3 + rng() * 0.55 });
    }
  }
  /* 중복 정리 */
  const seen = new Map();
  for (const o of out) { if (!seen.has(o.q)) seen.set(o.q, o); }
  const arr = [...seen.values()];
  const total = arr.reduce((s, o) => s + o.share, 0);
  arr.forEach(o => { o.w = o.share / total; });
  return arr;
}
const REL_WEIGHT = { exact: 1.0, close: 0.62, loose: 0.22, off: 0.05 };

/* ── 품질평가점수 ────────────────────────────────────── */
function qualityScore(kwObj, ad, matchType, prof) {
  const kws = kwObj.text.toLowerCase().split(/\s+/).filter(w => w.length > 1);
  const heads = ad.headlines.join(" ").toLowerCase();
  const descs = ad.descriptions.join(" ").toLowerCase();
  const urlText = (ad.finalUrl + " " + ad.path1 + " " + ad.path2).toLowerCase().replace(/[^\p{L}\p{N}]/gu, " ");
  const bizText = (prof.biz.desc + " " + prof.biz.name + " " + prof.biz.audience).toLowerCase();

  const inHead = kws.filter(w => heads.includes(w)).length / Math.max(1, kws.length);
  const inDesc = kws.filter(w => descs.includes(w)).length / Math.max(1, kws.length);
  const inUrl = kws.filter(w => urlText.includes(w)).length / Math.max(1, kws.length);
  const inBiz = kws.filter(w => bizText.includes(w)).length / Math.max(1, kws.length);

  /* 광고문구가 실제 브랜드를 말하고 있는가 (업체명 노출) */
  const brandNamed = prof.biz.name && heads.includes(prof.biz.name.toLowerCase().split(/\s+/)[0]) ? 0.12 : 0;
  /* 광고 URL이 비즈니스 도메인과 같은가 — 다르면 방문 페이지 신뢰도가 떨어진다 */
  const dom = u => (String(u).match(/https?:\/\/([^/]+)/) || [, ""])[1].replace(/^www\./, "").toLowerCase();
  const sameDomain = dom(ad.finalUrl) && dom(ad.finalUrl) === dom(prof.biz.url) ? 1 : dom(ad.finalUrl) ? 0.45 : 0;

  /* 1. 광고 관련성 (0~3.5) */
  const relevance = 3.5 * clamp(inHead * 0.62 + inDesc * 0.24 + kwObj.brandFit * 0.28 - (kwObj.offTarget ? 0.45 : 0), 0, 1);
  /* 2. 예상 CTR (0~3.5) — 소재 분량, CTA, 검색유형 정합 */
  const assetDepth = clamp((ad.headlines.length - 3) / 12, 0, 1) * 0.5 + clamp((ad.descriptions.length - 2) / 2, 0, 1) * 0.25;
  const cta = /(신청|시작|무료|지금|받기|알아보기|둘러보기|체험|구독|할인|문의|예약)/.test(heads + descs) ? 0.22 : 0;
  const ext = clamp((ad.sitelinks.length / 4) * 0.6 + (ad.callouts.length / 4) * 0.4, 0, 1) * 0.3;
  const ctrScore = 3.5 * clamp(assetDepth + cta + ext + brandNamed + (matchType === "exact" ? 0.2 : matchType === "broad" ? -0.05 : 0.08) + inHead * 0.32, 0, 1);
  /* 3. 방문 페이지 만족도 (0~3) — 키워드가 우리 사업 설명·URL과 맞는가 */
  const landing = 3 * clamp(0.18 + inUrl * 0.3 + inBiz * 0.3 + sameDomain * 0.28 + (ad.path1 ? 0.08 : 0) - (kwObj.offTarget ? 0.4 : 0), 0, 1);

  const qs = clamp(Math.round(relevance + ctrScore + landing), 1, 10);
  return {
    qs, sameDomain,
    parts: {
      relevance: relevance >= 2.4 ? "평균 이상" : relevance >= 1.4 ? "평균" : "평균 미만",
      ctr: ctrScore >= 2.4 ? "평균 이상" : ctrScore >= 1.4 ? "평균" : "평균 미만",
      landing: landing >= 2.1 ? "평균 이상" : landing >= 1.3 ? "평균" : "평균 미만",
    },
  };
}

/* ── 포지션별 기본 CTR ──────────────────────────────── */
const posCtr = p => p <= 1.2 ? 0.082 : p <= 2 ? 0.052 : p <= 3 ? 0.034 : p <= 4 ? 0.021 : 0.011;

/* ── 시뮬레이션 엔진 ─────────────────────────────────── */
function simulate(cfg) {
  const prof = bizProfile(cfg.biz);
  const seed = hashStr(JSON.stringify({
    g: cfg.goal, b: cfg.bidding, bd: cfg.budget, cpa: cfg.targetCpa, cpc: cfg.maxCpc,
    geo: cfg.geo, lang: cfg.lang, kws: cfg.keywords, ad: cfg.ad, net: cfg.displayExpansion,
    biz: cfg.biz,
  }));
  const rng = mulberry32(seed);
  const days = cfg.biz.period || 30;
  const goal = GOALS[cfg.goal];
  const bid = BIDDING[cfg.bidding];
  const geo = GEOS[cfg.geo], lang = LANGS[cfg.lang];

  /* 키워드 준비 — 전부 이 브랜드의 프로필을 기준으로 평가된다 */
  const kws = cfg.keywords.map(k => {
    const o = classifyKeyword(k.text, prof);
    const q = qualityScore(o, cfg.ad, k.match, prof);
    const queries = buildQueries(o, k.match, mulberry32(hashStr(k.text + k.match + cfg.biz.industry)), prof);
    return { ...o, match: k.match, qs: q.qs, qsParts: q.parts, sameDomain: q.sameDomain, queries };
  });

  /* 디스플레이 네트워크 확장.
     인벤토리는 폭발적으로 늘지만 클릭률·전환율이 검색보다 훨씬 낮고 클릭은 싸다.
     검색분과 디스플레이분을 합친 혼합 배수로 환산해 적용한다. */
  const DISPLAY = { extraVol: 6, ctr: 0.12, cvr: 0.06, cpc: 0.30 };
  let disp = { vol: 1, ctr: 1, cvr: 1, cpc: 1 };
  if (cfg.displayExpansion) {
    const v = 1 + DISPLAY.extraVol;
    const clickRatio = 1 + DISPLAY.extraVol * DISPLAY.ctr;
    disp = {
      vol: v,
      ctr: clickRatio / v,
      cvr: (1 + DISPLAY.extraVol * DISPLAY.ctr * DISPLAY.cvr) / clickRatio,
      cpc: (1 + DISPLAY.extraVol * DISPLAY.ctr * DISPLAY.cpc) / clickRatio,
    };
  }

  /* 광고 확장·자산이 주는 CTR 이득.
     품질평가점수는 정수로 반올림되어 확장의 효과가 묻히므로, 광고 면적이
     넓어지는 효과는 CTR에 직접 반영한다(실제로도 사이트링크는 CTR을 올린다). */
  const adAssets = cfg.ad;
  const extBoost = 1
    + clamp(adAssets.sitelinks.length / 4, 0, 1) * 0.12
    + clamp(adAssets.callouts.length / 4, 0, 1) * 0.06
    + clamp((adAssets.headlines.length - 3) / 12, 0, 1) * 0.08;

  /* 입찰가 결정 */
  const marketAvg = kws.reduce((s, k) => s + k.marketCpc, 0) / Math.max(1, kws.length);
  let bidCap;
  if (cfg.bidding === "manual_cpc") bidCap = cfg.maxCpc;
  else if (cfg.bidding === "max_clicks") bidCap = cfg.maxCpc || marketAvg * 1.15;
  else if (cfg.bidding === "target_cpa") {
    const expCvr = goal.cvr * 1.0;
    bidCap = cfg.targetCpa * expCvr;         // 타겟 CPA가 낮으면 입찰가가 시장 아래로 떨어진다
  } else bidCap = marketAvg * 1.2;           // 전환수 최대화

  /* 일자별 시뮬레이션 */
  const daily = [];
  const kwAgg = kws.map(k => ({ kw: k, impr: 0, clicks: 0, cost: 0, conv: 0, lostBudget: 0, lostRank: 0 }));
  const qAgg = new Map();
  const devSplit = { mobile: 0.63, desktop: 0.28, tablet: 0.09 };
  const devAgg = { mobile: { impr: 0, clicks: 0, cost: 0, conv: 0 }, desktop: { impr: 0, clicks: 0, cost: 0, conv: 0 }, tablet: { impr: 0, clicks: 0, cost: 0, conv: 0 } };
  const hourAgg = Array.from({ length: 24 }, () => ({ impr: 0, clicks: 0, cost: 0, conv: 0 }));
  const HOUR_W = [.012,.007,.005,.004,.005,.009,.018,.032,.048,.058,.062,.060,.055,.058,.061,.062,.060,.058,.062,.070,.072,.062,.042,.025];

  let cumConv = 0;

  for (let d = 0; d < days; d++) {
    const dow = (d + 3) % 7;                       // 0=월 기준 오프셋
    const weekend = dow === 5 || dow === 6;
    const season = (weekend ? prof.ind.seasonWeekend : 1.06) * (0.94 + rng() * 0.12);
    /* 학습 기간: 스마트 입찰은 초반 성과가 나쁘다 */
    const learn = d < bid.learnDays ? 0.55 + 0.45 * (d / Math.max(1, bid.learnDays)) : 1;
    const learnCpa = d < bid.learnDays ? 1.45 - 0.45 * (d / Math.max(1, bid.learnDays)) : 1;

    let dayImpr = 0, dayClicks = 0, dayCost = 0, dayConv = 0, dayLostBudget = 0, dayLostRank = 0;
    let budgetLeft = cfg.budget * 1.2;              // 구글은 일일예산의 최대 2배까지 변동 허용(여기선 1.2배)
    let budgetCapped = false;

    /* 키워드별 */
    kws.forEach((k, ki) => {
      const m = MATCH[k.match];
      const dailyVol = (k.volume / 30) * m.reach * geo.mult * lang.mult * season * disp.vol;
      /* 경매: 내 광고순위 vs 시장 */
      const myRank = bidCap * k.qs;
      const compRank = k.marketCpc * (5.2 + k.competition * 3.4);
      const rankRatio = myRank / compRank;
      /* 노출 점유율(순위 기준).
         입찰이 시장 대비 터무니없이 낮으면 경매에 아예 못 들어가므로
         고정 하한을 두지 않는다 — 낮은 입찰은 노출 자체가 사라져야 한다. */
      const isRank = clamp(0.96 * (1 - Math.exp(-1.9 * rankRatio)), 0, 0.94);
      const avgPos = clamp(1 + 3.6 * Math.exp(-2.1 * rankRatio), 1, 5.2);

      let eligible = dailyVol;
      let impr = eligible * isRank * learn;
      const lostRankImpr = eligible - impr;

      /* 클릭 */
      const baseCtr = posCtr(avgPos) * m.ctrMult;
      const qsCtrBoost = 0.68 + (k.qs / 10) * 0.62;
      /* 검색어 관련도 가중 — 확장검색은 무관 검색어가 섞여 CTR/CVR을 갉아먹는다 */
      const relAvg = k.queries.reduce((s, q) => s + q.w * REL_WEIGHT[q.rel], 0);
      const ctr = clamp(baseCtr * qsCtrBoost * (0.55 + relAvg * 0.6) * extBoost * disp.ctr, 0.0002, 0.35);
      let clicks = impr * ctr;

      /* 실제 CPC: 차순위 광고순위 / 내 QS (+10원), 상한은 입찰가 */
      let cpc = clamp((compRank * 0.86) / Math.max(1, k.qs) + 10, 100, bidCap) * disp.cpc;
      if (cfg.bidding === "max_clicks") cpc *= 0.88;
      if (cfg.bidding === "max_conv" || cfg.bidding === "target_cpa") cpc *= learnCpa;

      let cost = clicks * cpc;

      /* 예산 제약 */
      if (cost > budgetLeft) {
        const ratio = budgetLeft / Math.max(1, cost);
        dayLostBudget += impr * (1 - ratio);
        impr *= ratio; clicks *= ratio; cost = budgetLeft;
        budgetCapped = true;
      }
      budgetLeft = Math.max(0, budgetLeft - cost);

      /* 전환 */
      const landingFit = (cfg.ad.finalUrl && cfg.ad.finalUrl.startsWith("http") ? 1 : 0.25) * (0.55 + (k.sameDomain || 0) * 0.45);
      const trackOk = cfg.conversionTracking ? 1 : 0;
      const geoFit = geo.mismatch ? 0.35 : 1;
      const langFit = lang.mismatch ? 0.4 : 1;
      let convRate = goal.cvr * k.cvrMult * (0.6 + (k.qs / 10) * 0.7) * landingFit * geoFit * langFit * disp.cvr;
      if (cfg.bidding === "target_cpa" || cfg.bidding === "max_conv") convRate *= (d < bid.learnDays ? 0.7 : 1.12);

      /* 검색어 단위로 쪼개서 집계 — 무관 검색어는 거의 전환되지 않는다 */
      k.queries.forEach(q => {
        const qi = impr * q.w, qc = clicks * q.w, qcost = cost * q.w;
        const qconv = qc * convRate * REL_WEIGHT[q.rel] * trackOk;
        const key = q.q + "||" + k.text;
        const prev = qAgg.get(key) || { q: q.q, kw: k.text, match: k.match, rel: q.rel, impr: 0, clicks: 0, cost: 0, conv: 0 };
        prev.impr += qi; prev.clicks += qc; prev.cost += qcost; prev.conv += qconv;
        qAgg.set(key, prev);
        dayConv += qconv;
      });

      const kconv = clicks * convRate * relAvg * trackOk;
      dayImpr += impr; dayClicks += clicks; dayCost += cost; dayLostRank += lostRankImpr;
      const a = kwAgg[ki];
      a.impr += impr; a.clicks += clicks; a.cost += cost; a.conv += kconv;
      a.lostBudget += impr * 0; a.lostRank += lostRankImpr;
    });

    /* 기기·시간대 분배 */
    for (const [dev, w] of Object.entries(devSplit)) {
      const convW = dev === "mobile" ? 0.86 : dev === "desktop" ? 1.28 : 0.72;
      devAgg[dev].impr += dayImpr * w; devAgg[dev].clicks += dayClicks * w;
      devAgg[dev].cost += dayCost * w; devAgg[dev].conv += dayConv * w * convW;
    }
    HOUR_W.forEach((w, h) => {
      const convW = h >= 9 && h <= 18 ? 1.18 : h >= 0 && h <= 5 ? 0.45 : 0.9;
      hourAgg[h].impr += dayImpr * w; hourAgg[h].clicks += dayClicks * w;
      hourAgg[h].cost += dayCost * w; hourAgg[h].conv += dayConv * w * convW;
    });

    cumConv += dayConv;
    daily.push({
      day: d + 1, date: dateStr(d), weekend,
      impr: dayImpr, clicks: dayClicks, cost: dayCost, conv: dayConv,
      lostBudget: dayLostBudget, lostRank: dayLostRank, budgetCapped, learning: d < bid.learnDays,
    });
  }

  /* 총계 */
  const tot = daily.reduce((s, r) => ({
    impr: s.impr + r.impr, clicks: s.clicks + r.clicks, cost: s.cost + r.cost, conv: s.conv + r.conv,
    lostBudget: s.lostBudget + r.lostBudget, lostRank: s.lostRank + r.lostRank,
  }), { impr: 0, clicks: 0, cost: 0, conv: 0, lostBudget: 0, lostRank: 0 });

  const queries = [...qAgg.values()].sort((a, b) => b.cost - a.cost);
  const wasteCost = queries.filter(q => q.rel === "off" || q.rel === "loose").reduce((s, q) => s + q.cost, 0);
  const totalEligible = tot.impr + tot.lostBudget + tot.lostRank;
  const m = {
    ...tot,
    ctr: tot.clicks / Math.max(1, tot.impr),
    cpc: tot.cost / Math.max(1, tot.clicks),
    cpa: tot.conv > 0.5 ? tot.cost / tot.conv : Infinity,
    cvr: tot.clicks > 0 ? tot.conv / tot.clicks : 0,
    revenue: tot.conv * cfg.biz.price * prof.model.ltvMult,
    roas: tot.cost > 0 ? (tot.conv * cfg.biz.price * prof.model.ltvMult) / tot.cost : 0,
    isSearch: tot.impr / Math.max(1, totalEligible),
    isLostBudget: tot.lostBudget / Math.max(1, totalEligible),
    isLostRank: tot.lostRank / Math.max(1, totalEligible),
    wasteCost, wasteShare: wasteCost / Math.max(1, tot.cost), marketAvg,
    avgQs: kws.reduce((s, k) => s + k.qs, 0) / Math.max(1, kws.length),
  };

  return {
    cfg, seed, daily, keywords: kwAgg, queries, devices: devAgg, hours: hourAgg, metrics: m, kws,
    bidCap, marketAvg, prof,
  };
}

function dateStr(offset) {
  const base = new Date(2026, 6, 6);            // 2026-07-06 시작 (30일 → 08-04 종료)
  const d = new Date(base.getTime() + offset * 86400000);
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
const DOW = ["일", "월", "화", "수", "목", "금", "토"];
function dowOf(ds) { const [y, m, d] = ds.split("-").map(Number); return DOW[new Date(y, m - 1, d).getDay()]; }

/* ════════════════════════════════════════════════════════
   진단 엔진 — "무엇이 문제였는가"
   각 진단은 근거 숫자와 조치를 함께 낸다.
   ════════════════════════════════════════════════════════ */
function diagnose(sim) {
  const { metrics: m, cfg, kws, queries, prof } = sim;
  const t = cfg.biz.targets;
  const out = [];
  const add = (sev, title, why, ev, fix) => out.push({ sev, title, why, ev, fix });

  /* 1. 예산 제약 */
  if (m.isLostBudget >= 0.15) {
    add(m.isLostBudget >= 0.35 ? "high" : "mid", "예산이 수요를 못 따라갑니다",
      "노출될 수 있었는데 예산이 떨어져 못 나간 비중이 큽니다. 하루 중 이른 시간에 예산이 소진되면 오후·저녁의 좋은 트래픽을 통째로 놓칩니다.",
      [["노출 손실(예산)", pct(m.isLostBudget, 1)], ["일일 예산", won(cfg.budget)], ["예산 소진일", sim.daily.filter(d => d.budgetCapped).length + "일 / " + sim.daily.length + "일"]],
      "일일 예산을 올리거나, 성과가 낮은 키워드를 빼서 남은 예산을 좋은 키워드에 몰아주세요.");
  }
  /* 2. 검색유형이 너무 넓다 */
  if (m.wasteShare >= 0.22) {
    const worst = queries.filter(q => q.rel === "off" || q.rel === "loose").slice(0, 3).map(q => q.q);
    add(m.wasteShare >= 0.4 ? "high" : "mid", "고객이 아닌 검색어에 돈이 새고 있습니다",
      "확장검색은 도달을 넓히지만, 우리 고객이 아닌 검색까지 끌어옵니다. 이 비용은 전환으로 이어지지 않습니다.",
      [["무관·느슨한 검색어 비용", won(m.wasteCost)], ["전체 비용 대비", pct(m.wasteShare, 1)], ["예시", worst.join(", ") || "-"]],
      "검색어 보고서에서 무관한 검색어를 제외 키워드로 추가하고, 핵심 키워드는 구문검색 또는 일치검색으로 좁히세요.");
  }
  /* 3. 품질평가점수 */
  if (m.avgQs <= 5.5) {
    const low = kws.filter(k => k.qs <= 5).map(k => k.text).slice(0, 3);
    add(m.avgQs <= 4 ? "high" : "mid", "품질평가점수가 낮아 클릭당비용이 비쌉니다",
      "품질평가점수가 낮으면 같은 순위를 얻는 데 더 많은 돈을 내야 합니다. 광고문구에 키워드가 없거나, 방문 페이지가 검색 의도와 어긋날 때 떨어집니다.",
      [["평균 품질평가점수", m.avgQs.toFixed(1) + " / 10"], ["평균 CPC", won(m.cpc)], ["낮은 키워드", low.join(", ") || "-"]],
      "제목에 키워드를 그대로 넣고, 키워드별로 광고그룹을 쪼개세요. 방문 페이지도 그 키워드를 말하는 페이지여야 합니다.");
  }
  /* 4. 광고 소재 부족 */
  if (cfg.ad.headlines.length < 8 || cfg.ad.descriptions.length < 3) {
    add(cfg.ad.headlines.length < 5 ? "mid" : "low", "광고 소재가 부족합니다",
      "반응형 검색광고는 제목·설명 조합을 실험해 성과를 올립니다. 자산이 적으면 실험할 조합 자체가 없습니다.",
      [["제목", cfg.ad.headlines.length + "개 (권장 8~15)"], ["설명", cfg.ad.descriptions.length + "개 (권장 4)"], ["CTR", pct(m.ctr, 2)]],
      "제목을 최소 8개까지 채우고, 혜택·가격·신뢰·행동유도를 각각 다른 각도로 쓰세요.");
  }
  /* 5. 타겟 CPA가 비현실적 */
  if (cfg.bidding === "target_cpa") {
    const rec = recommendedCpa(cfg.biz, cfg.goal);
    if (cfg.targetCpa < rec.low * 0.65) {
      add("high", "타겟 CPA가 시장에서 달성 불가능한 수준입니다",
        "타겟 CPA가 너무 낮으면 시스템이 입찰을 포기해 노출 자체가 나오지 않습니다. 성과가 나쁜 게 아니라 경매에 참여를 못 한 것입니다.",
        [["설정한 타겟 CPA", won(cfg.targetCpa)], ["권장 범위", won(rec.low) + " ~ " + won(rec.high)], ["노출 손실(순위)", pct(m.isLostRank, 1)]],
        "타겟 CPA를 권장 범위까지 올려 데이터를 쌓은 뒤, 2주 단위로 10~15%씩 낮추세요.");
    } else if (cfg.targetCpa > rec.high * 1.6) {
      add("low", "타겟 CPA가 필요 이상으로 높습니다",
        "전환은 나오지만 더 싸게 살 수 있는 전환을 비싸게 사고 있습니다.",
        [["설정한 타겟 CPA", won(cfg.targetCpa)], ["권장 범위", won(rec.low) + " ~ " + won(rec.high)], ["실제 CPA", m.cpa === Infinity ? "측정 불가" : won(m.cpa)]],
        "타겟 CPA를 단계적으로 낮추며 전환수가 유지되는 지점을 찾으세요.");
    }
  }
  /* 6. 전환 추적 */
  if (!cfg.conversionTracking && m.clicks >= 30) {
    add("high", "전환 추적이 꺼져 있어 성과를 측정할 수 없습니다",
      "전환 데이터가 없으면 자동 입찰이 학습할 근거가 없고, 어떤 키워드가 돈을 벌어주는지도 알 수 없습니다.",
      [["클릭수", int(m.clicks)], ["측정된 전환", "0"], ["비용", won(m.cost)]],
      "웹사이트에 전환 추적 태그를 설치하고, 전환 액션(" + prof.model.convName + ")을 정의하세요.");
  }
  /* 7. 지역·언어 미스매치 */
  if (GEOS[cfg.geo].mismatch || LANGS[cfg.lang].mismatch) {
    add("mid", "타겟 지역·언어가 실제 고객과 어긋납니다",
      "노출은 늘지만 우리 서비스를 이용할 수 없는 사용자에게 돈을 씁니다.",
      [["지역", GEOS[cfg.geo].name], ["언어", LANGS[cfg.lang].name], ["전환율", pct(m.cvr, 2)]],
      "실제로 상품을 제공할 수 있는 지역과, 사이트가 지원하는 언어로만 좁히세요.");
  }
  /* 8. 광고 확장 미사용 */
  if (cfg.ad.sitelinks.length === 0 && cfg.ad.callouts.length === 0) {
    add("low", "광고 확장을 쓰지 않아 광고가 작게 보입니다",
      "사이트링크·콜아웃은 광고 면적을 넓혀 클릭률을 올립니다. 추가 비용 없이 얻는 CTR입니다.",
      [["사이트링크", "0개"], ["콜아웃", "0개"], ["CTR", pct(m.ctr, 2)]],
      "사이트링크 4개, 콜아웃 4개를 추가하세요.");
  }
  /* 9. 입찰가 부족 */
  if (m.isLostRank >= 0.5) {
    add(m.isLostRank >= 0.7 ? "high" : "mid", "입찰이 약해 경매에서 밀리고 있습니다",
      "광고순위가 낮아 노출 기회를 대부분 경쟁사에 내주고 있습니다. 광고순위는 입찰가 × 품질평가점수입니다.",
      [["노출 손실(순위)", pct(m.isLostRank, 1)], ["노출 점유율", pct(m.isSearch, 1)], ["시장 평균 CPC", won(sim.marketAvg)]],
      "입찰가를 시장 평균 CPC 수준까지 올리거나, 품질평가점수를 올려 같은 입찰가로 더 높은 순위를 받으세요.");
  }
  /* 10. 키워드 구성 */
  const broadCount = cfg.keywords.filter(k => k.match === "broad").length;
  if (cfg.keywords.length <= 3) {
    add("low", "키워드가 너무 적어 트래픽이 제한됩니다",
      "키워드가 적으면 도달할 수 있는 검색 자체가 적습니다.",
      [["키워드 수", cfg.keywords.length + "개"], ["총 노출수", int(m.impr)]],
      "핵심 키워드에서 파생된 롱테일 키워드를 10~20개까지 늘리세요.");
  } else if (broadCount === cfg.keywords.length && cfg.keywords.length > 0) {
    add("mid", "모든 키워드가 확장검색입니다",
      "제어 장치 없이 확장검색만 쓰면 예산이 어디로 갈지 통제할 수 없습니다.",
      [["확장검색", broadCount + "개 / " + cfg.keywords.length + "개"], ["무관 비용 비중", pct(m.wasteShare, 1)]],
      "핵심 키워드는 구문·일치검색으로 두고, 확장검색은 새 검색어 발굴용으로 소수만 쓰세요.");
  }
  /* 11. 오프타겟 키워드를 직접 넣은 경우 */
  const offKw = kws.filter(k => k.offTarget);
  if (offKw.length) {
    add("high", "우리 고객이 아닌 키워드를 직접 입찰하고 있습니다",
      "비즈니스 정보에 적은 업종·제외 조건과 정면으로 어긋나는 키워드입니다. 클릭은 나오지만 전환은 거의 없습니다.",
      [["해당 키워드", offKw.map(k => k.text).join(", ")], ["소진 비용", won(sim.keywords.filter(a => a.kw.offTarget).reduce((s, a) => s + a.cost, 0))]],
      "이 키워드들을 삭제하고, 같은 표현을 제외 키워드로도 등록하세요.");
  }
  /* 12. 학습 기간 */
  if (BIDDING[cfg.bidding].learnDays > 0) {
    const learnCost = sim.daily.filter(d => d.learning).reduce((s, d) => s + d.cost, 0);
    add("low", "자동 입찰 학습 기간이 초반 성과를 눌렀습니다",
      "스마트 입찰은 데이터를 모으는 동안 일부러 다양한 입찰을 시도합니다. 이 기간의 성과는 정상보다 낮게 나오는 것이 정상입니다.",
      [["학습 기간", BIDDING[cfg.bidding].learnDays + "일"], ["학습 기간 비용", won(learnCost)], ["입찰 전략", BIDDING[cfg.bidding].name]],
      "학습 기간에는 설정을 바꾸지 말고 기다리세요. 중간에 바꾸면 학습이 처음부터 다시 시작됩니다.");
  }

  /* 목표 달성 채점 */
  const convScore = clamp(m.conv / Math.max(1, t.conversions), 0, 1.2) * 45;
  /* CPA 점수는 의미 있는 물량이 나왔을 때만 온전히 인정한다.
     입찰을 최소로 낮춰 전환 몇 건만 싸게 얻는 편법을 막는다. */
  const volumeGate = clamp(m.conv / Math.max(1, t.conversions * 0.5), 0, 1);
  const cpaScore = m.conv < 1 ? 0 : clamp(t.cpa / Math.max(1, m.cpa), 0, 1.2) * 35 * volumeGate;
  const effScore = (clamp(1 - m.wasteShare, 0, 1) * 12 + clamp(m.avgQs / 10, 0, 1) * 8) * clamp(m.clicks / 30, 0, 1);
  const score = Math.round(clamp(convScore + cpaScore + effScore, 0, 100));
  const grade = score >= 80 ? "우수" : score >= 60 ? "합격" : score >= 40 ? "개선 필요" : "재설계 필요";

  if (!out.length) add("ok", "치명적인 문제가 발견되지 않았습니다", "설정이 목표와 잘 맞아떨어졌습니다.", [["점수", score + "점"]], "여기서 더 올리려면 검색어 보고서를 주 단위로 보며 제외 키워드를 계속 쌓으세요.");
  const rank = { high: 0, mid: 1, low: 2, ok: 3 };
  out.sort((a, b) => rank[a.sev] - rank[b.sev]);
  return { findings: out, score, grade };
}

}
function load() {

    const raw = JSON.parse(localStorage.getItem(LS) || "null");

    state.campaigns = (raw.campaigns || []).map(cfg => wrapCampaign(cfg));

}
function wrapCampaign(cfg) {
  const sim = simulate(cfg);
  return { cfg, sim, diag: diagnose(sim) };
}

const NAV = [
  { id: "overview", label: "개요" },
  { id: "business", label: "비즈니스 정보" },
  { group: "통계 및 보고서", items: [{ id: "reports", label: "보고서 에디터" }, { id: "diagnostics", label: "진단" }] },
  { group: "캠페인", items: [{ id: "campaigns", label: "캠페인" }, { id: "keywords", label: "키워드" }, { id: "searchterms", label: "검색어" }, { id: "ads", label: "광고" }] },
  { id: "changes", label: "변경 내역" },
];
function renderNav() {
  const n = $("#navCol"); n.innerHTML = "";
  for (const item of NAV) {
    if (item.group) {
      const open = item.items.some(i => i.id === state.view);
      const d = el("details", { class: "nav-group", open: open || undefined });
      d.append(el("summary", { class: "nav-item", html: esc(item.group) + ICON.chev }));
      const sub = el("div", { class: "nav-sub" });
      for (const s of item.items) sub.append(navBtn(s));
      d.append(sub); n.append(d);
    } else n.append(navBtn(item));
  }
}
function navBtn(s) {
  return el("button", {
    class: "nav-item", text: s.label,
    "aria-current": state.view === s.id ? "page" : null,
    onclick: () => go(s.id),
  });
}
function go(view, tab) {
  state.view = view;
  if (tab) state.tab = tab;
  renderNav(); render();
  closeNav();                     /* 좁은 화면에서 내비 서랍을 닫는다 */
  window.scrollTo({ top: 0 });
}
function closeNav() {
  document.body.classList.remove("nav-open");
  const b = $("#btnMenu"); if (b) b.setAttribute("aria-expanded", "false");
}
function toggleNav() {
  const open = document.body.classList.toggle("nav-open");
  const b = $("#btnMenu"); if (b) b.setAttribute("aria-expanded", open ? "true" : "false");
}
const hasBiz = () => state.biz && state.biz.name && state.biz.url && state.biz.desc;
const cur = () => state.campaigns[state.current];

    overview: pageOverview, business: pageBusiness, campaigns: pageCampaigns,
    keywords: () => pageTable("keywords"), searchterms: () => pageTable("searchterms"), ads: pageAds,
    reports: pageReports, diagnostics: pageDiagnostics, changes: pageChanges,
  })[state.view] || pageOverview;

}

  if (!hasBiz() || !state.campaigns.length) {
    /* 설정 체크리스트 — 실제 Google Ads 신규 계정과 같은 구조 */
    const steps = [
      { done: hasBiz(), t: "비즈니스 정보 추가", d: "업종·상품·목표를 입력하면 시뮬레이션이 이 정보를 기준으로 돌아갑니다.", btn: "비즈니스 정보 추가", act: () => go("business") },

/* 표 헬퍼 */
function tbl(cols) {
  const table = el("table", { class: "tbl" });
  const thead = el("thead"); const tr = el("tr");
  cols.forEach(c => tr.append(el("th", { text: c })));
  thead.append(tr); table.append(thead);
  const body = el("tbody"); table.append(body);
  return { table, body, thead };
}
function td(v, cls) { const n = el("td", { class: cls }); if (v instanceof Node) n.append(v); else n.textContent = v; if (typeof v === "string" && /^[₩\d]/.test(v)) n.classList.add("num"); return n; }

function statRow(m, cfg) {
  const t = cfg.biz.targets, md = MODELS[cfg.biz.model];
  const s = (k, v, d, cls) => el("div", { class: "stat" }, [
    el("div", { class: "k", text: k }), el("div", { class: "v num", text: v }),
    d ? el("div", { class: "d " + (cls || ""), text: d }) : null,
  ]);
  const convOk = m.conv >= t.conversions;
  const cpaOk = m.cpa <= t.cpa;
  return el("div", { class: "stat-row" }, [
    s("노출수", int(m.impr), "노출 점유율 " + pct(m.isSearch, 1)),
    s("클릭수", int(m.clicks), "CTR " + pct(m.ctr)),
    s("평균 CPC", won(m.cpc), "시장 평균 대비 " + (m.cpc > 0 ? Math.round((m.cpc / Math.max(1, m.marketAvg || m.cpc)) * 100) : 100) + "%"),
    s("비용", won(m.cost), "예산 " + won(t.budgetTotal) + " 중 " + pct(m.cost / Math.max(1, t.budgetTotal), 0)),
    s(md.convName, m.conv.toFixed(1) + "건", "목표 " + t.conversions + "건 · " + (convOk ? "달성" : "미달"), convOk ? "ok" : "bad"),
    s("전환당비용", m.cpa === Infinity ? "—" : won(m.cpa), "목표 " + won(t.cpa) + " · " + (cpaOk ? "달성" : "초과"), cpaOk ? "ok" : "bad"),
    s("전환율", pct(m.cvr), "클릭 대비"),
    s("ROAS", m.roas.toFixed(2) + "배", "매출 추정 " + won(m.revenue)),
  ]);
}

function verdictCard(c) {
  const d = c.diag, m = c.sim.metrics, t = c.cfg.biz.targets;
  const color = d.score >= 80 ? "var(--good)" : d.score >= 60 ? "var(--good)" : d.score >= 40 ? "var(--warn)" : "var(--crit)";
  const soft = d.score >= 60 ? "var(--good-soft)" : d.score >= 40 ? "var(--warn-soft)" : "var(--crit-soft)";
  const high = d.findings.filter(f => f.sev === "high").length;
  return el("div", { class: "verdict" }, [
    el("div", { class: "score num", style: "background:" + soft + ";color:" + color, text: d.score }),
    el("div", { style: "flex:1;min-width:0" }, [
      el("h3", { text: d.grade + " · " + c.cfg.name }),
      el("p", { text: MODELS[c.cfg.biz.model].convName + " " + m.conv.toFixed(1) + "건 (목표 " + t.conversions + "건), CPA " + (m.cpa === Infinity ? "측정 불가" : won(m.cpa)) + " (목표 " + won(t.cpa) + "). " + (high ? "심각한 문제 " + high + "건이 발견되었습니다." : "심각한 문제는 없습니다.") }),
    ]),
    el("button", { class: "btn btn-outline", text: "진단 보기", onclick: () => go("diagnostics") }),
  ]);
}

function topFindings(c, n) {
  const card = el("div", { class: "card" }, [
    el("div", { class: "card-head" }, [el("h3", { text: "무엇이 문제였는가" }), el("span", { class: "sub", text: "심각도 순" }),
      el("button", { class: "btn btn-text btn-sm", style: "margin-left:auto", text: "전체 보기", onclick: () => go("diagnostics") })]),
  ]);
  const body = el("div", { class: "card-body grid", style: "gap:12px" });
  c.diag.findings.slice(0, n).forEach(f => body.append(diagNode(f)));
  card.append(body); return card;
}
function diagNode(f) {
  const evs = el("div", { class: "ev" });
  f.ev.forEach(([k, v]) => evs.append(el("span", { html: esc(k) + " <b>" + esc(v) + "</b>" })));
  return el("div", { class: "diag sev-" + f.sev }, [
    el("span", { class: "diag-ico", style: "color:" + (f.sev === "high" ? "var(--crit)" : f.sev === "mid" ? "var(--warn)" : f.sev === "ok" ? "var(--good)" : "var(--ink-3)"), html: sevIcon(f.sev) }),
    el("div", { style: "flex:1;min-width:0" }, [
      el("h4", {}, [document.createTextNode(f.title), el("span", { class: "tag " + sevTag(f.sev), text: "심각도 " + sevLabel(f.sev) })]),
      el("p", { text: f.why }), evs,
      el("div", { class: "fix", html: "<b>조치</b> · " + esc(f.fix) }),
    ]),
  ]);
}

/* ════════════════════════════════════════════════════════
   차트 (인라인 SVG · 호버 툴팁)
   ════════════════════════════════════════════════════════ */
const tipEl = () => $("#tip");
function showTip(host, x, y, html) {
  const t = tipEl(); t.innerHTML = html; t.style.opacity = "1";
  const hr = host.getBoundingClientRect(), tr = t.getBoundingClientRect();
  let left = x + 14, top = y - tr.height - 10;
  if (left + tr.width > window.innerWidth - 8) left = x - tr.width - 14;
  if (top < 8) top = y + 18;
  t.style.left = left + "px"; t.style.top = top + "px";
}
const hideTip = () => { tipEl().style.opacity = "0"; };

const METRICS = {
  impr: { label: "노출수", fmt: int, key: "impr" },
  clicks: { label: "클릭수", fmt: int, key: "clicks" },
  cost: { label: "비용", fmt: won, key: "cost" },
  conv: { label: "전환수", fmt: v => v.toFixed(1) + "건", key: "conv" },
};

function dailyChartCard(c) {
  let metric = "clicks";
  const card = el("div", { class: "card" });
  const sw = el("div", { class: "metric-switch" });
  const holder = el("div", { class: "card-body" });
  const draw = () => {
    holder.innerHTML = "";
    holder.append(lineChart(c, metric));
    [...sw.children].forEach(b => b.setAttribute("aria-pressed", b.dataset.m === metric ? "true" : "false"));
  };
  Object.entries(METRICS).forEach(([k, v]) => sw.append(el("button", {
    class: "mbtn", "data-m": k, text: v.label, "aria-pressed": k === metric ? "true" : "false",
    onclick: () => { metric = k; draw(); },
  })));
  card.append(el("div", { class: "card-head" }, [
    el("h3", { text: "일별 실적" }), el("span", { class: "sub", text: c.sim.daily.length + "일" }),
    el("div", { style: "margin-left:auto" }, [sw]),
  ]));
  card.append(holder); draw();
  return card;

function lineChart(c, metricKey) {
  const M = METRICS[metricKey];
  const data = c.sim.daily;
  const W = 960, H = 240, P = { t: 16, r: 16, b: 30, l: 62 };
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const vals = data.map(d => d[M.key]);
  const max = Math.max(1, ...vals) * 1.12;
  const x = i => P.l + (iw * i) / Math.max(1, data.length - 1);
  const y = v => P.t + ih - (v / max) * ih;

  const wrap = el("div", { class: "chart-wrap" });
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", "일별 " + M.label + " 추이");
  const mk = (t, a) => { const n = document.createElementNS(ns, t); for (const k in a) n.setAttribute(k, a[k]); return n; };

  /* 가로 그리드 + y축 라벨 */
  for (let i = 0; i <= 4; i++) {
    const v = (max / 4) * i, yy = y(v);
    svg.append(mk("line", { x1: P.l, x2: W - P.r, y1: yy, y2: yy, class: "gridline" }));
    const lb = mk("text", { x: P.l - 10, y: yy + 4, "text-anchor": "end", class: "ax" });
    lb.textContent = metricKey === "cost" ? "₩" + Math.round(v / 1000) + "k" : Math.round(v).toLocaleString("ko-KR");
    svg.append(lb);
  }
  /* 학습 기간 / 예산 소진일 음영 */
  const learnDays = data.filter(d => d.learning).length;
  if (learnDays) {
    svg.append(mk("rect", { x: P.l, y: P.t, width: (iw * (learnDays - 1)) / Math.max(1, data.length - 1), height: ih, fill: "var(--blue-soft)", opacity: ".55" }));
    const lt = mk("text", { x: P.l + 6, y: P.t + 14, class: "ax" }); lt.textContent = "학습 기간";
    svg.append(lt);
  }
  data.forEach((d, i) => {
    if (d.budgetCapped) svg.append(mk("line", { x1: x(i), x2: x(i), y1: P.t, y2: P.t + ih, stroke: "var(--mark-crit)", "stroke-width": 1, opacity: ".2" }));
  });

  /* 영역 + 선 */
  const line = data.map((d, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(d[M.key]).toFixed(1)).join(" ");
  const area = line + " L" + x(data.length - 1) + " " + (P.t + ih) + " L" + P.l + " " + (P.t + ih) + " Z";
  const gid = "g" + metricKey;
  const defs = mk("defs", {});
  const lg = mk("linearGradient", { id: gid, x1: "0", y1: "0", x2: "0", y2: "1" });
  lg.append(mk("stop", { offset: "0%", "stop-color": "var(--series)", "stop-opacity": ".26" }));
  lg.append(mk("stop", { offset: "100%", "stop-color": "var(--series)", "stop-opacity": "0" }));
  defs.append(lg); svg.append(defs);
  svg.append(mk("path", { d: area, fill: "url(#" + gid + ")" }));
  svg.append(mk("path", { d: line, fill: "none", stroke: "var(--series)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
  /* 끝점 강조 */
  const last = data.length - 1;
  svg.append(mk("circle", { cx: x(last), cy: y(data[last][M.key]), r: 4.5, fill: "var(--series)", stroke: "var(--surface)", "stroke-width": 2 }));

  /* x축 라벨 (5개) */
  svg.append(mk("line", { x1: P.l, x2: W - P.r, y1: P.t + ih, y2: P.t + ih, class: "axline" }));
  [0, Math.floor(last / 4), Math.floor(last / 2), Math.floor((3 * last) / 4), last].forEach(i => {
    const t = mk("text", { x: x(i), y: H - 10, "text-anchor": "middle", class: "ax" });
    t.textContent = data[i].date.slice(5);
    svg.append(t);
  });

  /* 크로스헤어 + 툴팁 */
  const cross = mk("line", { x1: 0, x2: 0, y1: P.t, y2: P.t + ih, stroke: "var(--ink-3)", "stroke-width": 1, opacity: "0" });
  const dot = mk("circle", { r: 5, fill: "var(--series)", stroke: "var(--surface)", "stroke-width": 2, opacity: "0" });
  svg.append(cross); svg.append(dot);
  const hit = mk("rect", { x: P.l, y: P.t, width: iw, height: ih, fill: "transparent" });
  svg.append(hit);
  hit.addEventListener("mousemove", e => {
    const r = svg.getBoundingClientRect();
    const px = ((e.clientX - r.left) / r.width) * W;
    const i = clamp(Math.round(((px - P.l) / iw) * (data.length - 1)), 0, data.length - 1);
    const d = data[i];
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("opacity", ".45");
    dot.setAttribute("cx", x(i)); dot.setAttribute("cy", y(d[M.key])); dot.setAttribute("opacity", "1");
    showTip(wrap, e.clientX, e.clientY,
      "<b>" + d.date + "</b> (" + dowOf(d.date) + ")<br>" + M.label + " <b>" + M.fmt(d[M.key]) + "</b>" +
      (d.budgetCapped ? "<br><span style='color:#f6aea9'>예산 소진으로 노출 중단</span>" : "") +
      (d.learning ? "<br>자동 입찰 학습 기간" : ""));
  });
  hit.addEventListener("mouseleave", () => { cross.setAttribute("opacity", "0"); dot.setAttribute("opacity", "0"); hideTip(); });
  wrap.append(svg);
  return wrap;
}

/* 비용 구성: 검색어 관련도별 (파랑 계열 = 우리 고객, 빨강 = 무관) */
function wasteChartCard(c) {
  const cats = [
    { key: "exact", label: "정확 일치", color: "var(--series)" },
    { key: "close", label: "관련", color: "var(--series-2)" },
    { key: "loose", label: "느슨함", color: "var(--series-3)" },
    { key: "off", label: "무관 (고객 아님)", color: "var(--mark-crit)" },
  ];
  const totals = {};
  cats.forEach(k => totals[k.key] = 0);
  c.sim.queries.forEach(q => { totals[q.rel] = (totals[q.rel] || 0) + q.cost; });
  const sum = Math.max(1, Object.values(totals).reduce((a, b) => a + b, 0));

  const wrap = el("div", { class: "chart-wrap" });
  const ns = "http://www.w3.org/2000/svg";
  const W = 960, H = 66;
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", "검색어 관련도별 비용 구성");
  const mk = (t, a) => { const n = document.createElementNS(ns, t); for (const k in a) n.setAttribute(k, a[k]); return n; };
  let cx = 0;
  cats.forEach(cat => {
    const v = totals[cat.key] || 0;
    const w = (v / sum) * W;
    if (w <= 0) return;
    const r = mk("rect", { x: cx + 1, y: 8, width: Math.max(0, w - 2), height: 30, rx: 4, fill: cat.color });
    r.addEventListener("mousemove", e => showTip(wrap, e.clientX, e.clientY, "<b>" + cat.label + "</b><br>" + won(v) + " · " + pct(v / sum, 1)));
    r.addEventListener("mouseleave", hideTip);
    svg.append(r);
    if (w > 76) {
      const t = mk("text", { x: cx + w / 2, y: 56, "text-anchor": "middle", class: "ax" });
      t.textContent = cat.label + " " + pct(v / sum, 0);
      svg.append(t);
    }
    cx += w;
  });
  wrap.append(svg);
  const legend = el("div", { class: "legend" });
  cats.forEach(cat => legend.append(el("span", { html: '<i style="background:' + cat.color + '"></i>' + esc(cat.label) + " · " + won(totals[cat.key] || 0) })));
  return el("div", { class: "card" }, [
    el("div", { class: "card-head" }, [el("h3", { text: "비용은 어디로 갔는가" }), el("span", { class: "sub", text: "검색어 관련도별 비용 구성" })]),

function csvEscape(v) {
  const s = String(v ?? "");
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function toCsv(rows) { return "﻿" + rows.map(r => r.map(csvEscape).join(",")).join("\r\n"); }
function downloadBlob(filename, blob) {
  const url = URL.createObjectURL(blob);
  const a = el("a", { href: url, download: filename });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
function downloadCsv(filename, rows) {
  downloadBlob(filename, new Blob([toCsv(rows)], { type: "text/csv;charset=utf-8;" }));
}

/* ── 최소 ZIP(무압축) 작성기 ───────────────────────────
   브라우저는 한 사이트가 파일을 연달아 내려받는 것을 차단한다.
   보고서 5종을 ZIP 하나로 묶어 다운로드를 1회로 만든다. */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) { let c = i; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[i] = c >>> 0; }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function makeZip(files) {                       /* files: [{name, text}] */
  const enc = new TextEncoder();
  const body = [], central = [];
  const DOS_TIME = 0, DOS_DATE = ((2026 - 1980) << 9) | (1 << 5) | 1;
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), data = enc.encode(f.text), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true);
    lh.setUint16(6, 0x0800, true);              /* 파일명 UTF-8 플래그 */
    lh.setUint16(8, 0, true);                   /* 저장(무압축) */
    lh.setUint16(10, DOS_TIME, true); lh.setUint16(12, DOS_DATE, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    body.push(new Uint8Array(lh.buffer), name, data);

    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true);
    cd.setUint16(8, 0x0800, true); cd.setUint16(10, 0, true);
    cd.setUint16(12, DOS_TIME, true); cd.setUint16(14, DOS_DATE, true);
    cd.setUint32(16, crc, true); cd.setUint32(20, data.length, true); cd.setUint32(24, data.length, true);
    cd.setUint16(28, name.length, true);
    cd.setUint32(42, offset, true);
    central.push(new Uint8Array(cd.buffer), name);
    offset += 30 + name.length + data.length;
  }
  const cdSize = central.reduce((s, c) => s + c.length, 0);
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0, 0x06054b50, true);
  eo.setUint16(8, files.length, true); eo.setUint16(10, files.length, true);
  eo.setUint32(12, cdSize, true); eo.setUint32(16, offset, true);
  return new Blob([...body, ...central, new Uint8Array(eo.buffer)], { type: "application/zip" });
}

  w.append(el("label", { class: "opt" + (d.displayExpansion ? " sel" : "") }, [
    el("input", { type: "checkbox", checked: d.displayExpansion || undefined, onchange: e => { d.displayExpansion = e.target.checked; renderWizard(); } }),
    el("div", {}, [el("div", { class: "t", text: "디스플레이 네트워크 확장" }), el("div", { class: "d", text: "검색 예산이 남을 때 디스플레이에도 노출합니다. 노출은 크게 늘지만 검색 대비 전환 의도가 낮습니다." })]),
  ]));
  w.append(el("label", { class: "opt" + (d.conversionTracking ? " sel" : "") }, [
    el("input", { type: "checkbox", checked: d.conversionTracking || undefined, onchange: e => { d.conversionTracking = e.target.checked; renderWizard(); } }),
    el("div", {}, [el("div", { class: "t", text: "전환 추적 사용" }), el("div", { class: "d", text: "끄면 전환이 0으로 측정되고 자동 입찰이 학습할 데이터가 없습니다. 일부러 꺼보고 결과를 비교해 보세요." })]),
  ]));
}

/* 4. 예산 및 입찰 */
function stepBudget(d, w) {
  w.append(wizHead("예산 및 입찰", "얼마를, 어떤 방식으로 쓸지 정합니다."));
  const total = d.budget * (state.biz.period || 30);
  const over = total > state.biz.targets.budgetTotal;
  w.append(el("div", { class: "field" }, [
    el("label", { text: "일일 예산 (원)" }),
    el("input", { class: "inp", type: "number", min: 1000, step: 1000, value: d.budget, oninput: e => { d.budget = +e.target.value || 0; renderWizard(); } }),
    el("div", { class: "hint" + (over ? " warn" : ""), text: (state.biz.period || 30) + "일 기준 총 " + won(total) + " · 실습 총예산 " + won(state.biz.targets.budgetTotal) + (over ? " 를 초과합니다" : "") }),
  ]));
  Object.entries(BIDDING).forEach(([k, v]) => {
    w.append(el("label", { class: "opt" + (d.bidding === k ? " sel" : "") }, [
      el("input", { type: "radio", name: "bid", checked: d.bidding === k || undefined, onchange: () => { d.bidding = k; renderWizard(); } }),
      el("div", { style: "flex:1" }, [
        el("div", { class: "t", text: v.name }),
        el("div", { class: "d", text: v.desc + (v.learnDays ? " · 학습 기간 " + v.learnDays + "일" : "") }),
      ]),
    ]));
  });
  if (d.bidding === "target_cpa") {
    const rec = recommendedCpa(state.biz, d.goal);
    const warnEl = el("div", { class: "hint" });
    const upd = () => {
      if (d.targetCpa < rec.low * 0.65) { warnEl.className = "hint warn"; warnEl.textContent = "권장 범위보다 크게 낮습니다. 시스템이 입찰을 포기해 노출이 거의 나오지 않을 수 있습니다."; }
      else if (d.targetCpa > rec.high * 1.6) { warnEl.className = "hint warn"; warnEl.textContent = "권장 범위보다 훨씬 높습니다. 전환은 늘지만 전환당비용이 비싸집니다."; }
      else { warnEl.className = "hint"; warnEl.textContent = "권장 범위 안입니다."; }
    };
    const inp = el("input", {
      class: "inp", type: "number", min: 100, step: 500, value: d.targetCpa,
      oninput: e => { d.targetCpa = +e.target.value || 0; upd(); },
    });
    upd();
    w.append(el("div", { class: "field" }, [
      el("label", { text: "타겟 CPA (원)" }), inp,
      el("div", { class: "hint", html: "이 업종·목표에서 <b>권장 타겟 CPA는 " + won(rec.low) + " ~ " + won(rec.high) + "</b> (중앙값 " + won(rec.mid) + ")입니다. 값은 직접 정하세요 — 낮게 잡을수록 전환당비용은 싸지지만 노출량이 줄어듭니다." }),
      warnEl,
      el("div", { class: "chips" }, [
        el("button", { class: "chip", text: "권장값 " + won(rec.mid) + " 적용", onclick: () => { d.targetCpa = rec.mid; inp.value = rec.mid; upd(); } }),
        el("button", { class: "chip", text: "채점 목표 " + won(state.biz.targets.cpa) + " 적용", onclick: () => { d.targetCpa = state.biz.targets.cpa; inp.value = state.biz.targets.cpa; upd(); } }),
      ]),
    ]));
  }
  if (d.bidding === "manual_cpc" || d.bidding === "max_clicks") {
    w.append(el("div", { class: "field" }, [
      el("label", { text: d.bidding === "manual_cpc" ? "최대 CPC 입찰가 (원)" : "최대 CPC 한도 (원, 선택)" }),
      el("input", { class: "inp", type: "number", min: 100, step: 100, value: d.maxCpc, oninput: e => { d.maxCpc = +e.target.value || 0; } }),
      el("div", { class: "hint", text: "이 업종의 시장 CPC는 대체로 " + won(400 * INDUSTRIES[state.biz.industry].cpc) + " ~ " + won(2600 * INDUSTRIES[state.biz.industry].cpc) + " 사이입니다." }),
    ]));
  }
}

/* 5. 키워드 */
function parseKeywords(text) {
  return text.split(/[\n,]/).map(s => s.trim()).filter(Boolean).map(s => {
    if (/^\[.+\]$/.test(s)) return { text: s.slice(1, -1).trim(), match: "exact" };
    if (/^".+"$/.test(s)) return { text: s.slice(1, -1).trim(), match: "phrase" };
    return { text: s, match: "broad" };
  }).filter(k => k.text);
}
function stepKeywords(d, w) {
  w.append(wizHead("키워드", "고객이 실제로 검색할 말을 넣으세요. 검색유형 기호를 그대로 쓸 수 있습니다."));
  const ta = el("textarea", {
    class: "inp", style: "min-height:150px",
    value: d.keywords.map(k => MATCH[k.match].fmt(k.text)).join("\n"),
    placeholder: "홈트레이닝 클래스\n\"홈트 온라인 강의\"\n[집에서 하는 운동]",
    oninput: e => { d.keywords = parseKeywords(e.target.value); renderPreview(); },
  });
  w.append(el("div", { class: "field" }, [
    el("label", { text: "키워드 (한 줄에 하나)" }), ta,
    el("div", { class: "hint", html: "<b>홈트</b> = 확장검색 · <b>\"홈트\"</b> = 구문검색 · <b>[홈트]</b> = 일치검색. 확장검색은 도달이 넓은 대신 무관한 검색어까지 끌어옵니다." }),
  ]));
  const sug = el("div", { class: "chips" });
  const ind = INDUSTRIES[state.biz.industry];
  const brandTok = tokenize(state.biz.name + " " + state.biz.desc).slice(0, 4);
  const ideas = [...new Set([...ind.seeds.slice(0, 6).map(s => (brandTok[0] || "") + " " + s), ...ind.seeds.slice(0, 4)])].map(s => s.trim()).filter(Boolean);
  ideas.forEach(s => sug.append(el("button", { class: "chip", text: "+ " + s, onclick: () => { ta.value = (ta.value ? ta.value + "\n" : "") + s; d.keywords = parseKeywords(ta.value); renderPreview(); } })));
  w.append(el("div", { class: "field" }, [el("label", { text: "이 업종에서 자주 쓰이는 키워드" }), sug]));

  const preview = el("div"); w.append(preview);
  function renderPreview() {
    preview.innerHTML = "";
    if (!d.keywords.length) return;
    const prof = bizProfile(state.biz);
    const t = tbl(["키워드", "검색유형", "월 검색량(추정)", "경쟁", "시장 CPC", "브랜드 적합도", "판정"]);
    d.keywords.forEach(k => {
      const o = classifyKeyword(k.text, prof);
      t.body.append(el("tr", {}, [
        td(MATCH[k.match].fmt(k.text)), td(MATCH[k.match].name), td(int(o.volume)),
        td(o.competition >= 0.7 ? "높음" : o.competition >= 0.4 ? "보통" : "낮음"), td(won(o.marketCpc)),
        td(pct(o.brandFit, 0)),
        td(el("span", { class: "tag " + (o.offTarget ? "tag-crit" : o.brandFit >= 0.4 ? "tag-good" : "tag-warn"), text: o.offTarget ? "고객 아님" : o.brandFit >= 0.4 ? "적합" : "관련 약함" })),
      ]));
    });
    preview.append(el("div", { class: "card" }, [
      el("div", { class: "card-head" }, [el("h3", { text: "키워드 진단" }), el("span", { class: "sub", text: state.biz.name + " 기준" })]),
      el("div", { class: "tbl-wrap" }, [t.table]),
    ]));
  }
  renderPreview();
}

/* 6. 광고 */
function stepAd(d, w) {
  const ad = d.ad;
  w.append(wizHead("광고 만들기", "반응형 검색광고는 제목·설명을 조합해 노출합니다. 자산이 많을수록 유리합니다."));
  const g = el("div", { style: "display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px" });
  g.append(el("div", { class: "field" }, [el("label", { text: "최종 URL" }),
    el("input", { class: "inp", value: ad.finalUrl, oninput: e => { ad.finalUrl = e.target.value.trim(); renderWizard(); } }),
    el("div", { class: "hint", text: "비즈니스 도메인(" + state.biz.url + ")과 다르면 방문 페이지 점수가 떨어집니다." })]));
  g.append(el("div", { class: "field" }, [el("label", { text: "표시 경로 1" }), el("input", { class: "inp", maxlength: 15, value: ad.path1, oninput: e => { ad.path1 = e.target.value; renderPrev(); } })]));
  g.append(el("div", { class: "field" }, [el("label", { text: "표시 경로 2" }), el("input", { class: "inp", maxlength: 15, value: ad.path2, oninput: e => { ad.path2 = e.target.value; renderPrev(); } })]));
  w.append(g);

  w.append(assetList("제목", ad.headlines, 15, 30, "혜택·가격·신뢰·행동유도를 서로 다른 각도로 쓰세요.", renderPrev));
  w.append(assetList("설명", ad.descriptions, 4, 90, "제목에서 못 다 한 근거와 차별점을 적으세요.", renderPrev));
  w.append(assetList("사이트링크", ad.sitelinks, 4, 25, "추가 비용 없이 광고 면적을 넓혀 CTR을 올립니다.", renderPrev));
  w.append(assetList("콜아웃", ad.callouts, 4, 25, "무료 배송, 당일 상담 같은 짧은 강점입니다.", renderPrev));

  const prevHost = el("div"); w.append(prevHost);
  function renderPrev() {
    prevHost.innerHTML = "";
    const dom = (ad.finalUrl.match(/https?:\/\/([^/]+)/) || [, "example.com"])[1];
    prevHost.append(el("div", { class: "card" }, [
      el("div", { class: "card-head" }, [el("h3", { text: "미리보기" })]),
      el("div", { class: "card-body" }, [el("div", { class: "serp" }, [
        el("div", {}, [el("span", { class: "badge", text: "광고" }), el("span", { class: "u", text: dom + (ad.path1 ? " › " + ad.path1 : "") + (ad.path2 ? " › " + ad.path2 : "") })]),
        el("div", { class: "t", text: ad.headlines.filter(Boolean).slice(0, 3).join(" | ") || "제목을 입력하세요" }),
        el("div", { class: "d", text: ad.descriptions.filter(Boolean).slice(0, 2).join(" ") || "설명을 입력하세요" }),
        ad.sitelinks.filter(Boolean).length ? el("div", { style: "display:flex;gap:18px;margin-top:8px;flex-wrap:wrap" }, ad.sitelinks.filter(Boolean).map(s => el("span", { class: "t", style: "font-size:14px", text: s }))) : null,
        ad.callouts.filter(Boolean).length ? el("div", { class: "d", style: "margin-top:6px", text: ad.callouts.filter(Boolean).join(" · ") }) : null,
      ])]),
    ]));
  }
  renderPrev();
}
function assetList(label, arr, max, maxLen, hint, onChange) {
  const box = el("div", { class: "field" });
  box.append(el("label", { text: label + " (" + arr.length + "/" + max + ")" }));
  const list = el("div", { class: "grid", style: "gap:8px" });
  const paint = () => {
    list.innerHTML = "";
    arr.forEach((v, i) => {
      const inp = el("input", {
        class: "inp", value: v, maxlength: maxLen,
        oninput: e => { arr[i] = e.target.value; cnt.textContent = e.target.value.length + "/" + maxLen; onChange && onChange(); },
      });
      const cnt = el("span", { class: "counter", text: (v || "").length + "/" + maxLen, style: "min-width:52px" });
      list.append(el("div", { style: "display:flex;gap:8px;align-items:center" }, [
        inp, cnt,
        el("button", { class: "icon-btn", "aria-label": "삭제", html: ICON.x, onclick: () => { arr.splice(i, 1); paint(); box.firstChild.textContent = label + " (" + arr.length + "/" + max + ")"; onChange && onChange(); renderFootOnly(); } }),
      ]));
    });
  };
  paint();
  box.append(list);
  box.append(el("div", { style: "display:flex;gap:10px;align-items:center;margin-top:4px" }, [
    el("button", {
      class: "btn btn-outline btn-sm", html: ICON.plus + label + " 추가",
      onclick: e => { if (arr.length >= max) return; arr.push(""); paint(); box.firstChild.textContent = label + " (" + arr.length + "/" + max + ")"; onChange && onChange(); renderFootOnly(); },
    }),
    el("span", { class: "hint", text: hint }),
  ]));
  return box;
}
/* 자산 추가/삭제 후 하단 '다음' 버튼 활성 상태만 갱신 */
function renderFootOnly() {
  const d = state.draft; if (!d) return;
  const foot = $(".wiz-foot"); if (!foot) return;
  const btn = [...foot.querySelectorAll("button")].pop();
  const ok = STEPS[state.step].ok(d);
  if (btn) btn.disabled = !ok && state.step !== STEPS.length - 1;
  const h = foot.querySelector(".hint");
  if (h) h.textContent = ok ? "" : hintFor(state.step, d);
}

/* 7. 검토 */
function stepReview(d, w) {
  w.append(wizHead("검토 및 게재", "게재하면 " + (state.biz.period || 30) + "일치 성과가 즉시 시뮬레이션됩니다."));
  const kv = el("dl", { class: "kv" });
  const add = (k, v) => { kv.append(el("dt", { text: k })); kv.append(el("dd", { text: v })); };
  add("업체", state.biz.name + " · " + INDUSTRIES[state.biz.industry].name);
  add("캠페인", d.name);
  add("목표", GOALS[d.goal].name);
  add("위치 · 언어", GEOS[d.geo].name + " · " + LANGS[d.lang].name);
  add("일일 예산", won(d.budget) + " (총 " + won(d.budget * (state.biz.period || 30)) + ")");
  add("입찰 전략", BIDDING[d.bidding].name + (d.bidding === "target_cpa" ? " · 타겟 CPA " + won(d.targetCpa) : (d.bidding === "manual_cpc" || d.bidding === "max_clicks") ? " · 최대 CPC " + won(d.maxCpc) : ""));
  add("키워드", d.keywords.length + "개 (" + d.keywords.map(k => MATCH[k.match].fmt(k.text)).join(", ") + ")");
  add("광고", "제목 " + d.ad.headlines.filter(Boolean).length + "개 · 설명 " + d.ad.descriptions.filter(Boolean).length + "개 · 확장 " + (d.ad.sitelinks.filter(Boolean).length + d.ad.callouts.filter(Boolean).length) + "개");
  add("전환 추적", d.conversionTracking ? "사용" : "사용 안 함");
  w.append(el("div", { class: "card" }, [el("div", { class: "card-body" }, [kv])]));

  /* 게재 전 경고 */
  const warns = [];
  if (d.budget * (state.biz.period || 30) > state.biz.targets.budgetTotal) warns.push("총 예산이 실습 목표 예산을 초과합니다.");
  if (!d.conversionTracking) warns.push("전환 추적이 꺼져 있어 전환이 0으로 측정됩니다.");
  if (d.keywords.every(k => k.match === "broad")) warns.push("모든 키워드가 확장검색입니다. 무관한 검색어에 예산이 샐 수 있습니다.");
  if (d.ad.headlines.filter(Boolean).length < 8) warns.push("제목이 " + d.ad.headlines.filter(Boolean).length + "개입니다. 8개 이상을 권장합니다.");
  if (GEOS[d.geo].mismatch || LANGS[d.lang].mismatch) warns.push("타겟 지역·언어가 실제 서비스 범위를 넘습니다.");
  if (warns.length) w.append(el("div", { class: "banner banner-warn", html: ICON.warn + "<div><b>게재 전 확인</b><ul style='margin:6px 0 0;padding-left:18px'>" + warns.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul><div style='margin-top:6px;color:var(--ink-2)'>일부러 이대로 게재해 결과를 비교해 보는 것도 좋은 실습입니다.</div></div>" }));
}

function publish() {
  const d = state.draft;
  d.ad.headlines = d.ad.headlines.filter(Boolean);
  d.ad.descriptions = d.ad.descriptions.filter(Boolean);
  d.ad.sitelinks = d.ad.sitelinks.filter(Boolean);
  d.ad.callouts = d.ad.callouts.filter(Boolean);
  d.biz = state.biz;
  const c = wrapCampaign(JSON.parse(JSON.stringify(d)));
  state.campaigns.push(c);
  state.current = state.campaigns.length - 1;
  save(); closeWizard(); go("diagnostics");
}

/* ════════════════════════════════════════════════════════
   초기화
   ════════════════════════════════════════════════════════ */
$("#btnMenu").addEventListener("click", toggleNav);
$("#navBackdrop").addEventListener("click", closeNav);
$("#fabNew").addEventListener("click", () => startWizard());
$("#btnTheme").addEventListener("click", () => {
  const r = document.documentElement;
  const isDark = r.getAttribute("data-theme") === "dark" ||
    (!r.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  r.setAttribute("data-theme", isDark ? "light" : "dark");
});
$("#btnReset").addEventListener("click", () => {
  if (!confirm("실습 데이터를 모두 지웁니다. 계속할까요?")) return;
  try { localStorage.removeItem(LS); } catch (e) { }
  state.biz = null; state.campaigns = []; state.current = 0;
  go("overview");
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (state.draft) closeWizard(); else closeNav();
});

load();
renderNav();
render();

</script>
</body>
