/* ── 제외 키워드 ─────────────────────────────────────── */
function pageNegatives() {
  const w = el("div", { class: "grid" });
  w.append(head("제외 키워드"));
  if (!state.campaigns.length) return emptyPage(w, "데이터가 없습니다", "캠페인을 게재한 뒤 검색어 보고서에서 제외할 표현을 찾습니다.");
  const c = cur();
  w.append(campaignTabs("negatives"));
  const negs = c.cfg.negatives || [];

  w.append(el("div", { class: "banner banner-info", html: ICON.info + "<div>검색어 보고서에서 무관한 검색어를 찾아 제외 키워드로 등록하고, 다시 게재해 낭비가 줄었는지 확인합니다. 이 <b>발견 → 제외 → 재게재</b> 루프가 검색 광고 운영의 핵심입니다.</div>" }));

  if (!negs.length) {
    w.append(el("div", { class: "card" }, [el("div", { class: "empty" }, [
      el("h3", { text: "등록된 제외 키워드가 없습니다" }),
      el("p", { text: "검색어 화면에서 무관한 검색어 옆의 ‘제외’ 버튼을 누르면 여기에 쌓입니다." }),
      el("button", { class: "btn btn-primary", text: "검색어 보고서 보기", onclick: () => go("searchterms") }),
    ])]));
  } else {
    const t = tbl(["제외 키워드", "유형", "실제로 막은 검색어"]);
    negs.forEach(n => {
      const rec = (c.sim.negatives || []).find(x => x.text === n.text && x.match === n.match);
      t.body.append(el("tr", {}, [
        td(MATCH[n.match].fmt(n.text)), td(MATCH[n.match].name),
        td(rec && rec.blocked.length ? rec.blocked.slice(0, 5).join(", ") + (rec.blocked.length > 5 ? " 외 " + (rec.blocked.length - 5) + "개" : "") : "막은 검색어 없음"),
      ]));
    });
    w.append(el("div", { class: "card" }, [
      el("div", { class: "card-head" }, [el("h3", { text: negs.length + "개 등록됨" })]),
      el("div", { class: "tbl-wrap" }, [t.table]),
    ]));
  }

  /* 보류 중인 제외 키워드 — 재게재해야 반영된다 */
  const pend = state.pendingNegatives || [];
  if (pend.length) {
    const chips = el("div", { class: "chips" });
    pend.forEach((n, i) => chips.append(el("span", { class: "chip" }, [
      document.createTextNode(MATCH[n.match].fmt(n.text)),
      el("button", { "aria-label": "빼기", html: ICON.x, onclick: () => { pend.splice(i, 1); render(); } }),
    ])));
    w.append(el("div", { class: "card" }, [
      el("div", { class: "card-head" }, [el("h3", { text: "추가 대기 " + pend.length + "개" }),
        el("span", { class: "sub", text: "재게재해야 반영됩니다" })]),
      el("div", { class: "card-body grid", style: "gap:14px" }, [chips,
        el("div", { style: "display:flex;gap:12px;flex-wrap:wrap" }, [
          el("button", {
            class: "btn btn-primary", text: "제외 키워드 적용해 다시 게재", onclick: () => {
              const cfg = JSON.parse(JSON.stringify(normCfg(c.cfg)));
              cfg.negatives = (cfg.negatives || []).concat(pend);
              cfg.name = c.cfg.name.replace(/ \(제외 \d+차\)$/, "") + " (제외 " + ((c.cfg.negatives || []).length ? "2" : "1") + "차)";
              cfg.biz = state.biz;
              state.campaigns.push(wrapCampaign(cfg));
              state.current = state.campaigns.length - 1;
              state.pendingNegatives = [];
              save(); go("compare");
            }
          }),
          el("button", { class: "btn btn-text", text: "모두 비우기", onclick: () => { state.pendingNegatives = []; render(); } }),
        ])]),
    ]));
  }
  return w;
}

/* ── 게재위치 (디스플레이) ───────────────────────────── */
function pagePlacements() {
  const w = el("div", { class: "grid" });
  w.append(head("게재위치"));
  if (!state.campaigns.length) return emptyPage(w, "데이터가 없습니다", "디스플레이 캠페인을 게재하면 지면별 실적이 나옵니다.");
  const c = cur();
  w.append(campaignTabs("placements"));
  if (!c.sim.isDisplay) {
    w.append(el("div", { class: "banner banner-info", html: ICON.info + "<div>이 캠페인은 검색 캠페인입니다. 게재위치 보고서는 디스플레이 캠페인에서만 나옵니다.</div>" }));
    return w;
  }
  const m = c.sim.metrics;
  w.append(el("div", { class: "banner banner-warn", html: ICON.warn + "<div>전체 비용의 <b>" + pct(m.wasteShare, 1) + "</b>(" + won(m.wasteCost) + ")이 <b>느슨하거나 무관한 지면</b>에 쓰였습니다. 무관한 앱은 <b>클릭률이 오히려 높습니다</b> — 실수 클릭이기 때문입니다.</div>" }));

  const pend = state.pendingPlacements || [];
  const t = tbl(["게재위치", "관련도", "노출수", "클릭수", "CTR", "비용", convName(c.cfg.biz), "제외"]);
  c.sim.placements.forEach(p => {
    const tag = p.rel === "relevant" ? ["tag-good", "관련"] : p.rel === "loose" ? ["tag-warn", "느슨함"] : ["tag-crit", "무관"];
    const already = (c.cfg.display.excludedPlacements || []).includes(p.name);
    const queued = pend.includes(p.name);
    t.body.append(el("tr", {}, [
      td(p.name), td(el("span", { class: "tag " + tag[0], text: tag[1] })),
      td(int(p.impr)), td(int(p.clicks)), td(pct(p.clicks / Math.max(1, p.impr), 3)),
      td(won(p.cost)), td(p.conv.toFixed(1)),
      td(already ? el("span", { class: "tag tag-mute", text: "제외됨" })
        : el("button", {
          class: "btn btn-text btn-sm", style: "padding:2px 10px",
          text: queued ? "대기 중" : "제외",
          disabled: queued || undefined,
          onclick: () => { (state.pendingPlacements = state.pendingPlacements || []).push(p.name); render(); },
        })),
    ]));
  });
  w.append(el("div", { class: "card" }, [
    el("div", { class: "card-head" }, [el("h3", { text: "게재위치 보고서" }),
      el("span", { class: "sub", text: DISPLAY_TARGETING[c.cfg.display.targeting].name + " · 빈도 " + c.cfg.display.frequencyCap + "회/일" })]),
    el("div", { class: "tbl-wrap" }, [t.table]),
  ]));

  if (pend.length) {
    w.append(el("div", { class: "card" }, [
      el("div", { class: "card-head" }, [el("h3", { text: "제외 대기 " + pend.length + "곳" })]),
      el("div", { class: "card-body", style: "display:flex;gap:12px;flex-wrap:wrap;align-items:center" }, [
        el("span", { class: "hint", text: pend.join(", ") }),
        el("button", {
          class: "btn btn-primary", text: "제외하고 다시 게재", onclick: () => {
            const cfg = JSON.parse(JSON.stringify(normCfg(c.cfg)));
            cfg.display.excludedPlacements = (cfg.display.excludedPlacements || []).concat(pend);
            cfg.name = c.cfg.name.replace(/ \(제외 \d+차\)$/, "") + " (제외 1차)";
            cfg.biz = state.biz;
            state.campaigns.push(wrapCampaign(cfg));
            state.current = state.campaigns.length - 1;
            state.pendingPlacements = [];
            save(); go("compare");
          }
        }),
        el("button", { class: "btn btn-text", text: "비우기", onclick: () => { state.pendingPlacements = []; render(); } }),
      ]),
    ]));
  }
  return w;
}

/* ── 캠페인 비교 ─────────────────────────────────────── */
function pageCompare() {
  const w = el("div", { class: "grid" });
  w.append(head("캠페인 비교"));
  if (state.campaigns.length < 2) {
    w.append(el("div", { class: "card" }, [el("div", { class: "empty" }, [
      el("h3", { text: "비교하려면 캠페인이 2개 이상 필요합니다" }),
      el("p", { text: "설정을 하나만 바꿔 다시 게재하면, 그 변화가 성과에 어떤 영향을 줬는지 나란히 볼 수 있습니다." }),
      state.campaigns.length ? el("button", { class: "btn btn-primary", text: "설정 바꿔서 다시 게재", onclick: () => startWizard(cur().cfg) }) : null,
    ])]));
    return w;
  }
  const base = state.campaigns[0];
  const cn = convName(base.cfg.biz);
  const rows = [
    ["점수", c => c.diag.score + "점", (a, b) => b.diag.score - a.diag.score],
    ["노출수", c => int(c.sim.metrics.impr), (a, b) => b.sim.metrics.impr - a.sim.metrics.impr],
    ["클릭수", c => int(c.sim.metrics.clicks), (a, b) => b.sim.metrics.clicks - a.sim.metrics.clicks],
    ["CTR", c => pct(c.sim.metrics.ctr), (a, b) => b.sim.metrics.ctr - a.sim.metrics.ctr],
    ["평균 CPC", c => won(c.sim.metrics.cpc), (a, b) => a.sim.metrics.cpc - b.sim.metrics.cpc],
    ["비용", c => won(c.sim.metrics.cost), null],
    [cn, c => c.sim.metrics.conv.toFixed(1) + "건", (a, b) => b.sim.metrics.conv - a.sim.metrics.conv],
    ["전환당비용", c => c.sim.metrics.cpa === Infinity ? "—" : won(c.sim.metrics.cpa), (a, b) => a.sim.metrics.cpa - b.sim.metrics.cpa],
    ["무관 비용 비중", c => pct(c.sim.metrics.wasteShare, 1), (a, b) => a.sim.metrics.wasteShare - b.sim.metrics.wasteShare],

const tipEl = () => $("#tip");
function showTip(host, x, y, html) {
  const t = tipEl(); t.innerHTML = html; t.style.opacity = "1";
  const hr = host.getBoundingClientRect(), tr = t.getBoundingClientRect();
  let left = x + 14, top = y - tr.height - 10;
  if (left + tr.width > window.innerWidth - 8) left = x - tr.width - 14;
  if (top < 8) top = y + 18;
  t.style.left = left + "px"; t.style.top = top + "px";
}
const hideTip = () => { tipEl().style.opacity = "0"; };

const METRICS = {
  impr: { label: "노출수", fmt: int, key: "impr" },

function lineChart(c, metricKey) {
  const M = METRICS[metricKey];
  const data = c.sim.daily;
  const W = 960, H = 240, P = { t: 16, r: 16, b: 30, l: 62 };
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const vals = data.map(d => d[M.key]);
  const max = Math.max(1, ...vals) * 1.12;
  const x = i => P.l + (iw * i) / Math.max(1, data.length - 1);
  const y = v => P.t + ih - (v / max) * ih;

  const wrap = el("div", { class: "chart-wrap" });
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", "일별 " + M.label + " 추이");
  const mk = (t, a) => { const n = document.createElementNS(ns, t); for (const k in a) n.setAttribute(k, a[k]); return n; };

  /* 가로 그리드 + y축 라벨 */
  for (let i = 0; i <= 4; i++) {
    const v = (max / 4) * i, yy = y(v);
    svg.append(mk("line", { x1: P.l, x2: W - P.r, y1: yy, y2: yy, class: "gridline" }));
    const lb = mk("text", { x: P.l - 10, y: yy + 4, "text-anchor": "end", class: "ax" });
    lb.textContent = metricKey === "cost" ? "₩" + Math.round(v / 1000) + "k" : Math.round(v).toLocaleString("ko-KR");
    svg.append(lb);
  }
  /* 학습 기간 / 예산 소진일 음영 */
  const learnDays = data.filter(d => d.learning).length;
  if (learnDays) {
    svg.append(mk("rect", { x: P.l, y: P.t, width: (iw * (learnDays - 1)) / Math.max(1, data.length - 1), height: ih, fill: "var(--blue-soft)", opacity: ".55" }));
    const lt = mk("text", { x: P.l + 6, y: P.t + 14, class: "ax" }); lt.textContent = "학습 기간";
    svg.append(lt);
  }
  data.forEach((d, i) => {
    if (d.budgetCapped) svg.append(mk("line", { x1: x(i), x2: x(i), y1: P.t, y2: P.t + ih, stroke: "var(--mark-crit)", "stroke-width": 1, opacity: ".2" }));
  });

  /* 영역 + 선 */
  const line = data.map((d, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(d[M.key]).toFixed(1)).join(" ");
  const area = line + " L" + x(data.length - 1) + " " + (P.t + ih) + " L" + P.l + " " + (P.t + ih) + " Z";
  const gid = "g" + metricKey;
  const defs = mk("defs", {});
  const lg = mk("linearGradient", { id: gid, x1: "0", y1: "0", x2: "0", y2: "1" });
  lg.append(mk("stop", { offset: "0%", "stop-color": "var(--series)", "stop-opacity": ".26" }));
  lg.append(mk("stop", { offset: "100%", "stop-color": "var(--series)", "stop-opacity": "0" }));
  defs.append(lg); svg.append(defs);
  svg.append(mk("path", { d: area, fill: "url(#" + gid + ")" }));
  svg.append(mk("path", { d: line, fill: "none", stroke: "var(--series)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
  /* 끝점 강조 */
  const last = data.length - 1;
  svg.append(mk("circle", { cx: x(last), cy: y(data[last][M.key]), r: 4.5, fill: "var(--series)", stroke: "var(--surface)", "stroke-width": 2 }));

  /* x축 라벨 (5개) */
  svg.append(mk("line", { x1: P.l, x2: W - P.r, y1: P.t + ih, y2: P.t + ih, class: "axline" }));
  [0, Math.floor(last / 4), Math.floor(last / 2), Math.floor((3 * last) / 4), last].forEach(i => {
    const t = mk("text", { x: x(i), y: H - 10, "text-anchor": "middle", class: "ax" });
    t.textContent = data[i].date.slice(5);
    svg.append(t);
  });

  /* 크로스헤어 + 툴팁 */
  const cross = mk("line", { x1: 0, x2: 0, y1: P.t, y2: P.t + ih, stroke: "var(--ink-3)", "stroke-width": 1, opacity: "0" });
  const dot = mk("circle", { r: 5, fill: "var(--series)", stroke: "var(--surface)", "stroke-width": 2, opacity: "0" });
  svg.append(cross); svg.append(dot);
  const hit = mk("rect", { x: P.l, y: P.t, width: iw, height: ih, fill: "transparent" });
  svg.append(hit);
  hit.addEventListener("mousemove", e => {
    const r = svg.getBoundingClientRect();
    const px = ((e.clientX - r.left) / r.width) * W;
    const i = clamp(Math.round(((px - P.l) / iw) * (data.length - 1)), 0, data.length - 1);
    const d = data[i];
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("opacity", ".45");
    dot.setAttribute("cx", x(i)); dot.setAttribute("cy", y(d[M.key])); dot.setAttribute("opacity", "1");
    showTip(wrap, e.clientX, e.clientY,
      "<b>" + d.date + "</b> (" + dowOf(d.date) + ")<br>" + M.label + " <b>" + M.fmt(d[M.key]) + "</b>" +
      (d.budgetCapped ? "<br><span style='color:#f6aea9'>예산 소진으로 노출 중단</span>" : "") +
      (d.learning ? "<br>자동 입찰 학습 기간" : ""));
  });
  hit.addEventListener("mouseleave", () => { cross.setAttribute("opacity", "0"); dot.setAttribute("opacity", "0"); hideTip(); });
  wrap.append(svg);
  return wrap;
}

/* 비용 구성: 검색어 관련도별 (파랑 계열 = 우리 고객, 빨강 = 무관) */
function wasteChartCard(c) {
  const cats = [
    { key: "exact", label: "정확 일치", color: "var(--series)" },
    { key: "close", label: "관련", color: "var(--series-2)" },
    { key: "loose", label: "느슨함", color: "var(--series-3)" },
    { key: "off", label: "무관 (고객 아님)", color: "var(--mark-crit)" },
  ];
  const totals = {};
  cats.forEach(k => totals[k.key] = 0);
  c.sim.queries.forEach(q => { totals[q.rel] = (totals[q.rel] || 0) + q.cost; });
  const sum = Math.max(1, Object.values(totals).reduce((a, b) => a + b, 0));

  const wrap = el("div", { class: "chart-wrap" });
  const ns = "http://www.w3.org/2000/svg";
  const W = 960, H = 66;
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", "검색어 관련도별 비용 구성");
  const mk = (t, a) => { const n = document.createElementNS(ns, t); for (const k in a) n.setAttribute(k, a[k]); return n; };
  let cx = 0;
  cats.forEach(cat => {
    const v = totals[cat.key] || 0;
    const w = (v / sum) * W;
    if (w <= 0) return;
    const r = mk("rect", { x: cx + 1, y: 8, width: Math.max(0, w - 2), height: 30, rx: 4, fill: cat.color });
    r.addEventListener("mousemove", e => showTip(wrap, e.clientX, e.clientY, "<b>" + cat.label + "</b><br>" + won(v) + " · " + pct(v / sum, 1)));
    r.addEventListener("mouseleave", hideTip);
    svg.append(r);
    if (w > 76) {
      const t = mk("text", { x: cx + w / 2, y: 56, "text-anchor": "middle", class: "ax" });
      t.textContent = cat.label + " " + pct(v / sum, 0);
      svg.append(t);
    }
    cx += w;
  });
  wrap.append(svg);
  const legend = el("div", { class: "legend" });
  cats.forEach(cat => legend.append(el("span", { html: '<i style="background:' + cat.color + '"></i>' + esc(cat.label) + " · " + won(totals[cat.key] || 0) })));
  return el("div", { class: "card" }, [
    el("div", { class: "card-head" }, [el("h3", { text: "비용은 어디로 갔는가" }), el("span", { class: "sub", text: "검색어 관련도별 비용 구성" })]),
    el("div", { class: "card-body" }, [wrap, legend]),
  ]);
}

function csvEscape(v) {
  const s = String(v ?? "");
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function toCsv(rows) { return "﻿" + rows.map(r => r.map(csvEscape).join(",")).join("\r\n"); }
function downloadBlob(filename, blob) {
  const url = URL.createObjectURL(blob);
  const a = el("a", { href: url, download: filename });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
function downloadCsv(filename, rows) {
  downloadBlob(filename, new Blob([toCsv(rows)], { type: "text/csv;charset=utf-8;" }));
}

/* ── 최소 ZIP(무압축) 작성기 ───────────────────────────
   브라우저는 한 사이트가 파일을 연달아 내려받는 것을 차단한다.
   보고서 5종을 ZIP 하나로 묶어 다운로드를 1회로 만든다. */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) { let c = i; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[i] = c >>> 0; }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function makeZip(files) {                       /* files: [{name, text}] */
  const enc = new TextEncoder();
  const body = [], central = [];
  const DOS_TIME = 0, DOS_DATE = ((2026 - 1980) << 9) | (1 << 5) | 1;
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), data = enc.encode(f.text), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true);
    lh.setUint16(6, 0x0800, true);              /* 파일명 UTF-8 플래그 */
    lh.setUint16(8, 0, true);                   /* 저장(무압축) */
    lh.setUint16(10, DOS_TIME, true); lh.setUint16(12, DOS_DATE, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    body.push(new Uint8Array(lh.buffer), name, data);

    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true);
    cd.setUint16(8, 0x0800, true); cd.setUint16(10, 0, true);
    cd.setUint16(12, DOS_TIME, true); cd.setUint16(14, DOS_DATE, true);
    cd.setUint32(16, crc, true); cd.setUint32(20, data.length, true); cd.setUint32(24, data.length, true);
    cd.setUint16(28, name.length, true);
    cd.setUint32(42, offset, true);
    central.push(new Uint8Array(cd.buffer), name);
    offset += 30 + name.length + data.length;
  }
  const cdSize = central.reduce((s, c) => s + c.length, 0);
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0, 0x06054b50, true);
  eo.setUint16(8, files.length, true); eo.setUint16(10, files.length, true);
  eo.setUint32(12, cdSize, true); eo.setUint32(16, offset, true);
  return new Blob([...body, ...central, new Uint8Array(eo.buffer)], { type: "application/zip" });
}

function pageReports() {

      class: "btn btn-primary", html: ICON.down + "전체 보고서 ZIP으로 받기", onclick: () => {

  /* 미리보기 */

  w.append(el("div", { class: "card" }, [

    el("div", { class: "tbl-wrap" }, [t.table]),
  ]));
  return w;
}
const fileFor = (c, f) => (c.cfg.biz.name || "campaign").replace(/\s+/g, "_") + "_" + f;
function csvRows(r) {
  const rows = [];
  if (r.meta) { r.meta.forEach(m => rows.push(m)); }
  rows.push(r.head);
  r.rows.forEach(x => rows.push(x));
  if (r.total) rows.push(r.total);
  return rows;
}

/* ════════════════════════════════════════════════════════
   캠페인 만들기 마법사
   ════════════════════════════════════════════════════════ */
function blankAd(biz, brandWord) {
  return { finalUrl: biz.url, path1: "", path2: "", headlines: [brandWord].filter(Boolean), descriptions: [], sitelinks: [], callouts: [] };
}
function newDraft(from) {
  const b = state.biz;
  const brandWord = (b.name || "").split(/\s+/)[0] || "";
  if (from) {
    const c = JSON.parse(JSON.stringify(normCfg(from)));
    c.biz = b; c.name = from.name + " (재게재)";
    return c;
  }
  const goal0 = b.model === "lead" ? "leads" : "sales";
  return {
    name: "검색 캠페인 " + (state.campaigns.length + 1),
    type: "search", goal: goal0,
    bidding: "max_clicks", budget: 30000, targetCpa: recommendedCpa(b, goal0).mid, maxCpc: 1200,
    geo: "kr", lang: "ko", displayExpansion: false, conversionTracking: true,
    adGroups: [{ name: "광고그룹 1", keywords: [], ad: blankAd(b, brandWord) }],
    negatives: [],
    bidAdj: JSON.parse(JSON.stringify(DEFAULT_BIDADJ)),
    display: { targeting: "audience", frequencyCap: 3, excludedPlacements: [] },
    biz: b,
  };
}
function startWizard(from) {
  if (!hasBiz()) { go("business"); return; }
  state.draft = newDraft(from && (from.goal || from.adGroups) ? from : null);
  state.step = 0;
  state.agTab = 0;
  $("#wizard").classList.add("on");
  document.body.style.overflow = "hidden";
  renderWizard();
}
function closeWizard() {
  $("#wizard").classList.remove("on");
  document.body.style.overflow = "";
  state.draft = null;
}

const adsOk = d => d.adGroups.every(g =>
  g.ad.headlines.filter(Boolean).length >= 3 &&
  g.ad.descriptions.filter(Boolean).length >= 2 &&
  /^https?:\/\/.+/.test(g.ad.finalUrl));

const STEPS = [
  { t: "캠페인 목표", r: stepGoal, ok: d => !!d.goal },
  { t: "캠페인 유형", r: stepType, ok: () => true },
  { t: "캠페인 설정", r: stepSettings, ok: d => d.name.trim().length > 0 },
  { t: "예산 및 입찰", r: stepBudget, ok: d => d.budget >= 1000 },
  { t: "입찰 조정", r: stepBidAdj, ok: () => true },
  { t: d => d.type === "display" ? "타겟팅" : "광고그룹 및 키워드", r: stepGroups,
    ok: d => d.type === "display" ? true : d.adGroups.every(g => g.name.trim()) && d.adGroups.some(g => g.keywords.length > 0) },
  { t: "광고 만들기", r: stepAd, ok: adsOk },
  { t: "제외 키워드", r: stepNegatives, ok: () => true, skip: d => d.type === "display" },
  { t: "검토 및 게재", r: stepReview, ok: () => true },
];
const liveSteps = d => STEPS.filter(s => !(s.skip && s.skip(d)));
const stepTitle = (s, d) => typeof s.t === "function" ? s.t(d) : s.t;

function renderWizard() {
  const d = state.draft, host = $("#wizard");
  const steps = liveSteps(d);
  if (state.step >= steps.length) state.step = steps.length - 1;
  host.innerHTML = "";
  host.append(el("div", { class: "wiz-top" }, [
    el("button", { class: "icon-btn", "aria-label": "닫기", html: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>', onclick: closeWizard }),
    el("div", { class: "brand" }, [el("span", { class: "brand-text", html: "<b>Google</b> <span>Ads</span>" })]),
    el("div", { style: "flex:1" }),
    el("span", { class: "hint", text: state.biz.name + " · " + INDUSTRIES[state.biz.industry].name }),
  ]));

  const body = el("div", { class: "wiz-body" });
  const rail = el("div", { class: "wiz-steps" });
  steps.forEach((s, i) => rail.append(el("div", {
    class: "step " + (i < state.step ? "done" : i === state.step ? "now" : ""),
    style: i < state.step ? "cursor:pointer" : "",
    onclick: i < state.step ? () => { state.step = i; renderWizard(); } : null,
  }, [
    el("span", { class: "dot", text: i < state.step ? "✓" : String(i + 1) }),
    el("span", { text: stepTitle(s, d) }),
  ])));
  body.append(rail);

  const mainCol = el("div", { class: "wiz-main" });
  const inner = el("div", { class: "wiz-inner" });
  steps[state.step].r(d, inner);
  mainCol.append(inner); body.append(mainCol);
  host.append(body);

  const canNext = steps[state.step].ok(d);
  const last = state.step === steps.length - 1;
  host.append(el("div", { class: "wiz-foot" }, [
    state.step > 0 ? el("button", { class: "btn btn-text", text: "뒤로", onclick: () => { state.step--; renderWizard(); } }) : null,
    el("div", { class: "spacer" }),
    !canNext ? el("span", { class: "hint warn", text: hintFor(steps[state.step], d) }) : null,
    last
      ? el("button", { class: "btn btn-primary", text: "게재하기", onclick: publish })
      : el("button", { class: "btn btn-primary", text: "다음", disabled: !canNext || undefined, onclick: () => { state.step++; renderWizard(); } }),
  ]));
}
function hintFor(s, d) {
  const t = stepTitle(s, d);
  if (t === "캠페인 설정") return "캠페인 이름을 입력하세요.";
  if (t === "예산 및 입찰") return "일일 예산은 1,000원 이상이어야 합니다.";
  if (t === "광고그룹 및 키워드") {
    if (!d.adGroups.every(g => g.name.trim())) return "광고그룹 이름을 입력하세요.";
    return "키워드를 최소 1개 입력하세요.";
  }
  if (t === "광고 만들기") {
    const bad = d.adGroups.find(g => !/^https?:\/\/.+/.test(g.ad.finalUrl));
    if (bad) return "‘" + bad.name + "’의 최종 URL을 https:// 형식으로 입력하세요.";
    const h = d.adGroups.find(g => g.ad.headlines.filter(Boolean).length < 3);
    if (h) return "‘" + h.name + "’의 제목이 3개 미만입니다.";
    const p = d.adGroups.find(g => g.ad.descriptions.filter(Boolean).length < 2);
    if (p) return "‘" + p.name + "’의 설명이 2개 미만입니다.";
  }
  return "";
}

    if (/^".+"$/.test(s)) return { text: s.slice(1, -1).trim(), match: "phrase" };
    return { text: s, match: "broad" };
  }).filter(k => k.text);
}

  const steps = liveSteps(d);
  const btn = [...foot.querySelectorAll("button")].pop();
  const ok = steps[state.step].ok(d);
  if (btn) btn.disabled = !ok && state.step !== steps.length - 1;
  let h = foot.querySelector(".hint");
  if (!h && !ok) { h = el("span", { class: "hint warn" }); foot.insertBefore(h, btn); }
  if (h) h.textContent = ok ? "" : hintFor(steps[state.step], d);
}

/* 8. 제외 키워드 */
function stepNegatives(d, w) {
  w.append(wizHead("제외 키워드", "여기 적은 표현이 들어간 검색어에는 광고가 나가지 않습니다. 게재 후 검색어 보고서를 보고 계속 추가하게 됩니다."));
  const ta = el("textarea", {
    class: "inp", style: "min-height:120px",
    value: d.negatives.map(k => MATCH[k.match].fmt(k.text)).join("\n"),
    placeholder: "무료\n채용\n[헬스장]",
    oninput: e => { d.negatives = parseKeywords(e.target.value); paint(); },
  });
  w.append(el("div", { class: "field" }, [
    el("label", { text: "제외 키워드 (한 줄에 하나)" }), ta,
    el("div", { class: "hint", html: "<b>무료</b> = 확장 제외(단어가 모두 들어가면 차단) · <b>\"무료 강의\"</b> = 구문 제외 · <b>[무료]</b> = 일치 제외(정확히 같을 때만)" }),
  ]));
  const ind = INDUSTRIES[state.biz.industry];
  const sug = el("div", { class: "chips" });
  [...ind.off.slice(0, 8), ...tokenize(state.biz.exclude)].forEach(s => sug.append(el("button", {
    class: "chip", text: "+ " + s,
    onclick: () => { ta.value = (ta.value ? ta.value + "\n" : "") + s; d.negatives = parseKeywords(ta.value); paint(); },
  })));
  w.append(el("div", { class: "field" }, [el("label", { text: "이 업종에서 흔히 제외하는 표현" }), sug]));

  const host = el("div"); w.append(host);
  function paint() {
    host.innerHTML = "";
    if (!d.negatives.length) return;
    const prof = bizProfile(state.biz);
    const rows = [];
    let selfHit = 0;
    d.adGroups.forEach(g => g.keywords.forEach(k => {
      const o = classifyKeyword(k.text, prof);
      const qs = buildQueries(o, k.match, mulberry32(hashStr(k.text + k.match + state.biz.industry)), prof);
      const blocked = qs.filter(q => negBlocks(q.q, d.negatives));
      if (blocked.some(q => q.q === k.text)) selfHit++;
      if (blocked.length) rows.push([k.text, blocked.length + " / " + qs.length, blocked.slice(0, 3).map(q => q.q).join(", ")]);
    }));
    if (selfHit) host.append(el("div", { class: "banner banner-warn", html: ICON.warn + "<div>제외 키워드가 <b>내 키워드 " + selfHit + "개</b>까지 막고 있습니다. 그 키워드는 노출이 아예 나오지 않습니다.</div>" }));
    if (!rows.length) { host.append(el("div", { class: "hint", text: "지금 키워드로는 막히는 검색어가 없습니다." })); return; }
    const t = tbl(["키워드", "차단되는 검색어", "예시"]);
    rows.forEach(r => t.body.append(el("tr", {}, r.map(v => td(v)))));
    host.append(el("div", { class: "card" }, [
      el("div", { class: "card-head" }, [el("h3", { text: "무엇이 막히는지 미리보기" })]),
      el("div", { class: "tbl-wrap" }, [t.table]),
    ]));
  }
  paint();
}

/* 9. 검토 */
function stepReview(d, w) {
  w.append(wizHead("검토 및 게재", "게재하면 " + (state.biz.period || 30) + "일치 성과가 즉시 시뮬레이션됩니다."));
  const kv = el("dl", { class: "kv" });
  const add = (k, v) => { kv.append(el("dt", { text: k })); kv.append(el("dd", { text: v })); };
  add("업체", state.biz.name + " · " + INDUSTRIES[state.biz.industry].name);
  add("캠페인", d.name + " · " + CAMPAIGN_TYPES[d.type].name);
  add("목표", GOALS[d.goal].name);
  add("위치 · 언어", GEOS[d.geo].name + " · " + LANGS[d.lang].name);
  add("일일 예산", won(d.budget) + " (총 " + won(d.budget * (state.biz.period || 30)) + ")");
  add("입찰 전략", BIDDING[d.bidding].name + (d.bidding === "target_cpa" ? " · 타겟 CPA " + won(d.targetCpa) : (d.bidding === "manual_cpc" || d.bidding === "max_clicks") ? " · 최대 CPC " + won(d.maxCpc) : ""));
  const adjParts = [];
  DEVICES.forEach(dv => { if (d.bidAdj.device[dv]) adjParts.push(DEV_LABEL[dv] + " " + (d.bidAdj.device[dv] > 0 ? "+" : "") + Math.round(d.bidAdj.device[dv] * 100) + "%"); });
  HOUR_BLOCKS.forEach(b => { if (d.bidAdj.block[b.key]) adjParts.push(b.name.split(" ")[0] + " " + (d.bidAdj.block[b.key] > 0 ? "+" : "") + Math.round(d.bidAdj.block[b.key] * 100) + "%"); });
  if (d.bidAdj.weekend) adjParts.push("주말 " + (d.bidAdj.weekend > 0 ? "+" : "") + Math.round(d.bidAdj.weekend * 100) + "%");
  add("입찰 조정", adjParts.length ? adjParts.join(" · ") : "없음");
  if (d.type === "search") {
    add("광고그룹", d.adGroups.length + "개");
    d.adGroups.forEach(g => add("　" + g.name, g.keywords.length + "개 · " + g.keywords.map(k => MATCH[k.match].fmt(k.text)).join(", ")));
    add("제외 키워드", d.negatives.length ? d.negatives.map(k => MATCH[k.match].fmt(k.text)).join(", ") : "없음");
  } else {
    add("타겟팅", DISPLAY_TARGETING[d.display.targeting].name);
    add("빈도 한도", d.display.frequencyCap + "회/일");
  }
  add("광고", d.adGroups.map(g => g.name + ": 제목 " + g.ad.headlines.filter(Boolean).length + "개 · 설명 " + g.ad.descriptions.filter(Boolean).length + "개").join(" / "));
  add("전환 추적", d.conversionTracking ? "사용" : "사용 안 함");
  w.append(el("div", { class: "card" }, [el("div", { class: "card-body" }, [kv])]));

  const warns = [];
  const allKw = d.adGroups.flatMap(g => g.keywords);
  if (d.budget * (state.biz.period || 30) > state.biz.targets.budgetTotal) warns.push("총 예산이 실습 목표 예산을 초과합니다.");
  if (!d.conversionTracking) warns.push("전환 추적이 꺼져 있어 전환이 0으로 측정됩니다.");
  if (d.type === "search") {
    if (allKw.length && allKw.every(k => k.match === "broad")) warns.push("모든 키워드가 확장검색입니다. 무관한 검색어에 예산이 샐 수 있습니다.");
    if (!d.negatives.length) warns.push("제외 키워드가 없습니다. 게재 후 검색어 보고서를 보고 추가하게 됩니다.");
    if (d.adGroups.length === 1 && allKw.length >= 6) warns.push("키워드 " + allKw.length + "개가 광고그룹 하나에 몰려 있습니다. 주제별로 나누면 품질평가점수가 올라갑니다.");
  } else {
    if (d.display.frequencyCap >= 6) warns.push("노출 빈도 한도가 높습니다. 같은 사람에게 반복 노출됩니다.");
    if (d.display.targeting === "audience") warns.push("잠재고객 타겟팅은 도달이 넓은 대신 무관한 지면이 많이 섞입니다.");
  }
  if (d.adGroups.some(g => g.ad.headlines.filter(Boolean).length < 8)) warns.push("제목이 8개 미만인 광고그룹이 있습니다.");
  if (GEOS[d.geo].mismatch || LANGS[d.lang].mismatch) warns.push("타겟 지역·언어가 실제 서비스 범위를 넘습니다.");
  if (warns.length) w.append(el("div", { class: "banner banner-warn", html: ICON.warn + "<div><b>게재 전 확인</b><ul style='margin:6px 0 0;padding-left:18px'>" + warns.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul><div style='margin-top:6px;color:var(--ink-2)'>일부러 이대로 게재해 결과를 비교해 보는 것도 좋은 실습입니다.</div></div>" }));
}

function publish() {
  const d = state.draft;
  d.adGroups.forEach(g => {
    g.ad.headlines = g.ad.headlines.filter(Boolean);
    g.ad.descriptions = g.ad.descriptions.filter(Boolean);
    g.ad.sitelinks = g.ad.sitelinks.filter(Boolean);
    g.ad.callouts = g.ad.callouts.filter(Boolean);
  });
  d.biz = state.biz;
  const c = wrapCampaign(JSON.parse(JSON.stringify(d)));
  state.campaigns.push(c);
  state.current = state.campaigns.length - 1;
  save(); closeWizard(); go("diagnostics");
}

/* ════════════════════════════════════════════════════════
   초기화
   ════════════════════════════════════════════════════════ */
$("#btnMenu").addEventListener("click", toggleNav);
$("#navBackdrop").addEventListener("click", closeNav);
$("#fabNew").addEventListener("click", () => startWizard());
$("#btnTheme").addEventListener("click", () => {
  const r = document.documentElement;
  const isDark = r.getAttribute("data-theme") === "dark" ||
    (!r.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  r.setAttribute("data-theme", isDark ? "light" : "dark");
});
$("#btnReset").addEventListener("click", () => {
  if (!confirm("실습 데이터를 모두 지웁니다. 계속할까요?")) return;
  try { localStorage.removeItem(LS); } catch (e) { }
  state.biz = null; state.campaigns = []; state.current = 0;
  go("overview");
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (state.draft) closeWizard(); else closeNav();
});

load();
renderNav();
render();

</script>
